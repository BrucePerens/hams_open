# convertible-power: UPower settings, used instead of /etc/UPower/UPower.conf through the
# UPOWER_CONF_FILE_NAME drop-in for upower.service (that file stays untouched).
# SPDX-License-Identifier: GPL-3.0-or-later
[UPower]
EnableWattsUpPro=false
NoPollBatteries=false
IgnoreLid=false
UsePercentageForPolicy=true
# Warn at 20%, critical warning at 12%, and at 10% do the critical action: the battery is never run lower.
PercentageLow=20.0
PercentageCritical=12.0
PercentageAction=10.0
TimeLow=1200
TimeCritical=300
TimeAction=120
AllowRiskyCriticalPowerAction=false
# Hibernate saves the session; UPower falls back to power-off where hibernation is not set up.
CriticalPowerAction=Hibernate
