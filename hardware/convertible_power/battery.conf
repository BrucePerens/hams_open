# Charge management for convertible-power.  These numbers are used by convertible-battery-notify.
# They are also in /etc/tlp.d/10-convertible-power.conf (charge thresholds, for firmware that can
# stop charging) and /etc/convertible-power/UPower.conf (PercentageAction, the critical action).
[battery]
max-charge = 80
min-charge = 10
