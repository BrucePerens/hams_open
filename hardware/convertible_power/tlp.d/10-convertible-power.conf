#
# convertible-power: maximum performance on AC, maximum battery life on battery.
# Device packages add 20-<device>.conf after this file (TLP reads /etc/tlp.d/*.conf in order,
# then the administrator's /etc/tlp.conf, which wins over everything here).
TLP_ENABLE=1
TLP_PERSISTENT_DEFAULT=0

# --- On AC: performance ---------------------------------------------------------------
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
PLATFORM_PROFILE_ON_AC=performance
RUNTIME_PM_ON_AC=on
WIFI_PWR_ON_AC=off
SATA_LINKPWR_ON_AC=max_performance
DISK_APM_LEVEL_ON_AC="254 254"
SOUND_POWER_SAVE_ON_AC=0

# --- On battery: efficiency -----------------------------------------------------------
# (the scaling governor is set per device, because the valid names depend on the cpufreq driver)
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
RUNTIME_PM_ON_BAT=auto
WIFI_PWR_ON_BAT=on
SATA_LINKPWR_ON_BAT=med_power_with_dipm
DISK_APM_LEVEL_ON_BAT="128 128"
AHCI_RUNTIME_PM_ON_BAT=auto
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
MAX_LOST_WORK_SECS_ON_BAT=60

# --- Both -----------------------------------------------------------------------------
NMI_WATCHDOG=0
WOL_DISABLE=Y
USB_AUTOSUSPEND=1

# --- Charge limit (applied only where the firmware exposes it; others ignore it) ------
# Charging starts below 75% and stops at 80%.  See also /etc/convertible-power/battery.conf.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80
