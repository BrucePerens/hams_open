# Installed by lenovo-thinkpad-t430-support on the ThinkPad T430 (demo laptop).
# Defaults for every connection that does not set its own: Wi-Fi power saving off (wifi.powersave=2 means disable), and
# never give up reconnecting (autoconnect-retries=0 means unlimited).  The machine must stay on the network.
# To undo: remove this file and restart NetworkManager.
[connection]
wifi.powersave=2
connection.autoconnect-retries=0
