# Lenovo ThinkPad T430 (Core i5-3230M, Ivy Bridge, intel_cpufreq (passive intel_pstate)): installed as /etc/tlp.d/20-lenovo-thinkpad-t430.conf by
# lenovo-thinkpad-t430-support on that model only.  Read after 10-convertible-power.conf.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# Charge thresholds (thinkpad_acpi exposes charge_control_{start,end}_threshold on this model).  This is a demo laptop that
# stays on the charger: 75/80 keeps the battery from sitting at 100% (convertible-power's values, restated here so a
# change to the shared package does not silently change this machine).  For a laptop that travels more, use 40/80.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# Wi-Fi (Intel Centrino Wireless-N 2200, iwldvm) is the only network in use: keep it out of power saving on battery too,
# so a demo does not stall on a sleeping radio.
WIFI_PWR_ON_BAT=off

# Do not suspend the TrackPoint/touchpad (PS/2, not USB) or the USB webcam while a demo runs.
USB_DENYLIST="04f2:b2da"
DISK_DEVICES="sda"
