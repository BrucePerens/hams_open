# HP Spectre x360 2-in-1 Laptop 16-f2xxx (13th-gen Core i7-1360P, HWP): installed as
# /etc/tlp.d/20-hp-spectre-x360-16.conf by hp-spectre-x360-16-support on that model only.
# Read after 10-convertible-power.conf.
#
# intel_pstate runs in active mode with HWP: governors performance and powersave, plus the energy preference
# set in 10-convertible-power.conf (performance on AC, power on battery).
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# hp-wmi platform profile (cool, quiet, balanced, performance).  power-profiles-daemon uses "cool" for its
# power-saving mode on this firmware; "performance" on AC.  TLP cannot read this firmware's profile back and
# so ignores these two lines today; the package's udev rule and boot service set it (set-platform-profile).
# They stay so that a future kernel that makes it readable is handled consistently.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=cool

# Recent PCIe devices handle the deepest ASPM states well; save the most on battery.
PCIE_ASPM_ON_BAT=powersupersave

# The only disk is the NVMe drive.
DISK_DEVICES="nvme0n1"
