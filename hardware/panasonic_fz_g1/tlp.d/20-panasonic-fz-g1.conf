# Panasonic Toughpad FZ-G1 (Ivy Bridge Core i5-3437U, no HWP): installed as /etc/tlp.d/20-panasonic-fz-g1.conf
# by panasonic-fz-g1-support on an FZ-G1 only.  Read after 10-convertible-power.conf.
#
# Kernel 6.12 runs intel_pstate in passive mode (intel_cpufreq) on CPUs without HWP, whose governors are
# performance and schedutil, so powersave and the energy preference do not exist here.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# The touch panel (0eef:7917), the Wacom pen (056a:00ec), the sensor hub with the accelerometer (04b5:0680) and
# the keyboard dock (hub 0424:2514, iKey keyboard 2047:0318) must never be suspended: suspending them makes input
# lag or stops the accelerometer reporting.
USB_DENYLIST="0eef:7917 056a:00ec 04b5:0680 2047:0318 0424:2514"

# Only the SATA SSD is a disk here.
DISK_DEVICES="sda"
