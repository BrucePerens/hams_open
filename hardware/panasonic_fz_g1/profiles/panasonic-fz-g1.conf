# Panasonic Toughpad FZ-G1: the tablet has no tablet-mode switch. The keyboard dock's USB device
# (iKey keyboard / mouse composite, 2047:0318, behind a 0424:2514 hub) vanishes when it is undocked.
[dock]
dmi-product-prefix = FZ-G1
usb-keyboard = 2047:0318

# GNOME does not auto-rotate this tablet (no tablet-mode switch, built-in keyboard present), so
# convertible-helper follows the accelerometer (HID sensor hub 04b5:0680, iio "accel_3d") while undocked.
# Axes: y reads about -1 g when the screen is upright; x reads about +1 g when the screen's LEFT edge is up,
# the opposite of convertible-helper's default, hence flip-x (checked by eye on 2026-10-28).
[autorotate]
dmi-product-prefix = FZ-G1
iio-name = accel_3d
flip-x = yes
