# Installed by lenovo-thinkpad-yoga-11e-support on the ThinkPad Yoga 11e (demo laptop).
# Defaults for every connection that does not set its own: Wi-Fi power saving off (wifi.powersave=2 means disable), and
# never give up reconnecting (autoconnect-retries-default=0 in [main] means unlimited for every connection whose own
# connection.autoconnect-retries is -1, the default; NetworkManager 1.52 rejects connection.autoconnect-retries in
# [connection] as an unknown key).  The machine must stay on the network.
# To undo: remove this file and restart NetworkManager.
[main]
autoconnect-retries-default=0

[connection]
wifi.powersave=2
