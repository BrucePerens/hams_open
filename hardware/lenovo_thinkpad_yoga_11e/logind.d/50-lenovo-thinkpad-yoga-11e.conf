# Installed by lenovo-thinkpad-yoga-11e-support on the ThinkPad Yoga 11e (demo laptop).
# On AC power the lid can be closed without suspending; on battery, closing the lid suspends as usual.
# Takes effect at the next boot (or systemctl restart systemd-logind, which ends no sessions on current systemd).
# To undo: remove this file.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
