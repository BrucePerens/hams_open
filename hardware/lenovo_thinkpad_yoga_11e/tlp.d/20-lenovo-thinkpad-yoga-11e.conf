# Lenovo ThinkPad Yoga 11e, first generation (20D9, Celeron N2930, Bay Trail, intel_cpufreq (passive intel_pstate)):
# installed as /etc/tlp.d/20-lenovo-thinkpad-yoga-11e.conf by lenovo-thinkpad-yoga-11e-support on that model only.
# Read after 10-convertible-power.conf.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# No charge thresholds: thinkpad_acpi exposes no charge_control_*_threshold on this model (measured 2026-11-05), so TLP
# could not apply them.  convertible-power's thresholds are left in place and simply have no effect here.

# Wi-Fi (Intel Wireless 7260, iwlmvm) must not doze during a demo, on battery either.
WIFI_PWR_ON_BAT=off

# Keep the USB webcam (Chicony 04f2:b451) and the Intel Bluetooth (8087:07dc) out of USB autosuspend while a demo runs.
USB_DENYLIST="04f2:b451 8087:07dc"
DISK_DEVICES="sda"
