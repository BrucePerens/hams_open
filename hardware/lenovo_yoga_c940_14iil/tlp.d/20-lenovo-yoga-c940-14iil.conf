# Lenovo Yoga C940-14IIL (81Q9, Ice Lake Core i7, HWP): installed as /etc/tlp.d/20-lenovo-yoga-c940-14iil.conf by
# lenovo-yoga-c940-14iil-support on that model only.  Read after 10-convertible-power.conf.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# ideapad-laptop's platform profile is readable on this machine (low-power, balanced, performance), so TLP can set it.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# Two NVMe devices: the 512 GB QLC drive and the 32 GB Optane half of the Intel Optane Memory H10.
DISK_DEVICES="nvme0n1 nvme1n1"

# This firmware accepts a write to ideapad-laptop's conservation_mode but does not keep it (reads back 0) and exposes
# no charge_control_*_threshold, so the battery thresholds of 10-convertible-power.conf cannot take effect here.
