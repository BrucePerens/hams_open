# Lenovo Yoga C940-14IIL (81Q9, Ice Lake Core i7, HWP): installed as /etc/tlp.d/20-lenovo-yoga-c940-14iil.conf by
# lenovo-yoga-c940-14iil-support on that model only.  Read after 10-convertible-power.conf.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# ideapad-laptop's platform profile is readable on this machine (low-power, balanced, performance), so TLP can set it.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# Two NVMe devices: the 512 GB QLC drive and the 32 GB Optane half of the Intel Optane Memory H10.
DISK_DEVICES="nvme0n1 nvme1n1"

# Battery: this is an IdeaPad-family machine, so TLP's ideapad battery plugin (bat.d/15-lenovo, ideapad_laptop driver) drives
# conservation_mode instead of percentage thresholds: STOP_CHARGE_THRESH_BAT0 must be 0 (off) or 1 (on), START is unused. Both BAT0 and BAT1 are set because the plugin reads one of them and this battery is named BAT1.
# Conservation mode holds the charge at about 55-60% (the firmware's fixed level; an 80% cap does not exist on this model).
# The firmware applies a write after about 3 s, so an immediate read-back still shows the old value (verified 2026-11-25 on
# yoga1 and yoga2, BIOS AUCN59WW). This overrides the 75/80 percentage thresholds of 10-convertible-power.conf, which the
# ideapad plugin rejects ("must be 0 or 1"). Off until the next boot (full charge, calibration): sudo tlp setcharge 0 0 BAT1 (BAT0 is "not present" here); TLP turns it back on at every boot.
START_CHARGE_THRESH_BAT0=
STOP_CHARGE_THRESH_BAT0=1
START_CHARGE_THRESH_BAT1=
STOP_CHARGE_THRESH_BAT1=1
