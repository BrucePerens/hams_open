# yoga-windows-vm configuration (sourced by shell).  Edit with care.
# Disk mode: "overlay" (default, safe: Windows changes go to a qcow2 overlay,
# the real partition is never written) or "raw" (Windows state persists on the
# real partition).  Change it with `yoga-windows-vm mode`, not by hand.
MODE=overlay
# Partition holding the existing Windows installation (found by PARTUUID so a
# renamed device cannot be mistaken for it).
WIN_PARTUUID=91727e4a-6ca4-4e78-a580-f823b82af2ec
# Where the host mounts it while the VM is off.
WIN_MOUNT=/windows
# Images (small virtual GPT+ESP head, GPT tail, overlay, MSDM copy, share dir).
DATA_DIR=/srv/yoga-windows-vm
# Seconds to wait for a clean ACPI shutdown before destroying the VM.
SHUTDOWN_WAIT=180
