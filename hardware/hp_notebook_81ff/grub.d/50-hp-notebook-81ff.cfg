# Installed by hp-notebook-81ff-support on the HP Notebook board 81FF.
# The Realtek RTL8188EE wireless adapter behind PCI Express root port 00:1c.5 (Intel 8086:9d15) logs hundreds of
# correctable "PCIe Bus Error ... RxErr" messages a minute while ASPM L0s/L1 is enabled.  That kept journald at about
# 23% of a CPU and the disk busy.  Kernel lockdown (Secure Boot) blocks changing ASPM at run time, so the kernel is
# told at boot.  Cost: slightly higher idle power, because the PCI Express links never enter L1 under kernel control.
# To undo: remove this file and run update-grub, then reboot.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT pcie_aspm=off"
