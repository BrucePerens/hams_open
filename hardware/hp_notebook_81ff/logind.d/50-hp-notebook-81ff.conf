# Installed by hp-notebook-81ff-support on the HP Notebook board 81FF.
# On AC power the lid can be closed without suspending (the machine is used as a build and test host, often with the lid
# shut); on battery, closing the lid suspends as usual.  Takes effect at the next boot.
# To undo: remove this file and reboot.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
