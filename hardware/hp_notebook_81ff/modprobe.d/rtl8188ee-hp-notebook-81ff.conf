# Installed by hp-notebook-81ff-support on the HP Notebook board 81FF (Realtek RTL8188EE wireless, PCI 10ec:8179).
# Turn off the driver's own ASPM use and its idle-power-save modes, which make this adapter unreliable.
# On its own this did NOT stop the PCI Express error flood; pcie_aspm=off on the kernel command line does
# (/etc/default/grub.d/50-hp-notebook-81ff.cfg).  To undo: remove the file, then reboot.
options rtl8188ee aspm=0 ips=0 fwlps=0 swlps=0
