# HP Notebook, board 81FF (Core i7-7500U, Kaby Lake, intel_pstate): installed as /etc/tlp.d/20-hp-notebook-81ff.conf by
# hp-notebook-81ff-support on that board only.  Read after 10-convertible-power.conf.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# The Realtek RTL8188EE (rtl8188ee) drops packets and logs PCI Express errors with its power saving on.  It is this
# machine's only network (the Ethernet port is usually unplugged): keep its power saving off on battery too.
WIFI_PWR_ON_BAT=off

# PCI Express ASPM is turned off on the kernel command line (pcie_aspm=off, /etc/default/grub.d/50-hp-notebook-81ff.cfg);
# TLP's PCIE_ASPM setting has no effect with that, so leave it at the kernel's value.
PCIE_ASPM_ON_BAT=default

# The only disk is the SATA drive (a 5400 rpm hard disk, or an SSD after replacement).
DISK_DEVICES="sda"
