# Panasonic Toughbook CF-19 (Sandy Bridge Core i5-2520M, no HWP): installed as /etc/tlp.d/20-panasonic-cf19.conf
# by panasonic-cf19-support on a CF-19 only.  Read after 10-convertible-power.conf.
#
# Kernel 6.12 runs intel_pstate in passive mode (intel_cpufreq) on CPUs without HWP, as it does on the Toughpad
# FZ-G1 (not yet checked on a CF-19): governors performance and schedutil.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# The touch panel (0430:0502), read by the touch relay, must never be suspended.
USB_DENYLIST="0430:0502"
