# Panasonic Toughbook CF-19: the rotation button (tablet button 3) and the "security" button
# (tablet button 4) are handled by convertible-helper so they work in any shell state.
# Button 1 (on-screen keyboard) is handled by the GNOME Shell extension cf19-osk@hams.com.
[buttons]
dmi-product-prefix = CF-19
rotate = KEY_PROG3
security = KEY_PROG1
