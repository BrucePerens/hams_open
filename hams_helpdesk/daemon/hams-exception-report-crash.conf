# Drop-in for a self-restarting daemon (Restart= other than no):
# /etc/systemd/system/<daemon>.service.d/hams-exception-report-crash.conf, next to hams-exception-report.conf.
# Reports each crash, not only the give-up. Then: systemctl daemon-reload
[Service]
ExecStopPost=-+/bin/sh -c '[ "$SERVICE_RESULT" = success ] || /usr/bin/systemctl start --no-block hams-exception-report@%n.service'
