provenance = { kind = "manual", reference = "Yaesu 'FTDX5000 Series CAT Operation Reference Book' (1907-D, Copyright 2019), file FTDX5000_CAT_OM_ENG_1907-D.pdf, https://public2024.yaesu.com/FileLibraryF/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX5000_CAT_OM_ENG_1907-D.pdf, sha256 0641c84700fe6e38f58e91ebff542d8de6181e5bc7cf819ef089d15c35dd7532: ID p. 11, FA p. 11, FB p. 11, IF p. 12, MD p. 13, TX p. 18, SM p. 18, AI p. 5, RT p. 17, XT p. 19, RC p. 16, RD p. 16", note = "The guide's command pages. Dual receiver: no split (FT selects the main or sub band transmitter), no read-power, no levels (MG and PC are 000-255 here)." }
