# Rig description: Yaesu FTDX-5000 (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Yaesu's published Yaesu 'FTDX5000 Series CAT Operation Reference Book' (document, PDF page and sha256 in each fact), with Hamlib 4.6.2 as a cross-check.
# Hamlib lists: serial 4800..38400 baud, 8N2, ctrl=CTS; receive 0.03 to 60 MHz in 2 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 8 digits (`yaesu.frequency_digits`); the IF answer is 27 characters with the semicolon.
# Gaps and open questions: Dual receiver: no split (FT selects the main or sub band transmitter), no read-power, no levels (MG and PC are 000-255 here). Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "transceive", "rit-xit", "identify"]

[rig]
id = "yaesu-ftdx-5000"
name = "Yaesu FTDX-5000"
family = "yaesu-newcat"

[yaesu]
model_id = 362
frequency_digits = 8

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide and in Hamlib 4.6.2", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1032 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu 'FTDX5000 Series CAT Operation Reference Book' (1907-D, Copyright 2019), file FTDX5000_CAT_OM_ENG_1907-D.pdf, https://public2024.yaesu.com/FileLibraryF/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX5000_CAT_OM_ENG_1907-D.pdf, sha256 0641c84700fe6e38f58e91ebff542d8de6181e5bc7cf819ef089d15c35dd7532: ID, PDF p. 11", note = "Hamlib's NC_RIGID table in newcat.c agrees or is recorded in the file header as a disagreement." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.frequency_digits"
provenance = { kind = "manual", reference = "Yaesu 'FTDX5000 Series CAT Operation Reference Book' (1907-D, Copyright 2019), file FTDX5000_CAT_OM_ENG_1907-D.pdf, https://public2024.yaesu.com/FileLibraryF/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX5000_CAT_OM_ENG_1907-D.pdf, sha256 0641c84700fe6e38f58e91ebff542d8de6181e5bc7cf819ef089d15c35dd7532: FA, PDF p. 11 (FA example with 8 digits), IF, PDF p. 12 (P2 is eight digits); Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/newcat.c newcat_get_info, which accepts an IF answer of 27 characters as an 8-digit model", note = "Pinned question for the oracle test: whether Hamlib sends the same width." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1032 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 2000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

