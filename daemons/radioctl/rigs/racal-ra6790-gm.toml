# Rig description: Racal RA6790/GM (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/racal/racal.c, ra6790.c, read for facts only, and `rigctl -m 11003 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 300..9600 baud, 7E2, handshake NONE; receive 500000 to 29999999 Hz in 2 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# Dialect ra6790: `$0<cmd>` CR with the receiver number 0 (Hamlib's default); the frequency is a megahertz decimal. Hamlib's CW code is 3 (variable BFO) when a BFO offset is set, else 4; radioctl sets 4 and reads both as CW. The ISB code 5 (Hamlib's AMS) has no radioctl mode. A receiver: no PTT. The RA3702 (a different packet protocol) is not described.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode"]

[rig]
id = "racal-ra6790-gm"
name = "Racal RA6790/GM"
family = "serial-vendor"

[vendor]
protocol = "racal"
dialect = "ra6790"

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 10000000
mode = "am"

[[modes]]
mode = "am"
code = "1"

[[modes]]
mode = "fm"
code = "2"

[[modes]]
mode = "cw"
code = "4"

[[modes]]
mode = "lsb"
code = "6"

[[modes]]
mode = "usb"
code = "7"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 11003 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 11003 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/racal/racal.c, ra6790.c (frame formats and the dialect split)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 11003 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/racal/racal.c, ra6790.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/racal/racal.c, ra6790.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
