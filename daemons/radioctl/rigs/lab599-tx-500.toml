# Rig description: Lab599 TX-500 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kenwood/tx500.c (tx500_caps), read for facts only, and `rigctl -m 2050 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..9600 baud, 8N1, handshake NONE; receive 300000 to 440000000 Hz in 5 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# Kenwood-style CAT on the classic Kenwood engine (Hamlib's tx500.c uses the generic Kenwood frequency, mode and PTT routines). Hamlib lists no ID for the TX-500 in kenwood.c; the TS-480's 20 is assumed, as for the QRP Labs models.
# Memory, levels and the TX-500's own extension commands (EX menu reads) are not described.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "lab599-tx-500"
name = "Lab599 TX-500"
family = "kenwood-ascii"

[kenwood]
model_id = 20

[timing]
timeout_ms = 500
retries = 10
inter_command_ms = 0

[defaults]
frequency_hz = 7100000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2050 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2050 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/tx500.c (tx500_caps) and kenwood.c (kenwood_id_string_list)", note = "Hamlib lists no ID for the TX-500; the same 20 as the TS-480 is assumed." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2050 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kenwood/tx500.c (tx500_caps)", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/tx500.c (tx500_caps) (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
