# Rig description: Kenwood TS-2000 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Written from Kenwood's published PC command reference (document and page in each fact). No radio has
# been connected, so every `verified` is unverified. Known gaps: crates/radioctl-protocols/src/kenwood.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "transceive", "split", "rit-xit", "levels", "identify"]

[rig]
id = "kenwood-ts-2000"
name = "Kenwood TS-2000"
family = "kenwood-ascii"

[kenwood]
model_id = 19

[timing]
timeout_ms = 200
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and this repository's TS-2000 bridge", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "manual", reference = "Kenwood TS-2000/TS-2000X/TS-B2000 Instruction Manual B62-1221-10, appendix 21 PC Control Command Tables, p. 125 (ID)", note = "Read as transcribed by manualsdir.com (pages 123-148 of its copy, text in reverse character order), because kenwood.com hosts no TS-2000 command guide file; the printed page numbers come from that transcription, which is itself unverified." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 2014 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 200ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only the starting state of a virtual rig." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Kenwood TS-2000/TS-2000X/TS-B2000 Instruction Manual B62-1221-10, appendix 21 PC Control Command Tables: FA/FB p. 123 (FA, FB); FR/FT p. 124 (FR, FT); IF p. 125 (IF) (P2 step 4 digits, P3 signed 5-digit RIT/XIT offset (+-99999 Hz); P4 RIT, P5 XIT, P8 TX/RX, P9 mode, P10 function, P12 split); AG p. 115 (AG); RG p. 134 (RG); MG p. 127 (MG, ML); PC p. 131 (PC); KS p. 125 (KS); RT/XT/RC/RU/RD p. 135 (RT); SM p. 137 (SM); ID p. 125 (ID)", note = "Read as transcribed by manualsdir.com (pages 123-148 of its copy, text in reverse character order), because kenwood.com hosts no TS-2000 command guide file; the printed page numbers come from that transcription, which is itself unverified." }
verified = { state = "unverified" }

[[facts]]
key = "capability.transceive"
provenance = { kind = "manual", reference = "Kenwood TS-2000/TS-2000X/TS-B2000 Instruction Manual B62-1221-10, appendix 21 PC Control Command Tables: AI command; AI2 (extended format) is the common on-value of the TS-2000 and TS-590 guides, AI1 and AI3 (old format) are not supported by the TS-2000", note = "Read as transcribed by manualsdir.com (pages 123-148 of its copy, text in reverse character order), because kenwood.com hosts no TS-2000 command guide file; the printed page numbers come from that transcription, which is itself unverified." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Kenwood TS-2000/TS-2000X/TS-B2000 Instruction Manual B62-1221-10, appendix 21 PC Control Command Tables: MD command p. 127 (MD): 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 FSK, 7 CW-R, 9 FSK-R (0 and 8 reserved)", note = "Read as transcribed by manualsdir.com (pages 123-148 of its copy, text in reverse character order), because kenwood.com hosts no TS-2000 command guide file; the printed page numbers come from that transcription, which is itself unverified." }
verified = { state = "unverified" }
