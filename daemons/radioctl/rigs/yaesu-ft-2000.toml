[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu 'FT-2000 Series CAT Operation Reference Book' (Copyright 2008), file FT-2000_CAT_MANUAL_ENG_EH025H124.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-2000_CAT_MANUAL_ENG_EH025H124.pdf, sha256 06c2e20aa285ca30a51f2607b09b6acc204b564cde26280250ec720712eb2655: MD, PDF p. 12: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 FSK (RTTY-LSB), 7 CW-R, 8 PKT-L, 9 FSK-R (RTTY-USB), A PKT-FM, B FM-N, C PKT-U, D AM-N", note = "Mapping to radioctl modes is ours: 6 is rtty, 9 is rtty-r, 8 (PKT-L) is data-r and C (PKT-U) is data; A, B and D are not described." }
