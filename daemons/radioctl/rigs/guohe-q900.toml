# Rig description: Guohe Q900 (legacy five-byte CAT, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/yaesu/ft817.c (q900_caps), read for facts only, and `rigctl -m 1051 --dump-caps`); no vendor document was read and no code or table was copied.
# Hamlib lists: serial 4800..38400 baud, 8N2, handshake NONE; receive 100000 to 470000000 Hz in 4 range(s).
# Hamlib gives the Q900 the FT-817 routines and the FT-817 command set, so the description follows the FT-817's file (modes, status block, stop bits 2); how far the Q900 really follows the FT-817 is an open question for a volunteer.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "split", "rit-xit"]

[rig]
id = "guohe-q900"
name = "Guohe Q900"
family = "yaesu-legacy"

[yaesu_legacy]
stop_bits = 2

[timing]
timeout_ms = 3000
retries = 5
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "cw"
code = 0x02

[[modes]]
mode = "cw-r"
code = 0x03

[[modes]]
mode = "am"
code = 0x04

[[modes]]
mode = "fm"
code = 0x08

[[modes]]
mode = "data"
code = 0x0a

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1051 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.stop_bits"
provenance = { kind = "program-output", reference = "`rigctl -m 1051 --dump-caps` (Hamlib 4.6.2): Serial speed 4800..38400 baud, 8N2", note = "Hamlib's setting for the Q900, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 1051 --dump-caps` (Hamlib 4.6.2): Write delay and timeout lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/ft817.c (q900_caps); `rigctl -m 1051 --dump-caps` \"Can set/get\" lines", note = "Hamlib registers the FT-817 routines for the Q900; a capability is claimed when Hamlib's backend implements it and the engine has the command." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/ft817.c (q900_caps): the shared FT-817 mode table", note = "Mode bytes as the FT-817 backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
