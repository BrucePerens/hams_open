key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1034 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 2000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

