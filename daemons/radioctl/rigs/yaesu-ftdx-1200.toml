# Rig description: Yaesu FTDX-1200 (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Yaesu's published Yaesu 'FTDX1200 Series CAT Operation Reference Book' (document, PDF page and sha256 in each fact), with Hamlib 4.6.2 as a cross-check.
# Hamlib lists: serial 4800..38400 baud, 8N2, ctrl=CTS; receive 0.03 to 56 MHz in 2 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 8 digits (`yaesu.frequency_digits`); the IF answer is 27 characters with the semicolon.
# Gaps and open questions: The guide gives ID 0582 for a radio with the optional FFT-1; Hamlib's table has 583. See the pinned question in the facts. Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "transceive", "split", "rit-xit", "levels", "identify"]

[rig]
id = "yaesu-ftdx-1200"
name = "Yaesu FTDX-1200"
family = "yaesu-newcat"

[yaesu]
model_id = 583
frequency_digits = 8

[levels]
attenuator_db = [6, 12, 18]
attenuator_any_up_to_db = 0
preamp_steps = 2

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide and in Hamlib 4.6.2", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1034 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu 'FTDX1200 Series CAT Operation Reference Book', file FTDX1200_CAT_OM_ENG.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX1200_CAT_OM_ENG.pdf, sha256 a4d466c2bfd926a06f607bd2021b694a61a4b1ef9c751e0bafb449e5c76a554a: ID, PDF p. 11; The guide gives ID 0582 for a radio with the optional FFT-1; Hamlib's table has 583. See the pinned question in the facts.", note = "Hamlib's NC_RIGID table in newcat.c agrees or is recorded in the file header as a disagreement." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.frequency_digits"
provenance = { kind = "manual", reference = "Yaesu 'FTDX1200 Series CAT Operation Reference Book', file FTDX1200_CAT_OM_ENG.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX1200_CAT_OM_ENG.pdf, sha256 a4d466c2bfd926a06f607bd2021b694a61a4b1ef9c751e0bafb449e5c76a554a: FA, PDF p. 10 (FA example with 8 digits), IF, PDF p. 11 (P2 is eight digits); Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/newcat.c newcat_get_info, which accepts an IF answer of 27 characters as an 8-digit model", note = "Pinned question for the oracle test: whether Hamlib sends the same width." }
verified = { state = "unverified" }

