key = "levels.attenuator_db"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rig_caps `.attenuator` of the Yaesu FTDX-1200 in rigs/yaesu ([6, 12, 18]) and `rigctl -m 1034 --dump-caps`", note = "The guide (RA p. 15) gives the RA steps; the dB figures are Hamlib's, read for facts only." }
