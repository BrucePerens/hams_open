# Rig description: Yaesu FT-450 (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Hamlib 4.6.2 only (rigs/yaesu/ft450.c, newcat.c, `rigctl -m 1027 --dump-caps`), read for facts only: no vendor guide for this model was used.
# Hamlib lists: serial 4800..38400 baud, 8N2, ctrl=CTS; receive 0.03 to 60 MHz in 2 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 8 digits (`yaesu.frequency_digits`); the IF answer is 27 characters with the semicolon.
# Gaps and open questions: Hamlib's FT-450 driver is the FT-450D driver with the ID 0241; the FT-450D guide was not used for this older radio, so every fact here is Hamlib's. No split, XIT, read-power or levels (same reasons as the FT-450D). Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "transceive", "identify"]

[rig]
id = "yaesu-ft-450"
name = "Yaesu FT-450"
family = "yaesu-newcat"

[yaesu]
model_id = 241
frequency_digits = 8

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

