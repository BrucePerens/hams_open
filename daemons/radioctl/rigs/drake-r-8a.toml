# Rig description: Drake R-8A (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/drake/drake.c, r8a.c, read for facts only, and `rigctl -m 9002 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..9600 baud, 8N1, handshake CTS/RTS; receive 100000 to 30000000 Hz in 2 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# Dialect r8: CR-ended commands, LF-ended replies (`F<7 digits of 10 Hz>`, `RF`, `M<c>`, `RM`). A receiver: no PTT. Hamlib's AMS and (R-8B) ECSS modes have no entry in radioctl's mode vocabulary and are not listed.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode"]

[rig]
id = "drake-r-8a"
name = "Drake R-8A"
family = "serial-vendor"

[vendor]
protocol = "drake"
dialect = "r8"

[timing]
timeout_ms = 200
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 10000000
mode = "am"

[[modes]]
mode = "usb"
code = "1"

[[modes]]
mode = "lsb"
code = "2"

[[modes]]
mode = "rtty"
code = "3"

[[modes]]
mode = "cw"
code = "4"

[[modes]]
mode = "fm"
code = "5"

[[modes]]
mode = "am"
code = "6"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 9002 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 9002 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/drake/drake.c, r8a.c (frame formats and the dialect split)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 9002 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/drake/drake.c, r8a.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/drake/drake.c, r8a.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
