# Rig description: Ten-Tec TT-599 Eagle (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/tentec/orion.c, orion.h (the Eagle shares the Orion backend; rig_model checks only change the bandwidth reset), read for facts only, and `rigctl -m 16013 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 57600..57600 baud, 8N1, handshake CTS/RTS; receive 500000 to 54000000 Hz in 23 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect orion, as the TT-565 (Hamlib uses one backend for both). Hamlib's mode list for the Eagle has no RTTY.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "set-ptt"]

[rig]
id = "tentec-tt-599"
name = "Ten-Tec TT-599 Eagle"
family = "serial-vendor"

[vendor]
protocol = "tentec"
dialect = "orion"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 2000
retries = 4
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "usb"
code = "0"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "cw"
code = "2"

[[modes]]
mode = "cw-r"
code = "3"

[[modes]]
mode = "am"
code = "4"

[[modes]]
mode = "fm"
code = "5"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 16013 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16013 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/orion.c, orion.h (the Eagle shares the Orion backend; rig_model checks only change the bandwidth reset) (frame formats and the dialect split)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16013 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/tentec/orion.c, orion.h (the Eagle shares the Orion backend; rig_model checks only change the bandwidth reset)", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/orion.c, orion.h (the Eagle shares the Orion backend; rig_model checks only change the bandwidth reset) (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
