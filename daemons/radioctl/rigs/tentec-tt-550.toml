# Rig description: Ten-Tec TT-550 Pegasus (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts for the receive tuning, mode and filter commands come from the Ten-Tec Pegasus Programmer's Reference Guide Rev 2.0 (file pegasus_550prg2.pdf, sha256 abbcc833b190611b608a4e7f58a5c326498b12df2ccb1db385b5631ff83f583a, https://web.archive.org/web/2id_/http://www.rfsquared.com/cms-files/550PRG2.PDF), PDF pages 12 and 16, read by us; the serial line and the PTT command are from Hamlib 4.6.2 (rigs/tentec/tt550.c, `rigctl -m 16001 --dump-caps`); no code or table was copied.
# Hamlib lists: serial 57600..57600 baud, 8N1, handshake CTS; no receive range listed. The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect tt550 (tentec_rx320.rs): receive tuning words (`N`), filter (`W`) and mode (`M` with a receive and a transmit digit); set-only. The guide's transmit tuning frame (`T`) is not encoded, so a transmit on the Pegasus would use whatever transmit factors the radio holds: the description has no PTT capability although the radio takes `Q1` / `Q0` (Hamlib's PTT). The guide's fine-factor formula is printed with a factor that cannot be right; the RX-320's is used (see the engine file). CW offset 700 Hz is Hamlib's default.
schema = 1
capabilities = ["set-frequency", "set-mode"]

[rig]
id = "tentec-tt-550"
name = "Ten-Tec TT-550 Pegasus"
family = "serial-vendor"

[vendor]
protocol = "tentec"
dialect = "tt550"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 100
retries = 4
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "am"
code = "0"

[[modes]]
mode = "usb"
code = "1"

[[modes]]
mode = "lsb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 16001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/tt550.c, pegasus.c rigs/tentec/tt550.c (frame formats)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/tentec/tt550.c, pegasus.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/tt550.c, pegasus.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.dialect"
provenance = { kind = "manual", reference = "Ten-Tec Pegasus Programmer's Reference Guide Rev 2.0, pegasus_550prg2.pdf (sha256 abbcc833b190611b608a4e7f58a5c326498b12df2ccb1db385b5631ff83f583a), PDF page 12 (N frame, Ch Cl Fh Fl Bh Bl CR, receive tuning formulas) and page 16 (M with receive and transmit mode digits 0 AM 1 USB 2 LSB 3 CW 4 FM; W with filter number 0 to 33)", note = "The fine-factor formula in the guide is misprinted; the coarse and BFO formulas and the frame layouts were compared." }
verified = { state = "manual-checked", reference = "Pegasus Programmer's Reference Guide Rev 2.0, PDF pp. 12 and 16" }
