# Rig description: HobbyPCB RS-HFIQ (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/rs_hfiq.c, read for facts only, and `rigctl -m 25019 --dump-caps`); no vendor protocol document was read and no code or comments were copied.
# Hamlib lists: serial 57600 baud 8N1, no handshake; receive 3.5 to 30 MHz; transmit on the 80, 40, 30, 20, 17, 15 and 10 m ham bands; mode IQ only (radioctl has no IQ mode, so the description has none).
# Dialect rshfiq: `*f<Hz>` CR sets the frequency, `*f?` CR reads it (digits CR LF), `*x1`/`*x0` CR key and unkey, `*L` CR reads the transmit power in percent (0 to 110, firmware 4 and later). The radio has no PTT read.
# Transmit-capable (set-ptt): the transmit gate stays closed by default.
schema = 1
capabilities = ["read-frequency", "set-frequency", "set-ptt", "read-power"]

[rig]
id = "hobbypcb-rs-hfiq"
name = "HobbyPCB RS-HFIQ"
family = "serial-vendor"

[vendor]
protocol = "rshfiq"
dialect = "rshfiq"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25019 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25019 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/rs_hfiq.c (frame formats, serial line settings and the dialect split)", note = "Command frames and line settings read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25019 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/rs_hfiq.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }
