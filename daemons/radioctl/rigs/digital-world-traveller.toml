# Rig description: Coding Technologies Digital World Traveller (usb-device, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/dwt.c, read for facts only) and `rigctl -m 25003 --dump-caps`; no vendor document was read and no code was copied.
# Hamlib lists: receive 150 kHz to 30 MHz and 87.5 to 108 MHz. A DRM receiver: Hamlib reaches it through the vendor's Windows DLL on one build and over USB on the other; the USB variant sets the frequency only (no mode, no read).
# NO ENGINE YET: this device speaks USB vendor requests or HID reports, and radioctl has no USB control or HID transport, so radioctld cannot open it.
# The description records what the transport will need (night_shift_todo/medium/radioctl-usb-hid-transport.md).
schema = 1
capabilities = ["read-frequency", "set-frequency"]

[rig]
id = "digital-world-traveller"
name = "Coding Technologies Digital World Traveller"
family = "usb-device"

[usb]
protocol = "dwt"
vendor_id = 0x1539
product_id = 0x1730
manufacturer = ""
product = ""
multiplier = 0

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25003 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25003 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "usb.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/dwt.c (USB ids, manufacturer and product strings, multiplier)", note = "Read for facts only; no code copied. A DRM receiver: Hamlib reaches it through the vendor's Windows DLL on one build and over USB on the other; the USB variant sets the frequency only (no mode, no read)." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25003 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/dwt.c", note = "A capability is claimed when Hamlib's backend implements it; there is no engine yet, so none can be exercised." }
verified = { state = "unverified" }
