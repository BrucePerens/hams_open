# Rig description: Watkins-Johnson WJ-8888 HF receiver (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/wj/wj.c, read for facts only, and `rigctl -m 12004 --dump-caps`); no Watkins-Johnson document was found (premium-rx.org's copies return 404) and no code or table was copied.
# Hamlib lists: serial 9600 baud, 8N1, receive 5 kHz to 30 MHz. The description format has no field for frequency ranges, so they are not repeated here.
# Dialect wj8888 (wj.rs): a ten-byte command frame carries every setting (frequency in 10 Hz BCD units packed seven bits to a byte, mode, 8 kHz IF bandwidth, slow AGC, no BFO shift, full RF gain). The least significant bit of the 100 Hz digit does not fit and is dropped, so an odd 100 Hz digit is tuned one step low. Hamlib's get_freq and get_mode never fill in a result, so the description is set only. Not in the engine: filter width, AGC, RF gain, BFO shift, independent sideband and the receiver id.
schema = 1
capabilities = ["set-frequency", "set-mode"]

[rig]
id = "watkins-johnson-wj-8888"
name = "Watkins-Johnson WJ-8888"
family = "serial-vendor"

[vendor]
protocol = "wj"
dialect = "wj8888"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[modes]]
mode = "am"
code = 0

[[modes]]
mode = "fm"
code = 1

[[modes]]
mode = "cw"
code = 2

[[modes]]
mode = "lsb"
code = 5

[[modes]]
mode = "usb"
code = 6

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 12004 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 12004 --dump-caps` (Hamlib 4.6.2): timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/wj/wj.c (wj_transaction)", note = "The command frame layout read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 12004 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/wj/wj.c", note = "Hamlib's get_freq and get_mode return without a result, so only the set side is claimed." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/wj/wj.c (the MD_ constants and the detection-mode switch)", note = "AM 0, FM 1, CW 2, LSB 5, USB 6; the variable-BFO CW (3), independent sideband (4) and narrow AM (7) are not in the engine." }
verified = { state = "unverified" }
