# Rig description: Skanti TRP8000 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/skanti/skanti.c, trp8000.c, read for facts only, and `rigctl -m 14002 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 300..300 baud, 7O1, handshake NONE; no receive range listed. The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect trp8000 (skanti.rs): CR-ended commands, `>` prompt after each. Set-only: Hamlib has no frequency, mode or PTT read for this radio, so there are none here. Hamlib's mode write also sends a filter letter (`I`, `V`, `N` or `W`) that radioctl does not describe. Mode codes: `L` LSB, `J` USB, `H` AM, `F` RTTY, `A` CW (sent as `A1`; Hamlib's MCW `A2` and R3E `R` are not described).
schema = 1
capabilities = ["set-frequency", "set-mode", "set-ptt"]

[rig]
id = "skanti-trp8000"
name = "Skanti TRP8000"
family = "serial-vendor"

[vendor]
protocol = "skanti"
dialect = "trp8000"
data_bits = 7
parity = "O"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[modes]]
mode = "lsb"
code = "L"

[[modes]]
mode = "usb"
code = "J"

[[modes]]
mode = "am"
code = "H"

[[modes]]
mode = "rtty"
code = "F"

[[modes]]
mode = "cw"
code = "A"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 14002 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 14002 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/skanti/skanti.c, trp8000.c rigs/skanti/skanti.c (frame formats)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 14002 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/skanti/skanti.c, trp8000.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/skanti/skanti.c, trp8000.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
