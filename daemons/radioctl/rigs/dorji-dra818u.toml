# Rig description: Dorji DRA818U (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from the Dorji DRA818U datasheet, revision 1.20, July 2016 (file dra818u_datasheet_direnc.pdf, sha256 15489d34ebd9bc8e7ad6afae96a1e87909972502c9f78a41c3e289bb0ffc9743), pages 4 and 5, read for the serial format and the group-setting command, and from Hamlib 4.6.2 (rigs/dorji/dra818.c, `rigctl -m 31002 --dump-caps`) for what Hamlib sends; no code or table was copied.
# Hamlib lists: serial 9600..9600 baud, 8N1, handshake NONE; receive 400000000 to 480000000 Hz in 1 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect dra818u (dorji.rs): a 400 to 480 MHz FM module. The module has no read commands; frequency and channel width are set together with the group command, so there are no read capabilities. Mode codes: `0` the 12.5 kHz channel (radioctl `fm`), `1` the 25 kHz channel (radioctl `wfm`). No PTT command: the module keys itself from its PTT pin.
schema = 1
capabilities = ["set-frequency", "set-mode"]

[rig]
id = "dorji-dra818u"
name = "Dorji DRA818U"
family = "serial-vendor"

[vendor]
protocol = "dorji"
dialect = "dra818u"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 435000000
mode = "fm"

[[modes]]
mode = "fm"
code = "0"

[[modes]]
mode = "wfm"
code = "1"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 31002 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 31002 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/dorji/dra818.c rigs/dorji/dra818.c (group command) and the DRA818U datasheet pages 4 and 5", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 31002 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/dorji/dra818.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/dorji/dra818.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.protocol"
provenance = { kind = "manual", reference = "Dorji DRA818U datasheet rev 1.20 (July 2016), file dra818u_datasheet_direnc.pdf, https://pdf.direnc.net/upload/dra818u.pdf, sha256 15489d34ebd9bc8e7ad6afae96a1e87909972502c9f78a41c3e289bb0ffc9743, page 4, Parameters Setting: 8 data bits, 1 stop bit, no parity, 9600 baud, commands start with AT and end with CR LF", note = "The datasheet says '9600 kbps'; 9600 baud is meant." }
verified = { state = "manual-checked", reference = "DRA818U datasheet p. 4, serial format" }

[[facts]]
key = "vendor.dialect"
provenance = { kind = "manual", reference = "Dorji DRA818U datasheet rev 1.20 (July 2016), file dra818u_datasheet_direnc.pdf, sha256 15489d34ebd9bc8e7ad6afae96a1e87909972502c9f78a41c3e289bb0ffc9743, pages 4 and 5: AT+DMOCONNECT, AT+DMOSETGROUP=GBW,TFV,RFV,Tx_CTCSS,SQ,Rx_CTCSS with GBW 0 for 12.5 kHz and 1 for 25 kHz, frequency range 400.0000 to 480.0000 MHz, squelch 0 to 8, response +DMOSETGROUP:0 for success and 1 for data out of range", note = "Command forms checked against the datasheet's examples; the response of the group command is printed in the datasheet both as +DMOCONNECT and +DMOSETGROUP, and the example shows +DMOSETGROUP:0." }
verified = { state = "manual-checked", reference = "DRA818U datasheet pp. 4-5, AT+DMOSETGROUP" }
