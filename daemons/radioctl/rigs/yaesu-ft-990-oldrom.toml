# Rig description: Yaesu FT-990 (old ROM) (legacy five-byte CAT block protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# FT-990 with ROM before 1.3: only the whole-radio update (opcode 10 with parameter 0) works. The manual's overview says 1492 bytes where the full block is 1508, so one 16-byte record is absent; Hamlib 4.6.2 ft990v12.c uses 1492. WHICH record is absent is not known: the offsets 5 (frequency) and 11 (mode) assume the current-operation record comes first, as in the 1508-byte layout. Unverified.
# No radio has been connected, so every `verified` is unverified. Engine and gaps: crates/radioctl-protocols/src/yaesu_legacy.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "split"]

[rig]
id = "yaesu-ft-990-oldrom"
name = "Yaesu FT-990 (old ROM)"
family = "yaesu-legacy"

[yaesu_legacy]
stop_bits = 2
ptt_on = [0x00, 0x00, 0x00, 0x01, 0x0f]
ptt_off = [0x00, 0x00, 0x00, 0x00, 0x0f]
split_on = [0x00, 0x00, 0x00, 0x01, 0x01]
split_off = [0x00, 0x00, 0x00, 0x00, 0x01]

[yaesu_legacy.set_frequency]
template = [0x00, 0x00, 0x00, 0x00, 0x0a]
at = 0
form = "bcd-10hz-lsb"

[yaesu_legacy.set_mode]
template = [0x00, 0x00, 0x00, 0x00, 0x0c]
at = 3

[[yaesu_legacy.reads]]
request = [0x00, 0x00, 0x00, 0x00, 0x10]
length = 1492
frequency = { offset = 5, form = "bin-10hz-msb3" }
mode = { offset = 11, mask = 0x07 }

[[yaesu_legacy.reads]]
request = [0x00, 0x00, 0x00, 0x00, 0xfa]
length = 5
ptt = { offset = 0, mask = 0x80, on_when_set = true }
split = { offset = 0, mask = 0x01, on_when_set = true }

[[yaesu_legacy.status_modes]]
mode = "lsb"
code = 0x00

[[yaesu_legacy.status_modes]]
mode = "usb"
code = 0x01

[[yaesu_legacy.status_modes]]
mode = "cw"
code = 0x02

[[yaesu_legacy.status_modes]]
mode = "am"
code = 0x03

[[yaesu_legacy.status_modes]]
mode = "fm"
code = 0x04

[[yaesu_legacy.status_modes]]
mode = "rtty"
code = 0x05

[[yaesu_legacy.status_modes]]
mode = "data"
code = 0x06

[timing]
timeout_ms = 2000
retries = 0
inter_command_ms = 50

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "cw"
code = 0x02

[[modes]]
mode = "am"
code = 0x04

[[modes]]
mode = "fm"
code = 0x06

[[modes]]
mode = "rtty"
code = 0x08

[[modes]]
mode = "rtty-r"
code = 0x09

[[modes]]
mode = "data-r"
code = 0x0a

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the manual or Hamlib", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.stop_bits"
provenance = { kind = "manual", reference = "Yaesu FT-990 Operating Manual (file ft990_user_manual.pdf, sha256 6b2e40f7f890777b1a0955029f9a80209cb96883f15a86a0845cdcb5068bd479): CAT chapter, PDF p.43-44 (printed 42-43): 4800 bit/s, 8 data, no parity, 2 stop" }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.block"
provenance = { kind = "manual", reference = "Yaesu FT-990 Operating Manual (file ft990_user_manual.pdf, sha256 6b2e40f7f890777b1a0955029f9a80209cb96883f15a86a0845cdcb5068bd479): CAT chapter, PDF p.43-44 (printed 42-43): 0A set frequency (BCD, least significant byte first, 14.25 MHz is 00 50 42 01 0A); 0C mode (0 LSB, 1 USB, 2 CW, 4 AM, 6 FM, 8 RTTY-LSB, 9 RTTY-USB, 0A packet-LSB, 0B packet-FM); 0F PTT; 01 split; 10 update: the 16-byte operating record has the frequency as three binary bytes, most significant first, in 10 Hz units at offsets 1 to 3 and the mode as a whole byte at offset 7 (0 LSB, 1 USB, 2 CW, 3 AM, 4 FM, 5 RTTY, 6 packet); FA returns three flag bytes: bit 0 split, bit 7 TX in the first", note = "Hamlib 4.6.2 agrees on the frequency form and offsets." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Yaesu FT-990 Operating Manual (file ft990_user_manual.pdf, sha256 6b2e40f7f890777b1a0955029f9a80209cb96883f15a86a0845cdcb5068bd479): CAT chapter, PDF p.43-44 (printed 42-43): opcode table and flag layout", note = "Meters (F7) not mapped." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu FT-990 Operating Manual (file ft990_user_manual.pdf, sha256 6b2e40f7f890777b1a0955029f9a80209cb96883f15a86a0845cdcb5068bd479): CAT chapter, PDF p.43-44 (printed 42-43): mode codes of opcode 0C", note = "Packet-FM (0B) and the narrow-filter variants are not mapped." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
