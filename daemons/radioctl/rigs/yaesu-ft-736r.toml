# Rig description: Yaesu FT-736R (legacy five-byte CAT, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Written from Hamlib 4.6.2 source facts (no Yaesu manual read for this model). No radio has been connected, so every `verified` is unverified.
# Gaps: crates/radioctl-protocols/src/yaesu_legacy.rs.
schema = 1
capabilities = ["set-frequency", "set-mode", "set-ptt"]

[rig]
id = "yaesu-ft-736r"
name = "Yaesu FT-736R"
family = "yaesu-legacy"

[yaesu_legacy]
stop_bits = 2
high_band_flag = true

[timing]
timeout_ms = 2000
retries = 0
inter_command_ms = 30

[defaults]
frequency_hz = 145000000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "cw"
code = 0x02

[[modes]]
mode = "fm"
code = 0x08

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in Hamlib 4.6.2", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.stop_bits"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/ft736.c: rig caps serial_stop_bits = 2", note = "Two stop bits as for the FT-817 family. Facts only; no code or comments copied. Unverified." }
verified = { state = "unverified" }

