# Rig description: Kenwood TS-690S (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Nothing here is hardware-verified: no radio has been connected (docs/VOLUNTEER_TESTING.md). The facts marked manual-checked were compared with the TS-450S/TS-690S external-control manual (pages named in each fact, sha256 in the fact); the rest is Hamlib 4.6.2 (rigs/kenwood/ts450s.c, `rigctl --dump-caps`, facts only).
# Dialect "ts450": in that manual MD and FR/FT are SET ONLY (the mode and the transmit VFO are read from IF), RD/RU take no parameter (no exact RIT offset can be set), AI has one digit (1 is on), and SM answers SMnnnn (0000 to 0030) without the receiver digit the engine expects, so read-signal is not declared. The IF answer is the classic layout.
# Kenwood publishes no PC command reference for this model that could be downloaded (kenwood.com refused the download of its
# guides in this session and hosts none for the older sets), so the facts come from Hamlib 4.6.2 (rigs/kenwood/ts690.c, kenwood.c, read for
# facts only, and `rigctl -m 2005 --dump-caps` output), named in each fact below. Kenwood's guides for other models were not used for this one.
# Hamlib lists: serial 4800..4800 baud, 8N2, hardware (CTS/RTS) handshake; PC interface: see the radio's manual (older Kenwoods need the IF-232C/IC-10 level converter); receive 0.5 to 54 MHz in 4 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -2.200kHz/+2.200kHz.
# Hamlib's get-level list for this model: METER SWR ALC STRENGTH. The description format has no field for frequency ranges, filter tables or function lists,
# so they are not repeated here.
# Engine: the classic Kenwood engine (IF; answer of 38 characters, MD; mode letters, FA/FB 11 digits). Hamlib's backend assumes the same IF length for this model.
# Known gap: no levels are declared: the AG/RG/PC/KS forms of this model are not documented by a source we may use here.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "transceive", "split", "rit-xit", "identify"]

[rig]
id = "kenwood-ts-690s"
name = "Kenwood TS-690S"
family = "kenwood-ascii"

[kenwood]
model_id = 11
dialect = "ts450"

[timing]
timeout_ms = 1000
retries = 10
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2005 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "manual", reference = "Kenwood TS-450S/TS-690S external-control manual (file qslnet_TS-450-690-Ext-control.pdf, a scan from qslnet.de; sha256 86b83837202d17e61a865e2955d6afe49c7a62e7c9cdae33dd945c47bc78310f): ID, printed page 11 (TS-450 010, TS-690 011)", note = "Three digits: ID011;. Hamlib's table agrees." }
verified = { state = "manual-checked", reference = "TS-450/690 external-control manual, ID, printed p. 11" }

[[facts]]
key = "kenwood.dialect"
provenance = { kind = "manual", reference = "Kenwood TS-450S/TS-690S external-control manual (file qslnet_TS-450-690-Ext-control.pdf, a scan from qslnet.de; sha256 86b83837202d17e61a865e2955d6afe49c7a62e7c9cdae33dd945c47bc78310f): MD printed page 13 (set command only), FR/FT printed page 10 (set command only), RD/RU printed page 16 (no parameter), AI printed page 8 (one digit, format 1), SM printed page 18 (P1 format 22, no receiver digit), IF printed page 11", note = "Our name for the command set: radioctl-protocols/src/kenwood.rs (dialect ts450)." }
verified = { state = "manual-checked", reference = "TS-450/690 external-control manual, printed pp. 8, 10, 11, 13, 16, 18" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 2005 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 1000ms, 10 retry", note = "Hamlib's settings, not a measurement of the radio. retries is capped at 10 in this repository." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only the starting state of a virtual rig; the frequency is moved inside this model's receive range where needed." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Kenwood TS-450S/TS-690S external-control manual (file qslnet_TS-450-690-Ext-control.pdf, a scan from qslnet.de; sha256 86b83837202d17e61a865e2955d6afe49c7a62e7c9cdae33dd945c47bc78310f): command list printed page 7 (AI DN/UP FA/FB FL FR/FT FS ID IF LK MC MD MR MW MX PT RC RD/RU RM RT RX/TX SC SM TO VR XT); AI page 8, FR/FT page 10, ID and IF page 11 (P1 frequency, P3 RIT frequency, P4 RIT, P5 XIT, P8 TX/RX, P9 mode, P10 function, P12 split), MD page 13, RD/RU page 16; the FA/FB, RT, RX/TX and XT pages (9, 17, 20) were not read", note = "Mode, PTT, RIT, XIT and split are read from IF; split is set with FR0 then FT; the engine refuses an exact RIT offset (RU and RD take no parameter). Hamlib's capability list agrees except where this note says otherwise." }
verified = { state = "manual-checked", reference = "TS-450/690 external-control manual, printed pp. 7, 8, 10, 11, 13, 16" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/kenwood.c kenwood_set_ptt (TX; and RX;)", note = "Transmit-capable; the rig actor's transmit gate applies and stays closed by default. Unverified." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Kenwood TS-450S/TS-690S external-control manual (file qslnet_TS-450-690-Ext-control.pdf, a scan from qslnet.de; sha256 86b83837202d17e61a865e2955d6afe49c7a62e7c9cdae33dd945c47bc78310f): Parameter List, format 2 MODE, printed page 6: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 FSK, 7 CW-R, 9 FSK-R", note = "The manual's list is the same eight letters as the file." }
verified = { state = "manual-checked", reference = "TS-450/690 external-control manual, parameter list, printed p. 6" }
