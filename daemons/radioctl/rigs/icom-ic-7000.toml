provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7000.c rig_caps `.attenuator` and `.preamp`; rigs/icom/icom.c icom_set_level and icom_get_level (RIG_LEVEL_ATT: command 0x11, BCD decibels; RIG_LEVEL_PREAMP: command 0x16 sub-command 0x02); rigs/icom/icom_defs.h (C_CTL_ATT 0x11, C_CTL_FUNC 0x16, S_FUNC_PAMP 0x02)", note = "Facts only, no code or table copied. The lists are Hamlib's count of steps; the radio may offer more (Hamlib marks some of these lists as guesses). A preamplifier step is a P.AMP number, not a gain in dB." }
