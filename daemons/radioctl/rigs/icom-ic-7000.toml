# Rig description: Icom IC-7000 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# No readable copy of Icom's CI-V reference for this model could be obtained; the facts come from Hamlib 4.6.2
# (rigs/icom/ic7000.c, read for facts only, and `rigctl -m 3060 --dump-caps` output), named in each fact below.
# Hamlib lists: serial 300..19200 baud, 8N1, ctrl=NONE; receive 0.03-200 MHz; 400-470 MHz; transmit 1.81 to 440 MHz in 24 ranges. The description format has no field for
# frequency ranges, filter tables or function lists, so they are not repeated here; the CI-V address, baud rate and
# "CI-V Transceive" are set in the radio's own menu and must match what radioctl is told.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "split", "filter", "levels", "identify"]

[rig]
id = "icom-ic-7000"
name = "Icom IC-7000"
family = "icom-civ"

[civ]
address = 0x70
controller = 0xE0
model_id = 0x70
echo = false

[levels]
attenuator_db = [12]
attenuator_any_up_to_db = 0
preamp_steps = 1

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "cw"
code = 0x03

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "rtty"
code = 0x04

[[modes]]
mode = "fm"
code = 0x05

[[modes]]
mode = "wfm"
code = 0x06

[[modes]]
mode = "cw-r"
code = 0x07

[[modes]]
mode = "rtty-r"
code = 0x08

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 3060 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "civ.address"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7000.c (the IC-7000 icom_priv_caps block `IC7000_priv_caps`, `default address` field)", note = "No readable copy of Icom's CI-V reference for this model could be obtained (Icom's download endpoints are excluded by robots.txt and the archive.org copies found were image scans or other documents); this fact is Hamlib's. Facts only were read from Hamlib; no code or table was copied. Hamlib's default may differ from a radio's menu setting (the address is user-changeable on the radio)." }
verified = { state = "unverified" }

[[facts]]
key = "civ.controller"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/src/civ_bridge.rs: DEFAULT_CONTROLLER_ADDRESS 0xE0", note = "The conventional controller address; not confirmed by a manual." }
verified = { state = "unverified" }

[[facts]]
key = "civ.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7000.c (`IC7000_priv_caps`, `default address` field)", note = "Set equal to the CI-V address, as on the IC-7300 file. No source read states the 19 00 reply value for this model, so this is an assumption; an older radio may answer 19 00 with NG, which the volunteer self-test will report." }
verified = { state = "unverified" }

[[facts]]
key = "civ.echo"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: the simulator does not echo", note = "A design choice for the virtual rig; USB CI-V does not echo, a single-wire interface does (not measured here)." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 3060 --dump-caps (Hamlib 4.6.2): Write delay and timeout lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
