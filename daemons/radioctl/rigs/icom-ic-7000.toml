key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "rigctl -m 3060 --dump-caps (Hamlib 4.6.2): \"Can set/get PTT\", \"Can set Split VFO\", \"Can set RIT\", \"Can send Morse\", \"Targetable features\", \"Get level\" lines; rigs/icom/ic7000.c rig_caps", note = "No readable copy of Icom's CI-V reference for this model could be obtained (Icom's download endpoints are excluded by robots.txt and the archive.org copies found were image scans or other documents); this fact is Hamlib's. Facts only were read from Hamlib; no code or table was copied. A capability is claimed when Hamlib's capability list for the model includes it and the engine implements the command (CI-V 03/04/05/06, 0F, 11, 14, 15, 16, 17, 19, 1A 03, 1C 00, 21, 25); absence in Hamlib is taken as absence on the radio, which may be too cautious. `identify` (command 19 00) is claimed on every file regardless of Hamlib's list; an older radio may answer NG, which the volunteer self-test reports. Settings and CI-V menu items (address, baud rate, transceive) are set at the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.filter"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/icom.c icom_get_dsp_flt and icom_set_dsp_flt (command 1A 03 with the 0 to 40 width index, `filtericom` table); rigs/icom/ic7000.c", note = "No readable copy of Icom's CI-V reference for this model could be obtained (Icom's download endpoints are excluded by robots.txt and the archive.org copies found were image scans or other documents); this fact is Hamlib's. Facts only were read from Hamlib; no code or table was copied. Hamlib says the 1A 03 filter command \"should work on all DSP rigs\" and was tested on the IC-746PRO only; the index table is the engine's IC-7300 table, not confirmed for this model. A radio that does not understand it answers NG and the engine reports an error." }
verified = { state = "unverified" }

