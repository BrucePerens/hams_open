# Rig description: Yaesu FT-450D (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Yaesu's published Yaesu 'FT-450D CAT Operation Reference Book' (document, PDF page and sha256 in each fact), with Hamlib 4.6.2 as a cross-check.
# Hamlib lists: serial 4800..38400 baud, 8N2, ctrl=CTS; receive 0.03 to 60 MHz in 2 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 8 digits (`yaesu.frequency_digits`); the IF answer is 27 characters with the semicolon.
# Gaps and open questions: No split (FT here selects the displayed or opposite band, not VFO A or B), no XIT (the guide has no XT), no read-power (RM 5 is not PO here), no levels (MG is split into L/M/H sub-ranges of 000-255, not 0-100). Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "transceive", "identify"]

[rig]
id = "yaesu-ft-450d"
name = "Yaesu FT-450D"
family = "yaesu-newcat"

[yaesu]
model_id = 244
frequency_digits = 8

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide and in Hamlib 4.6.2", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1046 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu 'FT-450D CAT Operation Reference Book' (Copyright 2017), file FT-450D_CAT_OM_ENG_1710-B.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-450D_CAT_OM_ENG_1710-B.pdf, sha256 b2f6ce2107171e1bd097bbe911335059fcb7c493ea6b0d28b7f948d31b629f27: ID, PDF p. 10", note = "Hamlib's NC_RIGID table in newcat.c agrees or is recorded in the file header as a disagreement." }
verified = { state = "unverified" }

[[facts]]
