provenance = { kind = "manual", reference = "Yaesu 'FT-450D CAT Operation Reference Book' (Copyright 2017), file FT-450D_CAT_OM_ENG_1710-B.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-450D_CAT_OM_ENG_1710-B.pdf, sha256 b2f6ce2107171e1bd097bbe911335059fcb7c493ea6b0d28b7f948d31b629f27: FA, PDF p. 10 (FA example with 8 digits), IF, PDF p. 10 (P2 is eight digits); Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/newcat.c newcat_get_info, which accepts an IF answer of 27 characters as an 8-digit model", note = "Pinned question for the oracle test: whether Hamlib sends the same width." }
verified = { state = "unverified" }

