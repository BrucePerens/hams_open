# Rig description: Philips PRM8060 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/prm80/prm80.c, prm8060.c, read for facts only, and `rigctl -m 28001 --dump-caps`); no vendor protocol document was read and no code or comments were copied.
# Hamlib lists: serial 4800 baud 7E1, no handshake; 144 to 146 MHz (Region 1) or 144 to 148 MHz (Region 2), FM, 12.5 kHz steps; transmit 5 to 25 W.
# Dialect prm8060: `E` answers 22 hex characters (mode, channel, channel state, squelch, volume, lock, receive PLL word, transmit PLL word, signal); VFO A reads the receive frequency, VFO B the transmit frequency, mode bit 3 is transmit. READ ONLY: the setters (`R`, `N`, ...) are prompt dialogues (a `:` prompt per argument) that the one-request engine interface cannot run; setting is not described. See docs/RIG_COVERAGE_PLAN.md.
schema = 1
capabilities = ["read-frequency", "second-vfo", "read-ptt", "read-signal"]

[rig]
id = "philips-prm8060"
name = "Philips PRM8060"
family = "serial-vendor"

[vendor]
protocol = "prm80"
dialect = "prm8060"
data_bits = 7
parity = "E"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 145000000
mode = "fm"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 28001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 28001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/prm80/prm80.c, prm8060.c (frame formats, serial line settings and the dialect split)", note = "Command frames and line settings read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 28001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/prm80/prm80.c, prm8060.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }
