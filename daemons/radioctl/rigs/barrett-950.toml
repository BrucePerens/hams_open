# Rig description: Barrett 950 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/barrett/barrett.c, 950.c, read for facts only, and `rigctl -m 32002 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..9600 baud, 8N1, handshake XONXOFF; receive 1600000 to 30000000 Hz in 1 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect barrett950 (barrett.rs): CR-ended commands, answers framed by XOFF and XON. Hamlib tunes the 950 only through a memory channel (ten band channels from number 0: `XC`, `IDC`, `PC`), so the description has no second VFO or split; Hamlib has no PTT read for it. The first byte of the `IB` mode answer is not read by Hamlib and is an assumption.
# Serial line: Hamlib's handshake for this radio is XON/XOFF, but every answer is framed by an XOFF byte in front and an XON byte at the end, which a kernel serial port with software flow control would swallow before the engine saw them; the description therefore asks for no flow control (an open question: whether the radio needs its flow-control bytes honoured).
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "set-ptt"]

[rig]
id = "barrett-950"
name = "Barrett 950"
family = "serial-vendor"

[vendor]
protocol = "barrett"
dialect = "barrett950"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[modes]]
mode = "usb"
code = "U"

[[modes]]
mode = "lsb"
code = "L"

[[modes]]
mode = "cw"
code = "C"

[[modes]]
mode = "am"
code = "A"

[[modes]]
mode = "rtty"
code = "F"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 32002 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 32002 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/barrett/barrett.c, 950.c rigs/barrett/barrett.c (frame formats)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 32002 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/barrett/barrett.c, 950.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/barrett/barrett.c, 950.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
