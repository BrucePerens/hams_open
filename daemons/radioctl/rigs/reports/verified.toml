# Hardware verification reports for radioctl rig descriptions. HUMAN-EDITED by a maintainer.
#
# This file is the only place that records WHO reported a hardware test. The state itself lives in
# the `verified` field of the facts in rigs/<id>.toml (state = "hardware-verified", with radio,
# firmware, date and tested). `tools/rig_support_matrix.py` and its test fail if the two disagree:
# every description with a hardware-verified fact needs a [[report]] here, and every [[report]]
# needs a description with a hardware-verified fact. Nothing is copied between them.
#
# How a report gets here: docs/VOLUNTEER_TESTING.md ("How a maintainer promotes a description").
# The first entry is the KX3 bench run of 2026-11-05.
#
# Entry format (keep one [[report]] per radio and test day):
#
#   [[report]]
#   rig = "icom-ic-7300"                  # the description id (file stem in rigs/)
#   radio = "IC-7300"                     # as in the facts' `radio` field; no serial numbers
#   firmware = "1.40"                     # as in the facts' `firmware` field
#   date = "2026-11-07"                   # YYYY-MM-DD, as in the facts' `date` field
#   reporter = "K6BP"                     # callsign or GitHub user name, as the reporter wishes
#   issue = "https://github.com/OWNER/REPO/issues/0"   # the report the maintainer worked from
#   transmit_tested = false               # true only if the transmit procedure was run

[[report]]
rig = "elecraft-kx3"
radio = "Elecraft KX3"
firmware = "MCU 3.02 / DSP 1.52"
date = "2026-11-05"
reporter = "K6BP (bench run by Claude on bruce-toughpad)"
issue = "hams_com docs/reviews/KX3_RADIOCTL_2026-11-05.md"
transmit_tested = true
