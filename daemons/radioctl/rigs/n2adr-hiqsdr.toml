# Rig description: N2ADR HiQSDR (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/hiqsdr.c, read for facts only, and `rigctl -m 25014 --dump-caps`); no HiQSDR document was read and no code or table was copied.
# Hamlib lists: a UDP port (default 192.168.2.196, port 48248), receive and transmit 100 kHz to 66 MHz, modes CW and DSB, a transmit level of 1 to 50 mW. The description format has no field for frequency ranges, so they are not repeated here. Use the udp transport of radioctld; the serial settings in [vendor] are unused.
# Dialect hiqsdr (hiqsdr.rs): a 22-byte control frame carrying all the state (tuning phase word from the 122.88 MHz reference clock, mode and key byte); every command sends the whole frame. Hamlib cannot read anything back, so there are no read capabilities. Hamlib's DSB is shown as AM, the nearest radioctl mode. Not in the engine: attenuator, preamplifier, transmit level, antenna switch, split.
schema = 1
capabilities = ["set-frequency", "set-mode", "set-ptt"]

[rig]
id = "n2adr-hiqsdr"
name = "N2ADR HiQSDR"
family = "serial-vendor"

[vendor]
protocol = "hiqsdr"
dialect = "hiqsdr"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 500
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "am"

[[modes]]
mode = "cw"
code = 1

[[modes]]
mode = "am"
code = 2

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25014 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25014 --dump-caps` (Hamlib 4.6.2): timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/hiqsdr.c (hiqsdr_open, hiqsdr_set_freq, hiqsdr_set_mode, hiqsdr_set_ptt, send_command)", note = "The control frame layout read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25014 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/hiqsdr.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; Hamlib's get_freq is not implemented." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/hiqsdr.c (hiqsdr_set_mode: byte 11 is 1 for CW and 2 for everything else)", note = "Hamlib lists CW and DSB; AM stands in for DSB because radioctl has no DSB." }
verified = { state = "unverified" }
