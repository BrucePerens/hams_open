# Rig description: Elecraft XG3 signal source (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED on hardware until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected. The command forms and the serial line were read in the XG3 Owner's Manual pages 18 to 22 (marked manual-checked); the rest is from Hamlib 4.6.2 (rigs/kenwood/xg3.c, read for facts only, and `rigctl -m 2038 --dump-caps`).
# Dialect xg3 (xg3.rs): one-letter commands ended by ';' or CR, `F` frequency in eleven digits of hertz (1.5 to 1400 MHz), `O` output on or off, `V` version. A signal source has no mode, so the description has none. Its "PTT" is the RF output switch and stays behind the transmit gate. Not in the engine: the output level (`L`, 0 to 3, whose scale runs from 0 dBm down to -107 dBm, backwards for RfPower), the twelve memories, the sweeps and the LED brightness.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-ptt", "set-ptt", "identify"]

[rig]
id = "elecraft-xg3"
name = "Elecraft XG3"
family = "serial-vendor"

[vendor]
protocol = "xg3"
dialect = "xg3"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14025000
mode = "cw"

[[modes]]
mode = "cw"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2038 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2038 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio. The mode is a placeholder: the XG3 has none." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "repo-code", reference = "placeholder so that the description loads: a signal source has no mode, no engine command reads or sets it", note = "Not a fact about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.protocol"
provenance = { kind = "manual", reference = "Elecraft XG3 Owner's Manual E740154, file xg3_owners_manual.pdf, https://archive.org/download/elecraft_E740154_XG3_Owners_Manual/, sha256 c387e632e48074f4fe5e4e990b73acc24e3c6612fdfdd2baa5fd72132c992c59, page 18: serial port 9600 bits/s, 8 data bits, 1 stop bit, no parity; commands end with ';' or CR", note = "Hamlib asks for no handshake; the manual names none." }
verified = { state = "manual-checked", reference = "XG3 Owner's Manual p. 18, Serial Port Settings and Transmission Protocol" }

[[facts]]
key = "vendor.dialect"
provenance = { kind = "manual", reference = "Elecraft XG3 Owner's Manual E740154, sha256 c387e632e48074f4fe5e4e990b73acc24e3c6612fdfdd2baa5fd72132c992c59, pages 18 to 22 (Command Reference): F[,frequency] eleven digits 1.5 to 1400 MHz, O[,control] 01 on and 00 off, V version answered V,1.00;, answers echo the command letter, unknown commands are ignored", note = "Command forms checked against the manual's examples; whether the XG3 also echoes the terminator before an answer is an open question (page 19 says semicolons are echoed, its examples show none)." }
verified = { state = "manual-checked", reference = "XG3 Owner's Manual pp. 18-22, F, O and V commands" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/xg3.c (set_freq, get_freq, set_ptt, get_ptt) and `rigctl -m 2038 --dump-caps`", note = "Hamlib maps the output switch to PTT; read for facts only, no code copied. The manual's O command agrees." }
verified = { state = "unverified" }
