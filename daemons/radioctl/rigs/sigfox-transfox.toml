# Rig description: SigFox Transfox transverter controller (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kenwood/transfox.c and the Kenwood routines it uses, read for facts only, and `rigctl -m 2032 --dump-caps`); no vendor document was read (none was found) and no code or table was copied.
# Hamlib lists: serial 9600..19200 baud, 8N1, handshake NONE; receive and transmit 1 MHz to 1450 MHz in 1 range(s), 192 kHz filter, USB only. The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect transfox (transfox.rs): the Kenwood framing without the ID handshake. `FA` and eleven digits of hertz set the frequency, `TX;` and `RX;` key it, `Cs;` reads the transmit state (the two-character answer format is an assumption). Not in the engine: the attenuator and preamplifier (`C2x`, `C3x`, `C20` to `C22`, `C30` to `C32`) and the firmware string (`CS`).
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-ptt", "set-ptt"]

[rig]
id = "sigfox-transfox"
name = "SigFox Transfox"
family = "serial-vendor"

[vendor]
protocol = "transfox"
dialect = "transfox"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 10

[defaults]
frequency_hz = 144200000
mode = "usb"

[[modes]]
mode = "usb"
code = "U"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2032 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2032 --dump-caps` (Hamlib 4.6.2): Write delay, Post Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/transfox.c (TRANSFOX_MODES is USB only, no set_mode or get_mode)", note = "The one mode Hamlib lists; the code is radioctl's placeholder because no command reads or sets the mode." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/transfox.c (transfox_get_ptt: Cs; two-character answer, T for keyed) and rigs/kenwood/kenwood.c (kenwood_set_freq, kenwood_get_freq, kenwood_set_ptt)", note = "Command frames read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2032 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kenwood/transfox.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio." }
verified = { state = "unverified" }
