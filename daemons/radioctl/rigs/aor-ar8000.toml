# Rig description: AOR AR8000 (aor protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (read for facts only: rigs/aor/aor.c, rigs/aor/ar8000.c) and `rigctl -m 5002 --dump-caps` output;
# no vendor manual was read. The engine and its gaps: crates/radioctl-protocols/src/aor.rs.
# Hamlib lists: serial 4800..19200 baud, 8N2, handshake XONXOFF; receive 500 kHz to 1900 MHz (1 range(s)); no transmit range (receiver). The description format has no field
# for frequency ranges, filters or function lists, so they are not repeated beyond this note.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-signal"]

[rig]
id = "aor-ar8000"
name = "AOR AR8000"
family = "receiver"

[receiver]
protocol = "aor"
dialect = "ar8000"
baud = 9600
data_bits = 8
parity = "N"
stop_bits = 2
flow = "xonxoff"

[timing]
timeout_ms = 200
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 145500000
mode = "fm"

[[modes]]
mode = "wfm"
code = 48

[[modes]]
mode = "fm"
code = 49

[[modes]]
mode = "am"
code = 50

[[modes]]
mode = "usb"
code = 51

[[modes]]
mode = "lsb"
code = 52

[[modes]]
mode = "cw"
code = 53

