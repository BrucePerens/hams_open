# Rig description: Icom IC-7300 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED: no radio has been connected. Icom's published CI-V guide was NOT used (its
# download terms forbid reuse of its data); the facts come from Hamlib 4.6.2 source, read for facts only,
# with the file and function named in each fact below. Gaps are listed in crates/radioctl-protocols/src/civ.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "send-cw", "transceive", "split", "rit-xit", "filter", "levels", "identify", "scope", "read-meters", "repeater"]

[rig]
id = "icom-ic-7300"
name = "Icom IC-7300"
family = "icom-civ"

[civ]
address = 0x94
controller = 0xE0
model_id = 0x94
echo = false

[scope]
receivers = 1
line_length = 475
samples_per_frame = 50
amplitude_max = 160
spans_hz = [5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000]

[levels]
attenuator_db = [20]
attenuator_any_up_to_db = 0
preamp_steps = 2

[power_meter]
raw_to_milliwatts = [[0, 0], [143, 50000], [213, 100000]]

# HF and 50 MHz are rated 100 W; the 70 MHz band of some versions 50 W.
[[power_meter.band]]
max_hz = 60000000
raw_to_milliwatts = [[0, 0], [143, 50000], [213, 100000]]

[[power_meter.band]]
max_hz = 80000000
raw_to_milliwatts = [[0, 0], [143, 25000], [213, 50000]]

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[frequency]
min_hz = 30000
max_hz = 74800000

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "cw"
code = 0x03

[[modes]]
mode = "rtty"
code = 0x04

[[modes]]
mode = "fm"
code = 0x05

[[modes]]
mode = "cw-r"
code = 0x07

[[modes]]
mode = "rtty-r"
code = 0x08

# Data modes are a sideband code plus the DATA flag of command 26 (USB-D, LSB-D); they are listed after the
# plain modes so that a code read back without the flag is the plain mode. See the "mode.data" fact.
[[modes]]
mode = "data"
code = 0x01

[[modes]]
mode = "data-r"
code = 0x00

