key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/icom_defs.h (C_CTL_SPLT 0F, C_CTL_LVL 14, C_CTL_RIT 21, C_SEND_SEL_FREQ 25, C_RD_TRXID 19) and rigs/icom/icom.c (icom_get_rit_new, icom_set_it_new, icom_get_dsp_flt, icom_set_dsp_flt)", note = "Icom's own CI-V reference guide was not used: icomjapan.com's download terms forbid reuse of the manuals' data, and radioctl skips such sources. Facts only were read from Hamlib; no code or table was copied. Capabilities are those the engine implements, taken as present on this model because Hamlib's capability lists for it include them." }
