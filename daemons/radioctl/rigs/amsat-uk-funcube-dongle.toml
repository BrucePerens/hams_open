# Rig description: AMSAT-UK FUNcube Dongle (usb-device, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/funcube.c, funcube.h, read for facts only) and `rigctl -m 25013 --dump-caps`; no vendor document was read and no code was copied.
# Hamlib lists: receive 50 MHz to 2.5 GHz. HID reports of 64 bytes on interrupt endpoints 0x02 (out) and 0x82 (in), interface 2: command 0x65 sets the frequency in Hz (32 bits, little endian), 0x66 reads it, the reply echoes the command and a success byte. Attenuator, preamplifier and signal strength are also read and set (LNA 0x6E and 0x96, RSSI 0x68).
# ENGINE: crates/radioctl-protocols/src/funcube.rs (frequency, LNA levels, RSSI; 64-byte reports as libusb interrupt transfers on interface 2) over the USB transport (radioctl-core usb_link; `transport kind = "usb"` in radioctld, which needs a build with the `usb` cargo feature and libusb-1.0). Tested only against the virtual twin on the fake USB bus; unverified on a dongle.
schema = 1
capabilities = ["read-frequency", "set-frequency", "levels", "read-signal"]

[rig]
id = "amsat-uk-funcube-dongle"
name = "AMSAT-UK FUNcube Dongle"
family = "usb-device"

[usb]
protocol = "funcube"
vendor_id = 0x04D8
product_id = 0xFB56
manufacturer = "Hanlincrest Ltd."
product = "FunCube Dongle"
multiplier = 0

[levels]
attenuator_db = [2, 5]
attenuator_any_up_to_db = 0
preamp_steps = 6

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25013 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25013 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "usb.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/funcube.c, funcube.h (USB ids, manufacturer and product strings, multiplier)", note = "Read for facts only; no code copied. HID reports of 64 bytes on interrupt endpoints 0x02 (out) and 0x82 (in), interface 2: command 0x65 sets the frequency in Hz (32 bits, little endian), 0x66 reads it, the reply echoes the command and a success byte. Attenuator, preamplifier and signal strength are also read and set (LNA 0x6E and 0x96, RSSI 0x68)." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25013 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/funcube.c, funcube.h", note = "A capability is claimed when Hamlib's backend implements it. Frequency, the LNA preamp and attenuator levels and the raw RSSI are implemented, by the FUNcube engine (funcube.rs); tested against its virtual twin, not a dongle." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/funcube.c funcube_set_level, funcube_get_level, funcubepro_set_level, funcubepro_get_level; funcube.h (commands 0x6E, 0x72, 0x75, 0x96, 0x9A, 0x9D, 0x68)", note = "Read for facts only; no code copied. One LNA setting (command 0x6E, read 0x96) holds a code: radioctl preamp steps 1 to 6 are Hamlib's 5, 10, 15, 20, 25 and 30 dB (codes 6, 8, 10, 12, 13, 14), attenuator steps 1 and 2 its 2 and 5 dB (codes 1 and 0), code 4 is off. RSSI is command 0x68, reported raw." }
verified = { state = "unverified" }
