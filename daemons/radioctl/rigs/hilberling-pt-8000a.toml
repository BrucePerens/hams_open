# Rig description: Hilberling PT-8000A (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kenwood/ts480.c (pt8000a_caps), read for facts only, and `rigctl -m 2046 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..57600 baud, 8N1, handshake NONE; receive 9000 to 148000000 Hz in 5 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# TS-480 emulation on the classic Kenwood engine. Hamlib marks the PT-8000A as not knowing the AI command (kenwood.c); the engine does not send AI. Hamlib lists AM-sync and PTT through the microphone-data path; radioctl keeps the plain PTT command (unverified).
# The ID answer is 20 (Hamlib's kenwood.c comment: "TS480 ID but behaves differently").
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "hilberling-pt-8000a"
name = "Hilberling PT-8000A"
family = "kenwood-ascii"

[kenwood]
model_id = 20

[timing]
timeout_ms = 500
retries = 10
inter_command_ms = 0

[defaults]
frequency_hz = 7100000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2046 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2046 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts480.c (pt8000a_caps) and kenwood.c (kenwood_id_string_list)", note = "Hamlib's kenwood.c lists \"020\" for the PT-8000A with the comment that it is the TS-480 ID but behaves differently." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2046 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kenwood/ts480.c (pt8000a_caps)", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts480.c (pt8000a_caps) (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
