# Rig description: Yaesu FT-991A (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Written from Yaesu's published CAT Operation Reference Manual (document, PDF page and sha256 in each fact).
# No radio has been connected, so every `verified` is unverified. Gaps: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "transceive", "split", "rit-xit", "levels", "identify"]

[rig]
id = "yaesu-ft-991a"
name = "Yaesu FT-991A"
family = "yaesu-newcat"

[yaesu]
model_id = 670

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu FT-991A 'CAT Operation Reference Manual' (pages headed 'FT-991 CAT Operation Reference Book'), file ft991a_cat_manual.pdf, sha256 52164f737e37a3ffc8276eccedf8ecb524607198c38d386ae4ff7b2fc1d60c95: ID, PDF p. 11: P1 0670: FT-991A" }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1035 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 2000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only a virtual rig's starting state." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Yaesu FT-991A 'CAT Operation Reference Manual' (pages headed 'FT-991 CAT Operation Reference Book'), file ft991a_cat_manual.pdf, sha256 52164f737e37a3ffc8276eccedf8ecb524607198c38d386ae4ff7b2fc1d60c95: FA p. 10, FB p. 10, IF p. 11, MD p. 12, TX p. 18, SM p. 18, RM p. 16, AG p. 5, RG p. 16, MG p. 12, PC p. 15, KS p. 12, RT p. 17, XT p. 19, RC p. 16, RD p. 16, AI p. 5, FT p. 10", note = "FT2/FT3 set which band transmits (FT-991A: VFO-A or VFO-B); IF answer layout P1..P10 as described in yaesu.rs." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu FT-991A 'CAT Operation Reference Manual' (pages headed 'FT-991 CAT Operation Reference Book'), file ft991a_cat_manual.pdf, sha256 52164f737e37a3ffc8276eccedf8ecb524607198c38d386ae4ff7b2fc1d60c95: MD, PDF p. 12: 1 LSB, 2 USB, 3 CW-U, 4 FM, 5 AM, 6 RTTY-LSB, 7 CW-L, 8 DATA-LSB, 9 RTTY-USB, C DATA-USB", note = "Mapping to radioctl modes is ours: CW-U is cw, CW-L is cw-r, RTTY-L is rtty, RTTY-U is rtty-r, DATA-L is data-r, DATA-U is data. Modes A, B, D, E, F (data FM, narrow FM, narrow AM, C4FM/PSK, narrow data FM) are not mapped." }
verified = { state = "unverified" }
