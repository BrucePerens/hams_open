# Rig description: BG2FX FX-4C/FX-4CR/FX-4L (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kenwood/ts590.c (fx4_caps), read for facts only, and `rigctl -m 2053 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 115200 baud only, 8N1, handshake CTS/RTS (the description format has no field for serial settings, so hardware flow control must be set by the operator); receive 30000 to 59999999 Hz in 2 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# Hamlib says the FX4 is supposed to be TS-590S compatible and gives it a separate entry; it runs on the classic Kenwood engine here. Hamlib lists PKTLSB and PKTUSB for it; their Kenwood mode codes are not read here, so the data modes are not listed.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "bg2fx-fx4"
name = "BG2FX FX-4C/FX-4CR/FX-4L"
family = "kenwood-ascii"

[kenwood]
model_id = 21

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2053 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2053 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2053 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kenwood/ts590.c (fx4_caps)", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts590.c (fx4_caps) (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts590.c (fx4_caps) ", note = "Hamlib lists no ID for the FX4; the TS-590S answer is assumed (21), as the model is described as TS-590S compatible. Not read from a radio; unverified." }
verified = { state = "unverified" }
