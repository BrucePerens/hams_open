# Rig description: GomSpace GS100 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/gomspace/gs100.c, read for facts only, and `rigctl -m 35001 --dump-caps`); no vendor protocol document was read and no code or comments were copied.
# Hamlib lists: serial 115200 to 500000 baud 8N1, no handshake; receive and transmit 430 to 440 MHz; one mode (packet FM), no mode command, no PTT.
# Dialect gs100: a console. `param mem 1` selects the receive table and `param mem 5` the transmit table; `param set freq <Hz>` and `param get freq` follow, each command echoed and ended by a colour-coded prompt. radioctl sends the table selection and the command in one write and waits for two prompts; Hamlib sends them one at a time (open question: whether the console accepts a pipelined pair). VFO A is the receive table, VFO B the transmit table. The exact reply layout of `param get` is read from Hamlib's parser (text after an `=`).
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo"]

[rig]
id = "gomspace-gs100"
name = "GomSpace GS100"
family = "serial-vendor"

[vendor]
protocol = "gomspace"
dialect = "gs100"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 437000000
mode = "fm"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 35001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 35001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/gomspace/gs100.c (frame formats, serial line settings and the dialect split)", note = "Command frames and line settings read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 35001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/gomspace/gs100.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }
