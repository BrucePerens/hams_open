# Rig description: Elecraft KX3 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
#
# SOURCE: Elecraft "K3S/K3/KX3/KX2 Programmer's Reference", Rev. G5, February 20, 2019,
#   https://ftp.elecraft.com/KX3/Manuals%20Downloads/K3S&K3&KX3&KX2%20Pgmrs%20Ref,%20G5.pdf
#   sha256 015b60c1b5f44346247a00375a23174012ce4da66a6a27eaa00c00c20877f95d
# The manual has no numbered sections; references below give the manual's own command or
# heading names and the printed page number ("p.").
#
# Written from the manual. Bench run 2026-11-05 on a real KX3 (MCU 3.02 / DSP 1.52, no KXPA100,
# into a dummy load; hams_com docs/reviews/KX3_RADIOCTL_2026-11-05.md): the facts it exercised are
# hardware-verified, each saying what ran. The level ranges in [elecraft] and the power meter were
# measured on that radio; Hamlib 4.6.2's KX3 backend (rigctl -m 2045) agrees on the scales.
# Hamlib source was not read for this file.
schema = 1
capabilities = [
  "read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt",
  "read-signal", "read-power", "send-cw", "transceive", "split", "rit-xit", "filter", "levels",
  "read-swr", "identify",
]

[rig]
id = "elecraft-kx3"
name = "Elecraft KX3"
family = "elecraft-ascii"

[elecraft]
model_id = 17
# Wire ranges where the KX3 differs from the K3 (measured: the radio clamps a set outside them).
levels = { af-gain = [0, 60], rf-gain = [190, 250], mic-gain = [0, 80], rf-power = [0, 15] }

[power_meter]
# PO is tenths of a watt in QRP mode (no KXPA100): 150 is 15 W.
raw_to_milliwatts = [[0, 0], [150, 15000]]

[levels]
attenuator_db = [10]
attenuator_any_up_to_db = 0
preamp_steps = 1

[timing]
timeout_ms = 600
retries = 2
inter_command_ms = 0

[defaults]
frequency_hz = 14060000
mode = "cw"

[[modes]]
mode = "lsb"
code = "1"
[[modes]]
mode = "usb"
code = "2"
[[modes]]
mode = "cw"
code = "3"
[[modes]]
mode = "fm"
code = "4"
[[modes]]
mode = "am"
code = "5"
[[modes]]
mode = "data"
code = "6"
[[modes]]
mode = "cw-r"
code = "7"
[[modes]]
mode = "data-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: title page and Command Set Overview p. 2 (KX3 and KX2 accept all K3 commands; some are KX3/KX2 only)", note = "The id and display name are our own labels." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "ID; answered ID017; and OM; answered OM A-F----B--02; (KX3 with KXAT3 and KXFL3)" }

[[facts]]
key = "elecraft.model_id"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: ID (Transceiver Identifier), p. 14: IDnnn; where nnn is 017; the K3, KX3 and KX2 are told apart with K3; and OM;", note = "Not a unique identifier of a KX3." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "ID; answered ID017;" }

[[facts]]
key = "elecraft.levels"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: PC p. 22 (KX3: 000-012 or 000-015 without a KXPA100); AG, RG and MG ranges measured on the radio", note = "Set out of range and read back: AG061 and AG255 read AG060; RG100 read RG190; MG080 read MG080; ML061 read ML060 (ML stays 0-60); PC015, PC016, PC055 and PC110 read PC010 on 14.060 MHz from this supply, PC000 and PC005 read back as sent. 15 W is the KX3's rated maximum and Hamlib's KX3 scale (RFPOWER 0.333333 at PC005), so rf-power is 0-15 here." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "raw AG/RG/MG/ML/PC sets out of range and read back (see note); radioctld L/l RF, AF, MICGAIN, RFPOWER fractions compared with rigctl -m 2045" }

[[facts]]
key = "power_meter.raw_to_milliwatts"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: PO (Actual Power Output Level, KX3/KX2 only) p. 22: tenths of a watt in QRP mode", note = "Estimated by the radio from drive level, not measured at the load. With a KXPA100 the unit is watts and this calibration is wrong; `OM;` (radioctld self-test check `identify: power amplifier`) shows a P in the second slot when the amplifier is present, which tells the two cases apart." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "KY TEST in CW at PC005 into a dummy load: PO048 (4.8 W) while sending, PO000 in receive" }

[[facts]]
key = "timing.timeout_ms"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: Response Time, p. 3: typically under 10 ms, worst case about 100 ms, up to 500 ms for commands that change bands", note = "600 ms is the 500 ms band-change worst case plus margin." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "about 130 commands at 38400 baud: slowest answer 345 ms (MD; after a mode change to FM), no timeouts once SW000 was decoded" }

[[facts]]
key = "timing.retries"
provenance = { kind = "repo-code", reference = "daemons/radioctl/crates/radioctl-protocols/src/elecraft.rs", note = "Our choice; the manual says nothing about retries." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "never needed in the bench run (no lost answers)" }

[[facts]]
key = "timing.inter_command_ms"
provenance = { kind = "repo-code", reference = "daemons/radioctl/crates/radioctl-protocols/src/elecraft.rs", note = "Our choice; the manual specifies no minimum gap (Response Time, p. 3 warns only that fast polling during transmit should be tested)." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "polls and commands back to back at 0 ms gap: no ?; and no lost answers" }

[[facts]]
key = "levels.*"
provenance = { kind = "manual", reference = "Elecraft K3S/K3/KX3/KX2 Programmer's Reference Rev. G5 (Feb. 20, 2019), file pgmrs_ref_g5.pdf, sha256 015b60c1b5f44346247a00375a23174012ce4da66a6a27eaa00c00c20877f95d: RA p. 22 (RAnn; for the KX3 nn 00 off, 01 on, -10 dB), PA p. 22 (PAn; n 0 off, 1 on; 2 is the K3's KXV3B module)", note = "Main receiver only; the sub-receiver forms (RA$, PA$) are not used." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "RA01 set reads RA01 (attenuator 10 dB) and RA00; PA1/PA0 set and read back" }

[[facts]]
key = "defaults.*"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: Command Format p. 3 and FA and FB p. 11, example FA00014060000;", note = "Only the starting state of a virtual rig; says nothing about the radio. Mode cw is our choice." }
verified = { state = "unverified" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: TX (Transmit Mode) p. 28 and RX (Receive Mode) p. 23", note = "Transmit-capable; the rig actor's transmit gate applies. TX is ignored by the radio in direct data modes (FSK-D, PSK-D)." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "radioctld transmit = true, max_transmit_s = 5, PC005, 14.060 MHz CW: T 1 then TQ1, T 0 then TQ0 (the radio takes 200-300 ms to drop TQ); watchdog unkeyed at 5.6-6.2 s; closing the keying connection unkeyed; SIGINT stop unkeyed; kill -9 then restart unkeyed at start-up; SIGTERM left it keyed until the 2026-11-05 signal fix" }

[[facts]]
key = "capability.send-cw"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: KY (CW or CW-to-DATA Keying from Text) p. 15: KY*[text]; 0 to 24 characters", note = "Transmit-capable; the engine refuses text with ; < > or control characters. The stop is KY EOT followed by RX; (the KX3 ignores the EOT)." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "radioctld b TEST and b TEST TEST TEST at PC005, 14.060 MHz, KS008/KS022: carrier on (PO048-PO050), TQ1 while sending; \\stop_morse (KY EOT then RX;) ended it within 0.5 s. EOT alone did not stop the radio (it kept keying for 2 s+), hence the RX;" }

[[facts]]
key = "capability.transceive"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: Meta-commands: AI p. 4 and AI p. 7; the engine sends AI2; (AI0; to turn off)", note = "AI1 (an IF answer on frequency and mode events) is also decoded if the radio is set to it." }
verified = { state = "unverified" }

[[facts]]
key = "capability.read-ptt"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: TQ (Transmit Query) p. 27; TQ1 also during TX TEST and pre-armed CW transmit" }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "TQ0 and TQ1 read back across every PTT test" }

[[facts]]
key = "capability.read-power"
provenance = { kind = "manual", reference = "Programmer's Reference Rev. G5: PO (Actual Power Output Level, KX3/KX2 only) p. 22; tenths of a watt in QRP mode", note = "Raw units; the reading is approximate (estimated from drive level)." }
verified = { state = "hardware-verified", radio = "Elecraft KX3", firmware = "MCU 3.02 / DSP 1.52", date = "2026-11-05", tested = "PO000 in receive, PO048 while sending KY TEST at PC005" }

