# Rig description: MDS 4710 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/mds/mds.c, 4710.c, read for facts only, and `rigctl -m 36001 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 110..38400 baud, 8N1, handshake CTS; receive 380000000 to 530000000 Hz in 1 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect mds (mds.rs): `TX` and `RX` frequency commands in megahertz, LF-ended; the engine writes both and reads the transmit frequency back with `TX`. Hamlib's driver has no mode commands and its PTT code crashes (it reads no answer and then compares the missing answer with `OK`), so the description has no mode and no PTT. Hamlib's open asks `MODEL`, `SER`, `SREV` and `SHOW DC`, then sends `MODEM NONE` and `PTT 0`; radioctl sends none of that.
schema = 1
capabilities = ["read-frequency", "set-frequency"]

[rig]
id = "mds-4710"
name = "MDS 4710"
family = "serial-vendor"

[vendor]
protocol = "mds"
dialect = "mds"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 450000000
mode = "fm"

[[modes]]
mode = "fm"
code = "F"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 36001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 36001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/mds/mds.c, 4710.c rigs/mds/mds.c (command words)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 36001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/mds/mds.c, 4710.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/mds/mds.c, 4710.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
