# Rig description: CommRadio CTX-10 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/commradio/frame.c, commradio.c, ctx10.c, read for facts only, and `rigctl -m 39001 --dump-caps`); no vendor protocol document was read and no code or comments were copied.
# Hamlib lists: serial 3000000 baud 8N1, no handshake (the line speed is the radio's USB-serial bridge); receive 150 kHz to 30 MHz, AM CW SSB; transmit on the HF ham bands, CW and SSB; Hamlib's mode functions are stubs and there is no PTT command.
# Dialect ctx10: CRC-framed binary (FE addr type bytes crc16 FD, Kermit CRC, FC escapes); type 32 asks the frequency, type 30 sets it, the radio answers 33/31 and sends 34 by itself when the knob turns. Hamlib only logs a CRC mismatch; radioctl refuses the frame (a disagreement with Hamlib, open question). Unverified: the byte layout comes from Hamlib alone.
schema = 1
capabilities = ["read-frequency", "set-frequency"]

[rig]
id = "commradio-ctx-10"
name = "CommRadio CTX-10"
family = "serial-vendor"

[vendor]
protocol = "commradio"
dialect = "ctx10"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 7100000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 39001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 39001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/commradio/frame.c, commradio.c, ctx10.c (frame formats, serial line settings and the dialect split)", note = "Command frames and line settings read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 39001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/commradio/frame.c, commradio.c, ctx10.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }
