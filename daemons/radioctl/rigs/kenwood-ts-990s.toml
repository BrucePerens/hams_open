# Rig description: Kenwood TS-990S (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Nothing here is hardware-verified: no radio has been connected (docs/VOLUNTEER_TESTING.md). The command facts marked manual-checked were compared with Kenwood's TS-990S PC command reference (PDF pages named in each fact, sha256 in the fact); Kenwood's only terms in it are a disclaimer that it does not support nor warrant the document. Nothing here comes from Hamlib source.
# Dialect "ts990": it has the classic IF, FA, RT, XT, RC, RU/RD, SM0, AI2, TX and RX, but the mode is OM0 (read) and OM0<m> (set), there is no MD, FR or FT, and IF has no transmit state (P8 is always 0), so there is no read-ptt.
# The TS-990S has Main and Sub receivers: FA is the main band and FB the sub band, which is a second receiver and not a VFO B, so no second-vfo or split is declared (SP starts a split-frequency setting, it is not a flag).
# Not declared, and why: levels (AG and RG carry a band digit, MG is 000 to 255, PC 005 to 200, KS 004 to 060: the engine's forms and ranges differ, and RA and PA are read with a band digit); CW (KY not implemented for it).
# LAN: the TS-990S also has a TCP/IP CAT stream with ##CN and ##ID login commands (PDF p. 62: account and password lengths 1 to 8, UTF-16, closed after 10 s without traffic). Not implemented here and unverified; the frames differ from the TS-890S's.
# Transmit: set-ptt (TX and RX) is declared; the rig actor's transmit gate stays closed by default and PTT is unverified on hardware.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "set-ptt", "read-signal", "transceive", "rit-xit", "identify"]

[rig]
id = "kenwood-ts-990s"
name = "Kenwood TS-990S"
family = "kenwood-ascii"

[kenwood]
model_id = 22
dialect = "ts990"

[timing]
timeout_ms = 200
retries = 1
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data-r"
code = "C"

[[modes]]
mode = "data"
code = "D"

