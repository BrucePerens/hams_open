provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): title page", note = "The id and display name are our own labels." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): ID, PDF p. 31 (P1 022)", note = "Three digits: ID022;." }
verified = { state = "manual-checked", reference = "TS-990S PC command reference, ID, PDF p. 31" }

[[facts]]
key = "kenwood.dialect"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): OM PDF p. 45 (read OM0;, answer OM0<m>;), IF PDF p. 32 (P8 always 0), and no MD, FR or FT entry in the command tables", note = "Our name for the command set: radioctl-protocols/src/kenwood.rs (dialect ts990)." }
verified = { state = "manual-checked", reference = "TS-990S PC command reference, PDF pp. 32, 45" }

[[facts]]
key = "timing.*"
provenance = { kind = "repo-code", reference = "daemons/radioctl/rigs/kenwood-ts-890s.toml", note = "Our own choice borrowed from the TS-890S file; the reference gives no response time, and this is not a measurement." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/radioctl/rigs/kenwood-ts-590sg.toml", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): TX PDF p. 59 (TX0; transmits by SEND/PTT; with no P1 it is 0; a response only when AI is on) and RX PDF p. 51", note = "Transmit-capable: the rig transmit gate applies and stays closed by default. The transmit state cannot be read (P8 of IF is always 0), so there is no read-ptt. PTT is unverified on hardware." }
verified = { state = "unverified" }

[[facts]]
key = "capability.transceive"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): AI, PDF p. 5 (AI2: on)" }
verified = { state = "manual-checked", reference = "TS-990S PC command reference, AI, PDF p. 5" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): FA (main band, 11 digits, set and read) PDF p. 29; IF (P1 frequency, P3 RIT/XIT frequency, P4 RIT, P5 XIT, P9 mode) PDF p. 32; OM PDF p. 45; RC, RD and RU (set 2: five digits, 00000 to 09999) PDF p. 49; RT PDF p. 51; SM (SM0 read, answer SM0 and four digits, 0000 to 0070) PDF p. 54; XT PDF p. 61", note = "FA is the main band. The RIT offset is read from IF and set with RC then RU or RD." }
verified = { state = "manual-checked", reference = "TS-990S PC command reference, PDF pp. 29, 32, 45, 49, 51, 54, 61" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-990S TRANSCEIVER' (March/29/2013), file ts990_pc_command.pdf (a mirror copy from people.freebsd.org; sha256 4d04e54fdcbf8f07e81da74105bfacf882e33aa5c01d1dd803c7876b548d829c): OM, PDF p. 45: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 FSK, 7 CW-R, 9 FSK-R, C LSB-D1, D USB-D1", note = "Mapping to radioctl modes is ours, as for the TS-890S: FSK is rtty, FSK-R is rtty-r, LSB-D1 is data-r, USB-D1 is data. PSK, FM-D, AM-D and the D2 and D3 letters are not mapped." }
verified = { state = "manual-checked", reference = "TS-990S PC command reference, OM, PDF p. 45" }

