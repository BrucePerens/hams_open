# Rig description: Yaesu FT-847 (unidirectional) (legacy five-byte CAT, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Written from Hamlib 4.6.2 source facts (no Yaesu manual read for this model). No radio has been connected, so every `verified` is unverified.
# Gaps: crates/radioctl-protocols/src/yaesu_legacy.rs.
schema = 1
capabilities = ["set-frequency", "set-mode", "set-ptt"]

[rig]
id = "yaesu-ft-847uni"
name = "Yaesu FT-847 (unidirectional)"
family = "yaesu-legacy"

[yaesu_legacy]
stop_bits = 2

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 50

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "cw"
code = 0x02

[[modes]]
mode = "cw-r"
code = 0x03

[[modes]]
mode = "am"
code = 0x04

[[modes]]
mode = "fm"
code = 0x08

