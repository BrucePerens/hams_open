# Rig description: Optoelectronics OptoScan456 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# The OptoScan is an add-in board for the Realistic PRO-2005/2006 scanners that speaks Icom CI-V at address 0x80. Icom's CI-V guide was NOT used;
# facts come from Hamlib 4.6.2 (rigs/icom/os456.c, rigs/icom/optoscan.c, read for facts only) and `rigctl -m 3053 --dump-caps`.
# Hamlib lists: serial 300..38400 baud, 8N1; receive 25 MHz to 1300 MHz (6 ranges); no transmit range (receiver).
# The OptoScan extensions (remote on/off, status block, CTCSS/DCS/DTMF decode, programmable scan) are not implemented. The description format has no field for ranges.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode"]

[rig]
id = "optoscan-os456"
name = "Optoelectronics OptoScan456"
family = "icom-civ"

[civ]
address = 0x80
controller = 0xE0
model_id = 0x80
echo = false

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 154445000
mode = "fm"

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "fm"
code = 0x05

[[modes]]
mode = "wfm"
code = 0x06

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in `rigctl -m 3053 --dump-caps` (Hamlib 4.6.2)", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "civ.address"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/os456.c (`os456_priv_caps`, `default address` 0x80)", note = "Hamlib's default; the OptoScan board's own address setting was not checked. No Optoelectronics document was read." }
verified = { state = "unverified" }

[[facts]]
key = "civ.controller"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/src/civ_bridge.rs: DEFAULT_CONTROLLER_ADDRESS 0xE0", note = "The conventional controller address; not confirmed by a document." }
verified = { state = "unverified" }

[[facts]]
key = "civ.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/os456.c (default address)", note = "Set equal to the CI-V address as on the other receiver files; no source states a model-id reply, and the capability set does not include `identify`." }
verified = { state = "unverified" }

[[facts]]
key = "civ.echo"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: the simulator does not echo", note = "A design choice for the virtual rig." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 3053 --dump-caps` (Hamlib 4.6.2): Write delay, Post Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: a starting frequency and mode for a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/os456.c rig_caps (icom_set_freq, icom_get_freq, icom_set_mode, icom_get_mode); `rigctl -m 3053 --dump-caps` Can get/set lines", note = "Receiver: no PTT, CW, power or SWR capability is claimed. Frequency and mode use the ordinary CI-V commands. Signal strength and the OptoScan extensions are not implemented, and `identify` is not claimed." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/os456.c (OS*_MODES: AM, FM, WFM) and rigs/icom/icom_defs.h (02 AM, 05 FM, 06 WFM)", note = "Facts only, no code or table copied." }
verified = { state = "unverified" }
