# Rig description: Kenwood TS-870S (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Nothing here is hardware-verified: no radio has been connected (docs/VOLUNTEER_TESTING.md). The command facts marked manual-checked were compared with the TS-870S Instruction Manual's computer control appendix (sha256 in each fact); timing and the model name are Hamlib 4.6.2 (rigs/kenwood/ts870s.c, `rigctl -m 2010 --dump-caps`, facts only).
# Hamlib lists: serial 1200..57600 baud, 8N1, no handshake; the manual's menu 56 offers 1200 to 57600 baud; receive 0.1 to 30 MHz in 2 ranges; transmit 1.8 to 29.7 MHz in 36 ranges; RIT range -9.990kHz/+9.990kHz; attenuator 6/12/18 dB (RA 00..03 in the manual).
# Engine: the classic Kenwood engine (IF answer of 38 characters with the semicolon, MD digits, FA/FB 11 digits): the manual agrees on all three.
# Pinned disagreements with the classic engine (the manual's tables, appendix D): this radio's RU and RD take no parameter (one step per command), so the engine's RC;RUnnnnn; offset set cannot work and `rit-xit` is therefore not declared; AG and RG are AGnnn and RGnnn (no leading 0 on AG, 000 to 255), SM is SMnnnn (0000 to 0030) and KS is 001 to 100, PC 010 to 100: all differ from the engine's forms, so no levels and no signal are declared. A TS-870S dialect in the engine would lift these.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "transceive", "split", "identify"]

[rig]
id = "kenwood-ts-870s"
name = "Kenwood TS-870S"
family = "kenwood-ascii"

[kenwood]
model_id = 15

[timing]
timeout_ms = 500
retries = 10
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2010 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "manual", reference = "Kenwood 'HF TRANSCEIVER TS-870S Instruction Manual', Appendix D 'COM connector protocol' (computer control commands), file ts870s_instruction_manuallib.pdf, https://archive.org/download/manuallib-id-2593504/2593504.pdf (an archive.org copy; Kenwood hosts no PC guide for this model), sha256 143e8273bd352fd0e4fb3bc25c1f095d6d5ba3ec2a0289d1dd6fc11c881f165a, read by us in this session; page numbers are PDF pages (printed page is 6 less): Parameter Table format 16 (MODEL NUMBER: the TS-870S number is 015), PDF p. 90; ID, PDF p. 97", note = "Hamlib 4.6.2 kenwood.c has 15 as well." }
verified = { state = "manual-checked", reference = "TS-870S Instruction Manual, Parameter Table format 16 and ID (PDF pp. 90, 97)" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 2010 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 500ms, 10 retry", note = "Hamlib's settings, not a measurement of the radio. retries is capped at 10 in this repository." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only the starting state of a virtual rig; the frequency is moved inside this model's receive range where needed." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Kenwood 'HF TRANSCEIVER TS-870S Instruction Manual', Appendix D 'COM connector protocol' (computer control commands), file ts870s_instruction_manuallib.pdf, https://archive.org/download/manuallib-id-2593504/2593504.pdf (an archive.org copy; Kenwood hosts no PC guide for this model), sha256 143e8273bd352fd0e4fb3bc25c1f095d6d5ba3ec2a0289d1dd6fc11c881f165a, read by us in this session; page numbers are PDF pages (printed page is 6 less): FA and FB with an 11-digit hertz field (format 4, p. 90; example FA00007000000, p. 91); FR and FT (format 3: 0 VFO A, 1 VFO B, 2 memory) and IF, whose answer ends with the semicolon in column 38 (P4 RIT, P5 XIT, P12 split), p. 97; RT, RC, RU, RD, RX, TX, p. 100; AI (format 32, 0 to 3), p. 95", note = "The declared capabilities use commands of the form the engine sends. rit-xit was removed in this revision: RU and RD of this model take no parameter (p. 100), but the engine sets an offset with RUnnnnn;, so the manual contradicts the engine on that step." }
verified = { state = "manual-checked", reference = "TS-870S Instruction Manual, FA FB FR FT IF RT RX TX AI (PDF pp. 90-100)" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "manual", reference = "Kenwood 'HF TRANSCEIVER TS-870S Instruction Manual', Appendix D 'COM connector protocol' (computer control commands), file ts870s_instruction_manuallib.pdf, https://archive.org/download/manuallib-id-2593504/2593504.pdf (an archive.org copy; Kenwood hosts no PC guide for this model), sha256 143e8273bd352fd0e4fb3bc25c1f095d6d5ba3ec2a0289d1dd6fc11c881f165a, read by us in this session; page numbers are PDF pages (printed page is 6 less): TX and RX, PDF p. 100", note = "Transmit-capable; the rig actor's transmit gate applies and stays closed by default. Whether the radio keys is hardware-unverified." }
verified = { state = "manual-checked", reference = "TS-870S Instruction Manual, RX and TX (PDF p. 100)" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Kenwood 'HF TRANSCEIVER TS-870S Instruction Manual', Appendix D 'COM connector protocol' (computer control commands), file ts870s_instruction_manuallib.pdf, https://archive.org/download/manuallib-id-2593504/2593504.pdf (an archive.org copy; Kenwood hosts no PC guide for this model), sha256 143e8273bd352fd0e4fb3bc25c1f095d6d5ba3ec2a0289d1dd6fc11c881f165a, read by us in this session; page numbers are PDF pages (printed page is 6 less): Parameter Table format 2 (MODE), PDF p. 90: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 FSK, 7 CW-R, 9 FSK-R (0 and 8 no mode)", note = "FSK and FSK-R are mapped to rtty and rtty-r." }
verified = { state = "manual-checked", reference = "TS-870S Instruction Manual, Parameter Table format 2 (PDF p. 90)" }
