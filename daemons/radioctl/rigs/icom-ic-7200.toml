# Rig description: Icom IC-7200 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Icom's manual (where a copy could be read, see the facts marked manual-checked) was read for facts only, under Bruce Perens' decision of 2026-10-31; other facts come from Hamlib 4.6.2
# (rigs/icom/ic7200.c, read for facts only, and `rigctl -m 3061 --dump-caps` output), named in each fact below.
# Hamlib lists: serial 300..19200 baud, 8N1, ctrl=NONE; receive 0.03-60 MHz; transmit 1.81 to 54 MHz in 20 ranges. The description format has no field for
# frequency ranges, filter tables or function lists, so they are not repeated here; the CI-V address, baud rate and
# "CI-V Transceive" are set in the radio's own menu and must match what radioctl is told.
# Hamlib modes with no entry in radioctl's mode vocabulary, not listed: PKTLSB PKTUSB.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "split", "levels", "identify"]

[rig]
id = "icom-ic-7200"
name = "Icom IC-7200"
family = "icom-civ"

[civ]
address = 0x76
controller = 0xE0
model_id = 0x76
echo = false

[levels]
attenuator_db = [20]
attenuator_any_up_to_db = 0
preamp_steps = 1

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "cw"
code = 0x03

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "rtty"
code = 0x04

[[modes]]
mode = "cw-r"
code = 0x07

[[modes]]
mode = "rtty-r"
code = 0x08

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 3061 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "civ.address"
provenance = { kind = "manual", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), no document number read on the cover, PDF page 116 (data-format example showing the radio's default address in the preamble; printed page numbers differ), https://archive.org/download/icom_IC-7200_AdvancedInstructionManual/IC-7200_AdvancedInstructionManual.pdf, sha256 66ceedd4288ade412ba27e6fab4f015a1e01bcc0944d7236d59ee505f48a6f47", note = "The manual's default CI-V address is 0x76, equal to this file's. Cross-check: Hamlib 4.6.2 rigs/icom (default address). WHY: Icom's own download endpoint is excluded by robots.txt (icomjapan.com and icomamerica.com disallow /api/) and the direct file path answers 403, so the copy read is the public archive.org mirror. Read for facts under Bruce Perens' decision of 2026-10-31; nothing was copied or redistributed; the PDF is kept outside every git repository in ~/manuals/icom/ with its sha256 in SHA256SUMS." }
verified = { state = "manual-checked", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), no document number read on the cover, PDF page 116 (data-format example showing the radio's default address in the preamble; printed page numbers dif" }

[[facts]]
key = "civ.controller"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/src/civ_bridge.rs: DEFAULT_CONTROLLER_ADDRESS 0xE0", note = "The conventional controller address; not confirmed by a manual." }
verified = { state = "unverified" }

[[facts]]
key = "civ.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7200.c (`IC7200_priv_caps`, `default address` field)", note = "Set equal to the CI-V address, as on the IC-7300 file. No source read states the 19 00 reply value for this model, so this is an assumption; an older radio may answer 19 00 with NG, which the volunteer self-test will report." }
verified = { state = "unverified" }

[[facts]]
key = "civ.echo"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: the simulator does not echo", note = "A design choice for the virtual rig; USB CI-V does not echo, a single-wire interface does (not measured here)." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 3061 --dump-caps (Hamlib 4.6.2): Write delay and timeout lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7200.c rig_caps `.attenuator` and `.preamp`; rigs/icom/icom.c icom_set_level and icom_get_level (RIG_LEVEL_ATT: command 0x11, BCD decibels; RIG_LEVEL_PREAMP: command 0x16 sub-command 0x02); rigs/icom/icom_defs.h (C_CTL_ATT 0x11, C_CTL_FUNC 0x16, S_FUNC_PAMP 0x02)", note = "Facts only, no code or table copied. The lists are Hamlib's count of steps; the radio may offer more (Hamlib marks some of these lists as guesses). A preamplifier step is a P.AMP number, not a gain in dB." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "rigctl -m 3061 --dump-caps (Hamlib 4.6.2): \"Can set/get PTT\", \"Can set Split VFO\", \"Can set RIT\", \"Can send Morse\", \"Targetable features\", \"Get level\" lines; rigs/icom/ic7200.c rig_caps", note = "Icom's manual for this model was read for facts under Bruce Perens' decision of 2026-10-31 (see the facts marked manual-checked); this fact was not compared with it and is still Hamlib's. Facts only were read from Hamlib; no code or table was copied. A capability is claimed when Hamlib's capability list for the model includes it and the engine implements the command (CI-V 03/04/05/06, 0F, 11, 14, 15, 16, 17, 19, 1A 03, 1C 00, 21, 25); absence in Hamlib is taken as absence on the radio, which may be too cautious. `identify` (command 19 00) is claimed on every file regardless of Hamlib's list; an older radio may answer NG, which the volunteer self-test reports. Settings and CI-V menu items (address, baud rate, transceive) are set at the radio." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), no document number read on the cover, PDF page 120 (band-stacking register mode codes: 00 LSB, 01 USB, 02 AM, 03 CW, 04 RTTY, 05 FM where the model has it, 07 CW-R, 08 RTTY-R; printed page numbers differ), https://archive.org/download/icom_IC-7200_AdvancedInstructionManual/IC-7200_AdvancedInstructionManual.pdf, sha256 66ceedd4288ade412ba27e6fab4f015a1e01bcc0944d7236d59ee505f48a6f47", note = "Every mode code in this file's [[modes]] list equals the manual's code for the same mode. Modes the manual lists that have no entry in radioctl's vocabulary are not in the file (IC-9100: DV 17). Cross-check: Hamlib 4.6.2 rigs/icom/icom_defs.h. WHY: Icom's own download endpoint is excluded by robots.txt (icomjapan.com and icomamerica.com disallow /api/) and the direct file path answers 403, so the copy read is the public archive.org mirror. Read for facts under Bruce Perens' decision of 2026-10-31; nothing was copied or redistributed; the PDF is kept outside every git repository in ~/manuals/icom/ with its sha256 in SHA256SUMS." }
verified = { state = "manual-checked", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), PDF page 120, mode codes" }

[[facts]]
key = "capability.split"
provenance = { kind = "manual", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), CI-V command table, PDF page 117 (command 0F split off/on; printed page numbers differ), https://archive.org/download/icom_IC-7200_AdvancedInstructionManual/IC-7200_AdvancedInstructionManual.pdf, sha256 66ceedd4288ade412ba27e6fab4f015a1e01bcc0944d7236d59ee505f48a6f47", note = "Command 0F with sub-command 00 (split off) and 01 (split on) is in the manual's CI-V table, the form the engine sends. Cross-check: Hamlib 4.6.2. Icom's download endpoint is excluded by robots.txt and the direct path is 403; the copy read is the archive.org mirror; read for facts under Bruce Perens' decision of 2026-10-31, nothing copied." }
verified = { state = "manual-checked", reference = "Icom IC-7200 Advanced Instructions (CI-V chapter), PDF page 117, command 0F split off/on" }
