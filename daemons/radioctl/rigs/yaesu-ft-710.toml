provenance = { kind = "manual", reference = "Yaesu 'FT-710 CAT Operation Reference Manual' (2306-C), file FT-710_CAT_OM_ENG_2306-C.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-710_CAT_OM_ENG_2306-C.pdf, sha256 fdf62b8a5c89e321381d69c53292a6ded045f1ceeeaf04ae21ce856e8e2ff8c2: ID p. 14, FA p. 14, FB p. 14, IF p. 15, MD p. 16, TX p. 22, SM p. 21, AI p. 7, RM p. 20, AG p. 7, RG p. 20, MG p. 16, PC p. 19, KS p. 15, RA p. 19, PA p. 18", note = "The guide's command pages. No split (FT here selects the main or sub band transmitter; ST is not used), no rit-xit (the guide has CF, not RT/XT)." }
