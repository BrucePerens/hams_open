# Rig description: Yaesu FT-710 (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Yaesu's published Yaesu 'FT-710 CAT Operation Reference Manual' (document, PDF page and sha256 in each fact), with Hamlib 4.6.2 as a cross-check.
# Hamlib lists: serial 4800..115200 baud, 8N1, ctrl=NONE; receive 0.03 to 60 MHz in 2 ranges; transmit 1.8 to 70.5 MHz in 42 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 9 digits (`yaesu.frequency_digits`); the IF answer is 28 characters with the semicolon.
# Gaps and open questions: No split (FT here selects the main or sub band transmitter; ST is not used), no rit-xit (the guide has CF, not RT/XT). Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "transceive", "levels", "identify"]

[rig]
id = "yaesu-ft-710"
name = "Yaesu FT-710"
family = "yaesu-newcat"

[yaesu]
model_id = 800

[levels]
attenuator_db = [6, 12, 18]
attenuator_any_up_to_db = 0
preamp_steps = 2

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide and in Hamlib 4.6.2", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1049 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu 'FT-710 CAT Operation Reference Manual' (2306-C), file FT-710_CAT_OM_ENG_2306-C.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-710_CAT_OM_ENG_2306-C.pdf, sha256 fdf62b8a5c89e321381d69c53292a6ded045f1ceeeaf04ae21ce856e8e2ff8c2: ID, PDF p. 14", note = "Hamlib's NC_RIGID table in newcat.c agrees or is recorded in the file header as a disagreement." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1049 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 1000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "levels.attenuator_db"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rig_caps `.attenuator` of the Yaesu FT-710 in rigs/yaesu ([6, 12, 18]) and `rigctl -m 1049 --dump-caps`", note = "The guide (RA p. 19) gives the RA steps; the dB figures are Hamlib's, read for facts only." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "manual", reference = "Yaesu 'FT-710 CAT Operation Reference Manual' (2306-C), file FT-710_CAT_OM_ENG_2306-C.pdf, https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-710_CAT_OM_ENG_2306-C.pdf, sha256 fdf62b8a5c89e321381d69c53292a6ded045f1ceeeaf04ae21ce856e8e2ff8c2: RA (RF ATTENUATOR) p. 19, PA (PRE-AMP (IPO)) p. 18: RA0P2 and PA0P2 (P1 selects the receiver, 0 is MAIN); preamp step 0 is IPO", note = "Preamp steps are IPO, AMP 1 and AMP 2 (two steps)." }
