# Rig description: Kenwood TH-F7E (Kenwood handheld/mobile ASCII CAT, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Written from Hamlib 4.6.2 source facts (no Kenwood manual read for this model). No radio has been connected, so every `verified` is unverified.
# Engine and gaps: crates/radioctl-protocols/src/kenwood_hh.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "set-ptt"]

[rig]
id = "kenwood-th-f7e"
name = "Kenwood TH-F7E"
family = "kenwood-hh"

[kenwood_hh]
dialect = "th"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 145000000
mode = "fm"

[[modes]]
mode = "fm"
code = 0

[[modes]]
mode = "wfm"
code = 1

[[modes]]
mode = "am"
code = 2

[[modes]]
mode = "lsb"
code = 3

[[modes]]
mode = "usb"
code = 4

[[modes]]
mode = "cw"
code = 5

