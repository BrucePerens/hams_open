# Rig description: Kachina 505DSP (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kachina/kachina.c, 505dsp.c, read for facts only, and `rigctl -m 18001 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..9600 baud, 8N1, handshake NONE; no receive range listed. The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect 505dsp (kachina.rs): STX ... ETX frames answered with one byte. Set-only: Hamlib reads only the signal strength. Frequency is a DDS word for 30 kHz to 30 MHz. The mode codes are the ASCII digits 1 to 5 standing for the radio's bytes 1 to 5 (AM, CW, FM, USB, LSB).
schema = 1
capabilities = ["set-frequency", "set-mode", "set-ptt"]

[rig]
id = "kachina-505dsp"
name = "Kachina 505DSP"
family = "serial-vendor"

[vendor]
protocol = "kachina"
dialect = "505dsp"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 200
retries = 2
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[modes]]
mode = "am"
code = "1"

[[modes]]
mode = "cw"
code = "2"

[[modes]]
mode = "fm"
code = "3"

[[modes]]
mode = "usb"
code = "4"

[[modes]]
mode = "lsb"
code = "5"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 18001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 18001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kachina/kachina.c, 505dsp.c rigs/kachina/kachina.c (frame formats and the DDS word)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 18001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kachina/kachina.c, 505dsp.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kachina/kachina.c, 505dsp.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
