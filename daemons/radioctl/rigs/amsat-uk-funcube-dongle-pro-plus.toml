# Rig description: AMSAT-UK FUNcube Dongle Pro+ (usb-device, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/funcube.c, funcube.h, read for facts only) and `rigctl -m 25018 --dump-caps`; no vendor document was read and no code was copied.
# Hamlib lists: receive 150 kHz to 1.9 GHz. Same HID framing as the FUNcube Dongle (commands 0x65 and 0x66); the Pro+ adds LNA, mixer and IF gain commands that are not described here.
# NO ENGINE YET: this device speaks USB vendor requests or HID reports, and radioctl has no USB control or HID transport, so radioctld cannot open it.
# The description records what the transport will need (night_shift_todo/medium/radioctl-usb-hid-transport.md).
schema = 1
capabilities = ["read-frequency", "set-frequency"]

[rig]
id = "amsat-uk-funcube-dongle-pro-plus"
name = "AMSAT-UK FUNcube Dongle Pro+"
family = "usb-device"

[usb]
protocol = "funcube"
vendor_id = 0x04D8
product_id = 0xFB31
manufacturer = "Hanlincrest Ltd."
product = "FunCube Dongle Pro+"
multiplier = 0

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25018 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25018 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "usb.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/funcube.c, funcube.h (USB ids, manufacturer and product strings, multiplier)", note = "Read for facts only; no code copied. Same HID framing as the FUNcube Dongle (commands 0x65 and 0x66); the Pro+ adds LNA, mixer and IF gain commands that are not described here." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25018 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/funcube.c, funcube.h", note = "A capability is claimed when Hamlib's backend implements it; there is no engine yet, so none can be exercised." }
verified = { state = "unverified" }
