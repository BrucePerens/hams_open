# Rig description: QRP Labs QMX (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kenwood/ts480.c (QMX caps), read for facts only, and `rigctl -m 2057 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..256000 baud, 8N1, handshake NONE; receive 4000000 to 14000000 Hz in 1 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# TS-480 emulation on the classic Kenwood engine. Hamlib also lists PKTLSB and PKTUSB for the QMX; their Kenwood mode codes are not read here, so the data modes are not listed.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "qrplabs-qmx"
name = "QRP Labs QMX"
family = "kenwood-ascii"

[kenwood]
model_id = 20

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 7030000
mode = "cw"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "cw-r"
code = "7"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2057 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2057 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 2057 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kenwood/ts480.c (QMX caps)", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts480.c (QMX caps) (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts480.c (qrplabs_caps) and kenwood.c (kenwood_id_string_list: only the TS-480 entry, \"020\")", note = "Hamlib lists no ID for the QRP Labs models; they emulate the TS-480 and the same 20 is assumed. Hamlib's comment in kenwood.c says QRP Labs radios cannot decide between a 37- and a 38-byte IF answer, so the engine's IF parse may need a variant; unverified." }
verified = { state = "unverified" }
