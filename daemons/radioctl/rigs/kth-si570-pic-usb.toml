# Rig description: KTH-SDR kit Si570 PIC-USB (usb-device, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/si570avrusb.c, si570avrusb.h, read for facts only) and `rigctl -m 25011 --dump-caps`; no vendor document was read and no code was copied.
# Hamlib lists: receive 800 kHz to 53.7 MHz. Always the by-value frequency word (request 0x32, read 0x3A); Hamlib gives this model no PTT command.
# ENGINE: crates/radioctl-protocols/src/si570_usb.rs (frequency) over the USB transport (radioctl-core usb_link; `transport kind = "usb"` in radioctld, which needs a build with the `usb` cargo feature and libusb-1.0). Tested only against the virtual twin on the fake USB bus; unverified on a board.
schema = 1
capabilities = ["read-frequency", "set-frequency"]

[rig]
id = "kth-si570-pic-usb"
name = "KTH-SDR kit Si570 PIC-USB"
family = "usb-device"

[usb]
protocol = "si570"
vendor_id = 0x16C0
product_id = 0x05DC
manufacturer = "www.obdev.at"
product = "KTH-SDR-KIT"
multiplier = 2

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25011 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25011 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "usb.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/si570avrusb.c, si570avrusb.h (USB ids, manufacturer and product strings, multiplier)", note = "Read for facts only; no code copied. Always the by-value frequency word (request 0x32, read 0x3A); Hamlib gives this model no PTT command." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25011 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/si570avrusb.c, si570avrusb.h", note = "A capability is claimed when Hamlib's backend implements it. Only frequency is implemented, by the Si570 USB engine (si570_usb.rs); tested against its virtual twin, not a board." }
verified = { state = "unverified" }
