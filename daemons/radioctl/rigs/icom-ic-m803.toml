key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in `rigctl -m 30004 --dump-caps` (Hamlib 4.6.2)", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

