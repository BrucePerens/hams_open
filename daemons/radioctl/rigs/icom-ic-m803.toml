[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icmarine/icmarine.c and the rig_caps in rigs/icmarine/icm803.c; `rigctl -m 30004 --dump-caps` (Hamlib 4.6.2) Can get/set lines", note = "A transceiver: set-ptt is encoded (TRX,TX / TRX,RX) but unverified, and the transmit gate stays closed by default. Frequency (RXF, with TXF sent first as Hamlib does), mode, PTT and the S-meter (SIGM) are what the engine implements; split, levels, tuner, noise blanker, AGC and the REMOTE,ON sentence Hamlib sends at open are not. The remote id (receiver.address) must match the radio's menu setting." }
verified = { state = "unverified" }

