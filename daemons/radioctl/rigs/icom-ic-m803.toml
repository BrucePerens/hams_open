# Rig description: Icom IC-M803 (icom-marine protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (read for facts only: rigs/icmarine/icmarine.c, rigs/icmarine/icm803.c) and `rigctl -m 30004 --dump-caps` output;
# no vendor manual was read. The engine and its gaps: crates/radioctl-protocols/src/icom_marine.rs.
# Hamlib lists: serial 4800..4800 baud, 8N1, handshake NONE; receive 500 kHz to 29.9999 MHz (2 range(s)); transmit 1.6 MHz to 27.5 MHz. The description format has no field
# for frequency ranges, filters or function lists, so they are not repeated beyond this note.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal"]

[rig]
id = "icom-ic-m803"
name = "Icom IC-M803"
family = "receiver"

[receiver]
protocol = "icom-marine"
dialect = "icmarine"
address = 20
baud = 4800
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 500
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 4125000
mode = "usb"

[[modes]]
mode = "lsb"
code = 1

[[modes]]
mode = "usb"
code = 2

[[modes]]
mode = "cw"
code = 3

[[modes]]
mode = "am"
code = 4

[[modes]]
mode = "rtty"
code = 5

