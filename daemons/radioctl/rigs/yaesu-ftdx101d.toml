# Rig description: Yaesu FTDX101D (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Written from Yaesu's published CAT Operation Reference Manual (document, PDF page and sha256 in each fact).
# No radio has been connected, so every `verified` is unverified. Gaps: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "transceive", "rit-xit", "levels", "identify"]

[rig]
id = "yaesu-ftdx101d"
name = "Yaesu FTDX101D"
family = "yaesu-newcat"

[yaesu]
model_id = 681

[levels]
attenuator_db = [6, 12, 18]
attenuator_any_up_to_db = 0
preamp_steps = 2

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu FTDX101D/FTDX101MP 'CAT Operation Reference Manual' (FTDX101D_CAT_OM_ENG_1904-A.pdf, as mirrored by radioamatore.info; yaesu.com hosts the original), sha256 c1f65e35fc406fedea6cd75aaa710831f1be2b5058b6e23befa8d7e22039d88c: ID, PDF p. 12: P1 0681: FTDX101D" }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1040 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 2000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "manual", reference = "Yaesu FTDX101 CAT Operation Reference Manual, file ftdx101_cat.pdf, sha256 c1f65e35fc406fedea6cd75aaa710831f1be2b5058b6e23befa8d7e22039d88c: RA (RF ATTENUATOR) PDF p. 18, PA (PRE-AMP (IPO)) PDF p. 16: RA P1P2 (P1 0 MAIN band, 1 SUB band; P2 0 OFF, 1 6 dB, 2 12 dB, 3 18 dB); PA P1P2 (P2 0 IPO, 1 AMP 1, 2 AMP 2); radioctl addresses the MAIN band (P1 0) only" }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only a virtual rig's starting state." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Yaesu FTDX101D/FTDX101MP 'CAT Operation Reference Manual' (FTDX101D_CAT_OM_ENG_1904-A.pdf, as mirrored by radioamatore.info; yaesu.com hosts the original), sha256 c1f65e35fc406fedea6cd75aaa710831f1be2b5058b6e23befa8d7e22039d88c: FA p. 12, FB p. 12, IF p. 13, MD p. 14, TX p. 21, SM p. 20, RM p. 18, AG p. 5, RG p. 18, MG p. 14, PC p. 17, KS p. 13, RT p. 19, XT p. 22, RC p. 18, RD p. 18, AI p. 5, FT p. 12", note = "On the FTDX101 FA and FB are the MAIN and SUB band frequencies, not VFO A and B, so second-vfo and split are not claimed. The MP (ID 0682 in other sources) is not covered." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu FTDX101D/FTDX101MP 'CAT Operation Reference Manual' (FTDX101D_CAT_OM_ENG_1904-A.pdf, as mirrored by radioamatore.info; yaesu.com hosts the original), sha256 c1f65e35fc406fedea6cd75aaa710831f1be2b5058b6e23befa8d7e22039d88c: MD, PDF p. 14: 1 LSB, 2 USB, 3 CW-U, 4 FM, 5 AM, 6 RTTY-LSB, 7 CW-L, 8 DATA-LSB, 9 RTTY-USB, C DATA-USB", note = "Mapping to radioctl modes is ours: CW-U is cw, CW-L is cw-r, RTTY-L is rtty, RTTY-U is rtty-r, DATA-L is data-r, DATA-U is data. Modes A, B, D, E, F (data FM, narrow FM, narrow AM, C4FM/PSK, narrow data FM) are not mapped." }
verified = { state = "unverified" }
