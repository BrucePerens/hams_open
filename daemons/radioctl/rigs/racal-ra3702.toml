# Rig description: Racal RA3702 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/racal/ra37xx.c, ra3702.c, read for facts only, and `rigctl -m 11005 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 50..9600 baud, 7E1, handshake XONXOFF; receive 15000 to 29999999 Hz in 1 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect ra3702 of the Racal family (racal.rs): packet frames, LF then the command then CR, no receiver address (Hamlib's default -1); frequency in hertz (`F`, asked with `QF`), mode a number (`M`, asked with `QM`). Hamlib's mode read goes on to ask `QB` and `QBCON`, whose answers it does not use; radioctl does not. Mode codes: 1 USB, 2 LSB, 3 AM, 4 FM, 5 CW, 6 FSK. Hamlib's CW-R is the same code 5 with a different filter type and is not described. A receiver: no PTT.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode"]

[rig]
id = "racal-ra3702"
name = "Racal RA3702"
family = "serial-vendor"

[vendor]
protocol = "racal"
dialect = "ra3702"
data_bits = 7
parity = "E"
stop_bits = 1
flow = "xonxoff"

[timing]
timeout_ms = 1000
retries = 2
inter_command_ms = 0

[defaults]
frequency_hz = 10000000
mode = "am"

[[modes]]
mode = "usb"
code = "1"

[[modes]]
mode = "lsb"
code = "2"

[[modes]]
mode = "am"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "cw"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 11005 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 11005 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/racal/ra37xx.c, ra3702.c rigs/racal/ra37xx.c (packet framing and commands)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 11005 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/racal/ra37xx.c, ra3702.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/racal/ra37xx.c, ra3702.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
