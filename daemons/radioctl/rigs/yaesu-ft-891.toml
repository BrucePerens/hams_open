# Rig description: Yaesu FT-891 (newcat ASCII, schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Written from Yaesu's published Yaesu 'FT-891 CAT Operation Reference Book' (document, PDF page and sha256 in each fact), with Hamlib 4.6.2 as a cross-check.
# Hamlib lists: serial 4800..38400 baud, 8N2, ctrl=CTS; receive 0.03 to 470 MHz in 2 ranges; transmit 1.8 to 54 MHz in 40 ranges; RIT range -9.999kHz/+9.999kHz.
# Frequency fields are 9 digits (`yaesu.frequency_digits`); the IF answer is 28 characters with the semicolon.
# Gaps and open questions: The guide gives ID 0650; Hamlib's table has 135. No split (the guide has ST, not FT 2/3), no rit-xit (the guide has CF, not RT/XT), no levels (RG is 000-030 here). Details: crates/radioctl-protocols/src/yaesu.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "transceive", "identify"]

[rig]
id = "yaesu-ft-891"
name = "Yaesu FT-891"
family = "yaesu-newcat"

[yaesu]
model_id = 650

[timing]
timeout_ms = 2000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "data-r"
code = "8"

[[modes]]
mode = "rtty-r"
code = "9"

[[modes]]
mode = "data"
code = "C"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the guide and in Hamlib 4.6.2", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1036 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu.model_id"
provenance = { kind = "manual", reference = "Yaesu 'FT-891 CAT Operation Reference Book', file FT-891_CAT_OM_ENG_1909-C.pdf, https://yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-891_CAT_OM_ENG_1909-C.pdf, sha256 59e2295177633b970408bec10aae62f697c3bde5fe48a3be25282d992bc3bbb0: ID, PDF p. 11; The guide gives ID 0650; Hamlib's table has 135. No split (the guide has ST, not FT 2/3), no rit-xit (the guide has CF, not RT/XT), no levels (RG is 000-030 here).", note = "Hamlib's NC_RIGID table in newcat.c agrees or is recorded in the file header as a disagreement." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 1036 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 2000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only a virtual rig's starting state." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Yaesu 'FT-891 CAT Operation Reference Book', file FT-891_CAT_OM_ENG_1909-C.pdf, https://yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-891_CAT_OM_ENG_1909-C.pdf, sha256 59e2295177633b970408bec10aae62f697c3bde5fe48a3be25282d992bc3bbb0: ID p. 11, FA p. 10, FB p. 10, IF p. 11, MD p. 12, TX p. 19, SM p. 18, AI p. 5, RM p. 17", note = "The guide's command pages. The guide gives ID 0650; Hamlib's table has 135. No split (the guide has ST, not FT 2/3), no rit-xit (the guide has CF, not RT/XT), no levels (RG is 000-030 here)." }
verified = { state = "unverified" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "manual", reference = "Yaesu 'FT-891 CAT Operation Reference Book', file FT-891_CAT_OM_ENG_1909-C.pdf, https://yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-891_CAT_OM_ENG_1909-C.pdf, sha256 59e2295177633b970408bec10aae62f697c3bde5fe48a3be25282d992bc3bbb0: TX, PDF p. 19 (TX1 is CAT TX on, TX0 off)", note = "Transmit-capable; the rig actor's transmit gate applies and stays closed by default. Unverified." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu 'FT-891 CAT Operation Reference Book', file FT-891_CAT_OM_ENG_1909-C.pdf, https://yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FT-891_CAT_OM_ENG_1909-C.pdf, sha256 59e2295177633b970408bec10aae62f697c3bde5fe48a3be25282d992bc3bbb0: MD, PDF p. 12: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 RTTY, 7 CW, 8 DATA, 9 RTTY, B FM-N, C DATA, D AM-N", note = "Mapping to radioctl modes is ours: 6 is rtty, 9 is rtty-r, 8 is data-r and C is data, following the FT-991A convention: the guide does not say which sideband the two DATA codes are." }
verified = { state = "unverified" }
