# Rig description: ADAT ADT-200A (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/adat/adat.c, adat.h, adt_200a.c, read for facts only, and `rigctl -m 29001 --dump-caps`); no vendor protocol document was read and no code or comments were copied.
# Hamlib lists: serial 115200 baud 8N1, no handshake; receive 10 kHz to 30 MHz, 50 to 50.5, 70 to 70.7 and 146 to 148 MHz; modes CW, CW-R, LSB, USB, AM, AM-SL, AM-SU, FM.
# Dialect adt200a: `$FR1:<Hz>` CR sets the frequency, `$MOD:<nn>` CR the mode, `$MOX>`/`$MOX<` CR key and unkey (none answered); `$FRA?`, `$MOD?`, `$MTR?` CR read them back. Hamlib takes the part of the answer after the first space; the part before it is not examined and its exact text is unknown. AM-SL and AM-SU (AM with a sideband filter) have no radioctl mode and read as unrecognised.
# Transmit-capable (set-ptt): the transmit gate stays closed by default.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "adat-adt-200a"
name = "ADAT ADT-200A"
family = "serial-vendor"

[vendor]
protocol = "adat"
dialect = "adt200a"

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[modes]]
mode = "cw-r"
code = 0

[[modes]]
mode = "cw"
code = 1

[[modes]]
mode = "lsb"
code = 2

[[modes]]
mode = "usb"
code = 3

[[modes]]
mode = "am"
code = 5

[[modes]]
mode = "fm"
code = 8

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 29001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 29001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/adat/adat.c, adat.h, adt_200a.c (frame formats, serial line settings and the dialect split)", note = "Command frames and line settings read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 29001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/adat/adat.c, adat.h, adt_200a.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/adat/adat.c, adat.h, adt_200a.c (mode codes)", note = "Mode codes as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
