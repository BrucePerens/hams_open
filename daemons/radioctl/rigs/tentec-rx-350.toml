# Rig description: Ten-Tec RX-350 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/tentec/tentec2.c, rx350.c, read for facts only, and `rigctl -m 16005 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 57600..57600 baud, 8N1, handshake CTS; receive 100000 to 30000000 Hz in 1 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect argonaut: Hamlib's RX-350 backend (rx350.c) uses the same routines as the Argonaut V (tentec2.c): binary frequency, `G`/`Z` replies. Hamlib's own comment says the RX-350 backend is a skeleton in which only set_freq is supposed to work, so reads and mode are unverified even as Hamlib behaviour. A receiver: no PTT.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode"]

[rig]
id = "tentec-rx-350"
name = "Ten-Tec RX-350"
family = "serial-vendor"

[vendor]
protocol = "tentec"
dialect = "argonaut"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 400
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 10000000
mode = "am"

[[modes]]
mode = "am"
code = "0"

[[modes]]
mode = "usb"
code = "1"

[[modes]]
mode = "lsb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 16005 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16005 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/tentec2.c, rx350.c rigs/tentec/tentec2.c (frame formats shared with the Argonaut V)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 16005 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/tentec/tentec2.c, rx350.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/tentec/tentec2.c, rx350.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
