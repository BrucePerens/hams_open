# Rig description: Icom IC-9700 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED: no radio has been connected. Icom's published CI-V guide was NOT used (its
# download terms forbid reuse of its data); the facts come from Hamlib 4.6.2 source, read for facts only,
# with the file and function named in each fact below. Gaps are listed in crates/radioctl-protocols/src/civ.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "send-cw", "transceive", "split", "rit-xit", "filter", "levels", "identify"]

[rig]
id = "icom-ic-9700"
name = "Icom IC-9700"
family = "icom-civ"

[civ]
address = 0xA2
controller = 0xE0
model_id = 0xA2
echo = false

[scope]
receivers = 2
line_length = 475
samples_per_frame = 50
amplitude_max = 160
spans_hz = [5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000]

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 144174000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "cw"
code = 0x03

[[modes]]
mode = "rtty"
code = 0x04

[[modes]]
mode = "fm"
code = 0x05

[[modes]]
mode = "cw-r"
code = 0x07

[[modes]]
mode = "rtty-r"
code = 0x08

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 3081 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "civ.address"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7300.c (the IC-9700 rig_caps block, `default address` field)", note = "Icom's own CI-V reference guide was not used: icomjapan.com's download terms forbid reuse of the manuals' data, and radioctl skips such sources. Facts only were read from Hamlib; no code or table was copied." }
verified = { state = "unverified" }

[[facts]]
key = "civ.controller"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/src/civ_bridge.rs: DEFAULT_CONTROLLER_ADDRESS 0xE0", note = "The conventional controller address; not confirmed by a manual." }
verified = { state = "unverified" }

[[facts]]
key = "civ.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/ic7300.c (the IC-9700 rig_caps block, `default address` field)", note = "Set equal to the CI-V address, as on the IC-7300 in our simulator. No source read states the 19 00 reply value for this model, so this is an assumption." }
verified = { state = "unverified" }

[[facts]]
key = "civ.echo"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: the simulator does not echo", note = "A design choice for the virtual rig; USB CI-V does not echo, a single-wire interface does (not measured here)." }
verified = { state = "unverified" }

[[facts]]
key = "scope.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/rigs/icom/ic7300.c, spectrum_scope_caps (spectrum_line_length, single_frame_data_length, data_level_max), spectrum_scopes (receiver count), spectrum_spans", note = "Icom's own CI-V reference guide was not used: icomjapan.com's download terms forbid reuse of the manuals' data, and radioctl skips such sources. Facts only were read from Hamlib; no code or table was copied. Hamlib marks the signal-strength range of this family as 'to be confirmed' and shares one span list between models, so the span list is unverified per model." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 3081 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 1000ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "The starting frequency (144,174,000 Hz, an in-band choice of our own) and mode are only the starting state of a virtual rig; they say nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/icom_defs.h (C_CTL_SPLT 0F, C_CTL_LVL 14, C_CTL_RIT 21, C_SEND_SEL_FREQ 25, C_RD_TRXID 19) and rigs/icom/icom.c (icom_get_rit_new, icom_set_it_new, icom_get_dsp_flt, icom_set_dsp_flt)", note = "Icom's own CI-V reference guide was not used: icomjapan.com's download terms forbid reuse of the manuals' data, and radioctl skips such sources. Facts only were read from Hamlib; no code or table was copied. Capabilities are those the engine implements, taken as present on this model because Hamlib's capability lists for it include them." }
verified = { state = "unverified" }

[[facts]]
key = "capability.transceive"
provenance = { kind = "program-output", reference = "rigctl -m 3081 --dump-caps (Hamlib 4.6.2): Has async data support: Y", note = "Hamlib's claim; our engine cannot switch it on over CAT, it is set in the radio's menu." }
verified = { state = "unverified" }

