# Rig description: Guohe PMR-171 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/yaesu/pmr171.c, read for facts only, and `rigctl -m 1052 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 4800..38400 baud, 8N2, handshake NONE; receive 100000 to 470000000 Hz in 4 range(s). The description format has no field for frequency ranges, so they are not repeated here; the serial line settings are in [vendor].
# Dialect pmr171 (guohe.rs): framed binary (A5 A5 A5 A5, length, command, data, CRC-16/CCITT-FALSE). Hamlib answers frequency, mode and PTT reads from one status frame (command 0B) and keeps the two VFOs' values in its cache. The mode codes are the ASCII digits 0 to 7 standing for the radio's bytes (0 USB, 1 LSB, 2 CW-R, 3 CW, 4 AM, 5 FM, 7 data); Hamlib's narrow FM (6) and RTTY (8, "not functioning") are not described. PTT ON is the data byte 0.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "guohe-pmr-171"
name = "Guohe PMR-171"
family = "serial-vendor"

[vendor]
protocol = "guohe"
dialect = "pmr171"
data_bits = 8
parity = "N"
stop_bits = 2
flow = "none"

[timing]
timeout_ms = 200
retries = 2
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "usb"
code = "0"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "cw-r"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "am"
code = "4"

[[modes]]
mode = "fm"
code = "5"

[[modes]]
mode = "data"
code = "7"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 1052 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 1052 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/pmr171.c rigs/yaesu/pmr171.c (frame format and commands)", note = "Command frames read for facts only; no code copied. The dialect names are ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 1052 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/yaesu/pmr171.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/pmr171.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }
