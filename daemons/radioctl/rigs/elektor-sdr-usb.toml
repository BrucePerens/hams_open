# Rig description: Elektor SDR-USB (Elektor 5/07) (usb-device, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/kit/elektor507.c, read for facts only) and `rigctl -m 25007 --dump-caps`; no vendor document was read and no code was copied.
# Hamlib lists: receive 30 kHz to 30 MHz. An FTDI FT232R used as a bit-banged port that clocks an Si570-style synthesizer; the frequency is computed on the host from the oscillator (default 10 MHz) and the divider limits. Hamlib also selects antennas and levels.
# The engine (crates/radioctl-protocols/src/elektor507.rs) programs the Cypress PLL through the FTDI chip in bit-bang mode (I2C samples over bulk writes) and has a virtual twin. The board cannot be read back, so there is no read-frequency; the daemon's cache holds the last value set. The 10 MHz oscillator is fixed (Hamlib has a setting); antenna selection has no radioctl operation.
schema = 1
capabilities = ["set-frequency", "levels"]

[rig]
id = "elektor-sdr-usb"
name = "Elektor SDR-USB (Elektor 5/07)"
family = "usb-device"

[usb]
protocol = "elektor507"
vendor_id = 0x0403
product_id = 0x6001
manufacturer = ""
product = ""
multiplier = 0

[levels]
attenuator_db = [10, 20]
attenuator_any_up_to_db = 0
preamp_steps = 0

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 25007 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25007 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "usb.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kit/elektor507.c (USB ids, manufacturer and product strings, multiplier)", note = "Read for facts only; no code copied. An FTDI FT232R used as a bit-banged port that clocks an Si570-style synthesizer; the frequency is computed on the host from the oscillator (default 10 MHz) and the divider limits. Hamlib also selects antennas and levels." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 25007 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/kit/elektor507.c", note = "set-frequency is elektor507_set_freq; levels is the attenuator of elektor507_set_level (0, 10 or 20 dB). Hamlib answers get_freq and get_level from its own state, not from the board, so no read capability is claimed." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 rigs/kit/elektor507.c: the attenuator list in elektor507_caps and the pin coding in elektor507_set_level", note = "Read for facts only. Attenuator 0, 10 or 20 dB on two FT232R pins." }
verified = { state = "unverified" }
