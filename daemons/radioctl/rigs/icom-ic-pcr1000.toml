provenance = { kind = "program-output", reference = "`rigctl -m 4001 --dump-caps` (Hamlib 4.6.2): Serial speed, data bits, parity, stop bits, handshake lines", note = "Hamlib gives a speed range (9600 to 38400); the default recorded here is 9600 (Hamlib's startup speed for the PCR100 and PCR1000; the speed can then be changed with G1xx). Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 4001 --dump-caps` (Hamlib 4.6.2): Write delay, Post Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: a starting frequency and mode for a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/pcr/pcr.c rig_caps entries in rigs/pcr/pcr1000.c; `rigctl -m 4001 --dump-caps` (Hamlib 4.6.2) Can get/set lines", note = "Receiver: no PTT, CW, power or SWR capability is claimed (Hamlib lists no transmit range). The radio cannot report its frequency or mode, so read-frequency and read-mode return what radioctl last set (Hamlib's behaviour), checked by a power-status query; signal strength is read with I1?. Squelch, volume, filters, noise blanker, AGC, the PCR2500's second receiver and the power-on and auto-update-off sequence (H101, G300) are not implemented. Absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/pcr/pcr.c MD_LSB '0', MD_USB '1', MD_AM '2', MD_CW '3', MD_FM '5', MD_WFM '6' and pcr_set_mode / pcr_get_mode", note = "D-STAR ('7') and P25 ('8') on the PCR2500 have no radioctl mode and are not mapped." }
verified = { state = "unverified" }
