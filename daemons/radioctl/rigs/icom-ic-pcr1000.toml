# Rig description: Icom IC-PCR1000 (icom-pcr protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (read for facts only: rigs/pcr/pcr.c, rigs/pcr/pcr1000.c) and `rigctl -m 4001 --dump-caps` output;
# no vendor manual was read. The engine and its gaps: crates/radioctl-protocols/src/icom_pcr.rs.
# Hamlib lists: serial 9600..38400 baud, 8N1, handshake CTS/RTS; receive 10 kHz to 1300 MHz (4 range(s)); no transmit range (receiver). The description format has no field
# for frequency ranges, filters or function lists, so they are not repeated beyond this note.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-signal"]

[rig]
id = "icom-ic-pcr1000"
name = "Icom IC-PCR1000"
family = "receiver"

[receiver]
protocol = "icom-pcr"
dialect = "pcr1000"
baud = 9600
data_bits = 8
parity = "N"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 400
retries = 3
inter_command_ms = 12

[defaults]
frequency_hz = 145500000
mode = "fm"

[[modes]]
mode = "lsb"
code = 48

[[modes]]
mode = "usb"
code = 49

[[modes]]
mode = "am"
code = 50

[[modes]]
mode = "cw"
code = 51

[[modes]]
mode = "fm"
code = 53

[[modes]]
mode = "wfm"
code = 54

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in `rigctl -m 4001 --dump-caps` (Hamlib 4.6.2)", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.protocol"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/pcr/pcr.c (pcr_send, pcr_transaction, pcr_parse_answer: commands ended by a line feed, answers G000/G001, H101/H100, I1xx)", note = "Which of the dialect families of Hamlib's backend the model belongs to. Facts only, no code copied." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.dialect"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/pcr/pcr.c (pcr_set_freq: K0 command layout; pcr_get_freq and pcr_get_mode return the last values set) and rigs/pcr/pcr1000.c (reply_size, reply_offset)", note = "Facts only, no code copied." }
verified = { state = "unverified" }

[[facts]]
