provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/jrc/jrc.c MD_RTTY..MD_FM ('0' RTTY, '1' CW, '2' USB, '3' LSB, '4' AM, '5' FM) and jrc2rig_mode / rig2jrc_mode", note = "AMS/FAX ('6'), ECSS ('7','8') and WFM ('9') have no radioctl mode and are not mapped." }
