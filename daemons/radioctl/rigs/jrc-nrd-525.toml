# Rig description: JRC NRD-525 (jrc protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (read for facts only: rigs/jrc/nrd525.c) and `rigctl -m 6005 --dump-caps` output;
# no vendor manual was read. The engine and its gaps: crates/radioctl-protocols/src/jrc.rs.
# Hamlib lists: serial 300..4800 baud, 8N1, handshake NONE; receive 10 kHz to 30 MHz (2 range(s)); no transmit range (receiver). The description format has no field
# for frequency ranges, filters or function lists, so they are not repeated beyond this note.
schema = 1
capabilities = ["set-frequency", "set-mode"]

[rig]
id = "jrc-nrd-525"
name = "JRC NRD-525"
family = "receiver"

[receiver]
protocol = "jrc"
dialect = "nrd525"
baud = 4800
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 1000
retries = 0
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[modes]]
mode = "rtty"
code = 48

[[modes]]
mode = "cw"
code = 49

[[modes]]
mode = "usb"
code = 50

[[modes]]
mode = "lsb"
code = 51

[[modes]]
mode = "am"
code = 52

[[modes]]
mode = "fm"
code = 53

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in `rigctl -m 6005 --dump-caps` (Hamlib 4.6.2)", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.protocol"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/jrc/jrc.c (jrc_transaction, jrc_set_freq, jrc_get_freq, jrc_set_mode, jrc_get_mode, get_current_istate), rigs/jrc/jst145.c, rigs/jrc/nrd525.c: ASCII commands F, D, I, M, X ended by CR", note = "Which of the dialect families of Hamlib's backend the model belongs to. Facts only, no code copied." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.dialect"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/jrc/nrd525.c (nrd525_set_freq: F and eight digits in 10 Hz units, written with no terminator; nrd525_set_mode: D and a mode digit, no terminator; no get functions)", note = "Facts only, no code copied." }
verified = { state = "unverified" }

