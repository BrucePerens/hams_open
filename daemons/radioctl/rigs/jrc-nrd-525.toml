[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/jrc/nrd525.c rig_caps (only set_freq, set_mode, set_func, set_level, set_mem, vfo_op); `rigctl -m 6005 --dump-caps` (Hamlib 4.6.2) Can get/set lines", note = "Write only: Hamlib's NRD-525 backend has set_freq and set_mode and no getters, so only set-frequency and set-mode are claimed. A receiver; no transmit capability. Commands are written without a CR exactly as Hamlib writes them; whether the radio needs one is an open question for a volunteer." }
