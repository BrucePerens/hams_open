# Rig description: Rohde&Schwarz EB200 (rohde-schwarz protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (read for facts only: rigs/rs/rs.c, rigs/rs/eb200.c) and `rigctl -m 27002 --dump-caps` output;
# no vendor manual was read. The engine and its gaps: crates/radioctl-protocols/src/rs.rs.
# Hamlib lists: serial 300..115200 baud, 7E1, handshake CTS/RTS; receive 10 kHz to 3000 MHz (2 range(s)); no transmit range (receiver). The description format has no field
# for frequency ranges, filters or function lists, so they are not repeated beyond this note.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode", "read-signal"]

[rig]
id = "rs-eb200"
name = "Rohde&Schwarz EB200"
family = "receiver"

[receiver]
protocol = "rohde-schwarz"
dialect = "rs"
baud = 9600
data_bits = 7
parity = "E"
stop_bits = 1
flow = "rtscts"

[timing]
timeout_ms = 200
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 98100000
mode = "fm"

[[modes]]
mode = "am"
code = 1

[[modes]]
mode = "fm"
code = 2

[[modes]]
mode = "cw"
code = 3

[[modes]]
mode = "usb"
code = 4

[[modes]]
mode = "lsb"
code = 5

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in `rigctl -m 27002 --dump-caps` (Hamlib 4.6.2)", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.protocol"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/rs/rs.c (rs_transaction: CR, command, CR; rs_set_freq FREQ, rs_set_mode DEM, rs_get_level SENS:DATA?)", note = "Which of the dialect families of Hamlib's backend the model belongs to. Facts only, no code copied." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.dialect"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/rs/eb200.c (its rig_caps use rs_set_freq, rs_get_freq, rs_set_mode, rs_get_mode and rs_get_level unchanged)", note = "Facts only, no code copied." }
verified = { state = "unverified" }

[[facts]]
key = "receiver.line"
provenance = { kind = "program-output", reference = "`rigctl -m 27002 --dump-caps` (Hamlib 4.6.2): Serial speed, data bits, parity, stop bits, handshake lines", note = "Hamlib gives a speed range (300 to 115200); the default recorded here is 9600 (a common default inside Hamlib's 300 to 115200 range; Hamlib gives only the range). Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 27002 --dump-caps` (Hamlib 4.6.2): Write delay, Post Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: a starting frequency and mode for a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/rs/rs.c and the rig_caps in rigs/rs/eb200.c; `rigctl -m 27002 --dump-caps` (Hamlib 4.6.2) Can get/set lines", note = "Receiver: no PTT, CW, power or SWR capability is claimed (Hamlib lists no transmit range and the engine has no transmit path). Frequency (FREQ), mode (DEM) and level (SENS:DATA? \\\"VOLT:AC\\\" in dBuV) are what the engine implements; bandwidth, attenuator, volume and squelch are not. Absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/rs/rs.c rs_set_mode (DEM AM, FM, CW, USB, LSB) and rs_get_mode (rig_parse_mode of the DEM? answer)", note = "The codes 1 AM, 2 FM, 3 CW, 4 USB, 5 LSB are radioctl's own numbering (the wire spells the demodulation as a name). Wide FM and the rest of the radio's demodulations are not mapped." }
