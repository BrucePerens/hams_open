# Conformance transcript for rigs/kenwood-ts-590sg.toml (all steps are ASCII on the wire).
# ORIGIN: written by hand from the command formats in Kenwood 'TS-590S TS-590SG PC CONTROL COMMAND Reference Guide' B5A-0316-00 (October 23 2014), file ts_590_g_pc_command_e.pdf, sha256 b99787985aa4f0dd758a6301a829519a3e46f9f5354ca4199773b0557b4ad999 (see the description's provenance).
# This is NOT a recording of a radio. It proves the manual's formats, the engine, the virtual rig and the
# description agree with each other, not that they agree with a TS-590SG. The virtual rig's starting
# levels are our own values.
schema = 1
rig = "kenwood-ts-590sg"
origin = "hand-written from Kenwood's published PC command reference; not a capture of a radio"

[[step]]
op = { kind = "get-model-id" }
tx_text = "ID;"
rx_text = "ID023;"
expect = { kind = "model-id", value = 23 }

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx_text = "FA;"
rx_text = "FA00014074000;"
expect = { kind = "frequency", vfo = "a", hz = 14074000 }

[[step]]
op = { kind = "set-frequency", vfo = "a", hz = 7030000 }
tx_text = "FA00007030000;"

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx_text = "FA;"
rx_text = "FA00007030000;"
expect = { kind = "frequency", vfo = "a", hz = 7030000 }

[[step]]
op = { kind = "set-frequency", vfo = "b", hz = 7035000 }
tx_text = "FB00007035000;"

[[step]]
op = { kind = "get-frequency", vfo = "b" }
tx_text = "FB;"
rx_text = "FB00007035000;"
expect = { kind = "frequency", vfo = "b", hz = 7035000 }

[[step]]
op = { kind = "get-mode" }
tx_text = "MD;"
rx_text = "MD2;"
expect = { kind = "mode", mode = "usb" }

[[step]]
op = { kind = "set-mode", mode = "cw" }
tx_text = "MD3;"

[[step]]
op = { kind = "get-mode" }
tx_text = "MD;"
rx_text = "MD3;"
expect = { kind = "mode", mode = "cw" }

[[step]]
op = { kind = "get-ptt" }
tx_text = "IF;"
rx_text = "IF00007030000     +000000000030000000;"
expect = { kind = "frequency", vfo = "a", hz = 7030000 }
expect_more = [{ kind = "rx-vfo", vfo = "a" }, { kind = "tx-vfo", vfo = "a" }, { kind = "mode", mode = "cw" }, { kind = "ptt", on = false }, { kind = "rit", on = false }, { kind = "xit", on = false }, { kind = "rit-offset", hz = 0 }, { kind = "split", on = false }]

[[step]]
op = { kind = "set-split", on = true }
tx_text = "FR0;FT1;"

[[step]]
op = { kind = "set-rit", on = true }
tx_text = "RT1;"

[[step]]
op = { kind = "set-rit-offset", hz = 150 }
tx_text = "RC;RU00150;"

[[step]]
op = { kind = "get-rit-offset" }
tx_text = "IF;"
rx_text = "IF00007030000     +015010000030010000;"
expect = { kind = "frequency", vfo = "a", hz = 7030000 }
expect_more = [{ kind = "rx-vfo", vfo = "a" }, { kind = "tx-vfo", vfo = "b" }, { kind = "mode", mode = "cw" }, { kind = "ptt", on = false }, { kind = "rit", on = true }, { kind = "xit", on = false }, { kind = "rit-offset", hz = 150 }, { kind = "split", on = true }]

[[step]]
op = { kind = "set-level", level = "af-gain", value = 128 }
tx_text = "AG0128;"

[[step]]
op = { kind = "get-level", level = "af-gain" }
tx_text = "AG0;"
rx_text = "AG0128;"
expect = { kind = "level", level = "af-gain", value = 128 }

[[step]]
op = { kind = "get-level", level = "rf-gain" }
tx_text = "RG;"
rx_text = "RG250;"
expect = { kind = "level", level = "rf-gain", value = 250 }

[[step]]
op = { kind = "get-level", level = "mic-gain" }
tx_text = "MG;"
rx_text = "MG025;"
expect = { kind = "level", level = "mic-gain", value = 25 }

[[step]]
op = { kind = "set-level", level = "rf-power", value = 100 }
tx_text = "PC100;"

[[step]]
op = { kind = "get-level", level = "rf-power" }
tx_text = "PC;"
rx_text = "PC100;"
expect = { kind = "level", level = "rf-power", value = 100 }

[[step]]
op = { kind = "set-level", level = "keyer-speed", value = 25 }
tx_text = "KS025;"

[[step]]
op = { kind = "get-level", level = "keyer-speed" }
tx_text = "KS;"
rx_text = "KS025;"
expect = { kind = "level", level = "keyer-speed", value = 25 }

[[step]]
op = { kind = "get-signal" }
tx_text = "SM0;"
rx_text = "SM00030;"
expect = { kind = "signal", value = 30 }

[[step]]
op = { kind = "set-transceive", on = true }
tx_text = "AI2;"

[[step]]
panel = { kind = "frequency", hz = 21074000 }
rx_text = "FA00021074000;"
expect = { kind = "frequency", vfo = "a", hz = 21074000 }

[[step]]
panel = { kind = "mode", mode = "lsb" }
rx_text = "MD1;"
expect = { kind = "mode", mode = "lsb" }

# Receive attenuator and preamplifier (RA, PA; the guide's p. 23 and p. 21).

[[step]]
op = { kind = "set-level", level = "attenuator", value = 12 }
tx_text = "RA01;"

[[step]]
op = { kind = "get-level", level = "attenuator" }
tx_text = "RA;"
rx_text = "RA0100;"
expect = { kind = "level", level = "attenuator", value = 12 }

[[step]]
op = { kind = "set-level", level = "attenuator", value = 0 }
tx_text = "RA00;"

[[step]]
op = { kind = "set-level", level = "preamp", value = 1 }
tx_text = "PA1;"

[[step]]
op = { kind = "get-level", level = "preamp" }
tx_text = "PA;"
rx_text = "PA10;"
expect = { kind = "level", level = "preamp", value = 1 }
