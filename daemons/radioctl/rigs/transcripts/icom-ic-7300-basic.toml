rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "set-ptt", on = true }
tx = "fe fe 94 e0 1c 00 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
