tx = "fe fe 94 e0 15 11 fd"
rx = "fe fe e0 94 15 11 01 28 fd"
expect = { kind = "power", value = 128 }

# Raw meters (command 15, sub 12 to 16), read while keyed: the values are the virtual rig's own.
[[step]]
op = { kind = "get-meter", meter = "swr" }
tx = "fe fe 94 e0 15 12 fd"
rx = "fe fe e0 94 15 12 00 12 fd"
expect = { kind = "meter", meter = "swr", value = 12 }

[[step]]
op = { kind = "get-meter", meter = "alc" }
tx = "fe fe 94 e0 15 13 fd"
rx = "fe fe e0 94 15 13 00 80 fd"
expect = { kind = "meter", meter = "alc", value = 80 }

[[step]]
op = { kind = "get-meter", meter = "id" }
tx = "fe fe 94 e0 15 16 fd"
rx = "fe fe e0 94 15 16 00 90 fd"
expect = { kind = "meter", meter = "id", value = 90 }

[[step]]
op = { kind = "set-ptt", on = false }
tx = "fe fe 94 e0 1c 00 00 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-signal" }
tx = "fe fe 94 e0 15 02 fd"
rx = "fe fe e0 94 15 02 00 30 fd"
expect = { kind = "signal", value = 30 }

# Unkeyed: the transmitter meters read 0, the supply voltage still reads.
[[step]]
op = { kind = "get-meter", meter = "swr" }
tx = "fe fe 94 e0 15 12 fd"
rx = "fe fe e0 94 15 12 00 00 fd"
expect = { kind = "meter", meter = "swr", value = 0 }

[[step]]
op = { kind = "get-meter", meter = "vd" }
tx = "fe fe 94 e0 15 15 fd"
rx = "fe fe e0 94 15 15 01 30 fd"
expect = { kind = "meter", meter = "vd", value = 130 }

[[step]]
op = { kind = "send-cw", text = "CQ" }
tx = "fe fe 94 e0 17 43 51 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
panel = { kind = "frequency", hz = 21074000 }
rx = "fe fe 00 94 00 00 40 07 21 00 fd"
expect = { kind = "frequency", vfo = "a", hz = 21074000 }

[[step]]
panel = { kind = "mode", mode = "lsb" }
rx = "fe fe 00 94 01 00 01 fd"
expect = { kind = "mode", mode = "lsb" }

# Receive attenuator (20 dB; command 11, one BCD byte) and preamplifier (command 16 02, P.AMP number).
[[step]]
op = { kind = "set-level", level = "attenuator", value = 20 }
tx = "fe fe 94 e0 11 20 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-level", level = "attenuator" }
tx = "fe fe 94 e0 11 fd"
rx = "fe fe e0 94 11 20 fd"
expect = { kind = "level", level = "attenuator", value = 20 }

[[step]]
op = { kind = "set-level", level = "preamp", value = 2 }
tx = "fe fe 94 e0 16 02 02 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-level", level = "preamp" }
tx = "fe fe 94 e0 16 02 fd"
rx = "fe fe e0 94 16 02 02 fd"
expect = { kind = "level", level = "preamp", value = 2 }
