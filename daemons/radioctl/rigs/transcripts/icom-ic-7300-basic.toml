# Conformance transcript for rigs/icom-ic-7300.toml.
# ORIGIN: written by hand from tools/rig_simulator.py and the relay's civ_bridge.rs, with the
# 14,074,000 Hz frame (00 40 07 14 00) taken from the capture quoted in rig_simulator.py. This is
# NOT a recording of a radio. It proves the engine, the virtual rig and the description agree with
# each other, not that they agree with an IC-7300.
schema = 1
rig = "icom-ic-7300"
origin = "hand-written from tools/rig_simulator.py and civ_bridge.rs; not a capture of a radio"

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx = "fe fe 94 e0 03 fd"
rx = "fe fe e0 94 03 00 40 07 14 00 fd"
expect = { kind = "frequency", vfo = "a", hz = 14074000 }

[[step]]
op = { kind = "set-frequency", vfo = "a", hz = 7030000 }
tx = "fe fe 94 e0 05 00 00 03 07 00 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx = "fe fe 94 e0 03 fd"
rx = "fe fe e0 94 03 00 00 03 07 00 fd"
expect = { kind = "frequency", vfo = "a", hz = 7030000 }

[[step]]
op = { kind = "get-mode" }
tx = "fe fe 94 e0 04 fd"
rx = "fe fe e0 94 04 01 01 fd"
expect = { kind = "mode", mode = "usb" }

[[step]]
op = { kind = "set-mode", mode = "cw" }
