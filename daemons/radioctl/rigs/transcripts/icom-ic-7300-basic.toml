# Conformance transcript for rigs/icom-ic-7300.toml.
# ORIGIN: hand-written from the command layouts read in Hamlib 4.6.2 (facts only; see the description's
# provenance) and from the basic frames in tools/rig_simulator.py. This is NOT a capture of a radio and NOT
# written from Icom's CI-V guide. It proves the engine, the virtual rig and the description agree with each
# other, not that they agree with a IC-7300.
schema = 1
rig = "icom-ic-7300"
origin = "hand-written from Hamlib 4.6.2 command layouts (facts only) and tools/rig_simulator.py; not a capture of a radio"

[[step]]
op = { kind = "get-model-id" }
tx = "fe fe 94 e0 19 00 fd"
rx = "fe fe e0 94 19 00 94 fd"
expect = { kind = "model-id", value = 148 }

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx = "fe fe 94 e0 03 fd"
rx = "fe fe e0 94 03 00 40 07 14 00 fd"
expect = { kind = "frequency", vfo = "a", hz = 14074000 }

[[step]]
op = { kind = "set-frequency", vfo = "a", hz = 7030000 }
tx = "fe fe 94 e0 05 00 00 03 07 00 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-frequency", vfo = "a" }
tx = "fe fe 94 e0 03 fd"
rx = "fe fe e0 94 03 00 00 03 07 00 fd"
expect = { kind = "frequency", vfo = "a", hz = 7030000 }

[[step]]
op = { kind = "get-frequency", vfo = "b" }
tx = "fe fe 94 e0 25 01 fd"
rx = "fe fe e0 94 25 01 00 40 07 14 00 fd"
expect = { kind = "frequency", vfo = "b", hz = 14074000 }

[[step]]
op = { kind = "set-frequency", vfo = "b", hz = 14025000 }
tx = "fe fe 94 e0 25 01 00 50 02 14 00 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-frequency", vfo = "b" }
tx = "fe fe 94 e0 25 01 fd"
rx = "fe fe e0 94 25 01 00 50 02 14 00 fd"
expect = { kind = "frequency", vfo = "b", hz = 14025000 }

[[step]]
op = { kind = "get-split" }
tx = "fe fe 94 e0 0f fd"
rx = "fe fe e0 94 0f 00 fd"
expect = { kind = "split", on = false }

[[step]]
op = { kind = "set-split", on = true }
tx = "fe fe 94 e0 0f 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-split" }
tx = "fe fe 94 e0 0f fd"
rx = "fe fe e0 94 0f 01 fd"
expect = { kind = "split", on = true }

# The mode goes through command 26 on this model (mode, DATA flag, filter number); see the "mode.data" fact.
[[step]]
op = { kind = "get-mode" }
tx = "fe fe 94 e0 26 00 fd"
rx = "fe fe e0 94 26 00 01 00 01 fd"
expect = { kind = "mode", mode = "usb" }

[[step]]
op = { kind = "set-mode", mode = "data" }
tx = "fe fe 94 e0 26 00 01 01 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-mode" }
tx = "fe fe 94 e0 26 00 fd"
rx = "fe fe e0 94 26 00 01 01 01 fd"
expect = { kind = "mode", mode = "data" }

[[step]]
op = { kind = "set-mode", mode = "cw" }
tx = "fe fe 94 e0 26 00 03 00 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-mode" }
tx = "fe fe 94 e0 26 00 fd"
rx = "fe fe e0 94 26 00 03 00 01 fd"
expect = { kind = "mode", mode = "cw" }

[[step]]
op = { kind = "get-filter-width" }
tx = "fe fe 94 e0 1a 03 fd"
rx = "fe fe e0 94 1a 03 09 fd"
expect = { kind = "filter-width", hz = 500 }

[[step]]
op = { kind = "set-filter-width", hz = 2400 }
tx = "fe fe 94 e0 1a 03 28 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-filter-width" }
tx = "fe fe 94 e0 1a 03 fd"
rx = "fe fe e0 94 1a 03 28 fd"
expect = { kind = "filter-width", hz = 2400 }

[[step]]
op = { kind = "get-rit" }
tx = "fe fe 94 e0 21 01 fd"
rx = "fe fe e0 94 21 01 00 fd"
expect = { kind = "rit", on = false }

[[step]]
op = { kind = "set-rit", on = true }
tx = "fe fe 94 e0 21 01 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-rit" }
tx = "fe fe 94 e0 21 01 fd"
rx = "fe fe e0 94 21 01 01 fd"
expect = { kind = "rit", on = true }

[[step]]
op = { kind = "get-xit" }
tx = "fe fe 94 e0 21 02 fd"
rx = "fe fe e0 94 21 02 00 fd"
expect = { kind = "xit", on = false }

[[step]]
op = { kind = "set-rit-offset", hz = 150 }
tx = "fe fe 94 e0 21 00 50 01 00 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-rit-offset" }
tx = "fe fe 94 e0 21 00 fd"
rx = "fe fe e0 94 21 00 50 01 00 fd"
expect = { kind = "rit-offset", hz = 150 }

[[step]]
op = { kind = "set-rit-offset", hz = -1200 }
tx = "fe fe 94 e0 21 00 00 12 01 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-rit-offset" }
tx = "fe fe 94 e0 21 00 fd"
rx = "fe fe e0 94 21 00 00 12 01 fd"
expect = { kind = "rit-offset", hz = -1200 }

[[step]]
op = { kind = "get-level", level = "af-gain" }
tx = "fe fe 94 e0 14 01 fd"
rx = "fe fe e0 94 14 01 00 30 fd"
expect = { kind = "level", level = "af-gain", value = 30 }

[[step]]
op = { kind = "set-level", level = "af-gain", value = 128 }
tx = "fe fe 94 e0 14 01 01 28 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-level", level = "af-gain" }
tx = "fe fe 94 e0 14 01 fd"
rx = "fe fe e0 94 14 01 01 28 fd"
expect = { kind = "level", level = "af-gain", value = 128 }

[[step]]
op = { kind = "get-level", level = "rf-gain" }
tx = "fe fe 94 e0 14 02 fd"
rx = "fe fe e0 94 14 02 02 50 fd"
expect = { kind = "level", level = "rf-gain", value = 250 }

[[step]]
op = { kind = "set-level", level = "rf-power", value = 255 }
tx = "fe fe 94 e0 14 0a 02 55 fd"
rx = "fe fe e0 94 fb fd"
expect = { kind = "ack" }

[[step]]
op = { kind = "get-level", level = "mic-gain" }
tx = "fe fe 94 e0 14 0b fd"
rx = "fe fe e0 94 14 0b 00 25 fd"
expect = { kind = "level", level = "mic-gain", value = 25 }

[[step]]
