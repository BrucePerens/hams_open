# Rig description: Kenwood TS-480 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Kenwood publishes no PC command reference for this model that could be downloaded (kenwood.com refused the download of its
# guides in this session and hosts none for the older sets), so the facts come from Hamlib 4.6.2 (rigs/kenwood/ts480.c, kenwood.c, read for
# facts only, and `rigctl -m 2028 --dump-caps` output), named in each fact below. Kenwood's guides for other models were not used for this one.
# Hamlib lists: serial 4800..115200 baud, 8N1, no handshake; PC interface: see the radio's manual (older Kenwoods need the IF-232C/IC-10 level converter); receive 0.1 to 60 MHz in 2 ranges; transmit 1.8 to 52 MHz in 42 ranges; RIT range -9.990kHz/+9.990kHz; attenuator 12 dB; preamp 12 dB.
# Hamlib's get-level list for this model: PREAMP ATT VOXDELAY AF RF SQL NR CWPITCH RFPOWER MICGAIN KEYSPD COMP AGC VOXGAIN SLOPE_LOW SLOPE_HIGH BKIN_DLYMS SWR ALC STRENGTH RFPOWER_METER COMP_METER MONITOR_GAIN NB. The description format has no field for frequency ranges, filter tables or function lists,
# so they are not repeated here.
# Engine: the classic Kenwood engine (IF; answer of 38 characters, MD; mode letters, FA/FB 11 digits). Hamlib's backend assumes the same IF length for this model.
# Known gap: no levels are declared beyond the TS-480's (AG0nnn is taken from the comment in Hamlib's ts480.c): the AG/RG/PC/KS forms of this model are not documented by a source we may use here.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "split", "rit-xit", "levels", "identify"]

[rig]
id = "kenwood-ts-480"
name = "Kenwood TS-480"
family = "kenwood-ascii"

[kenwood]
model_id = 20

[levels]
attenuator_db = [12]
attenuator_any_up_to_db = 0
preamp_steps = 1

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

