# Rig description: Kenwood TS-480 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Nothing here is hardware-verified: no radio has been connected (docs/VOLUNTEER_TESTING.md). The command facts marked manual-checked were compared with Kenwood's TS-480HX/SAT PC control command reference (2003/11/28, sha256 in each fact); the rest is Hamlib 4.6.2 (rigs/kenwood/ts480.c, kenwood.c, `rigctl -m 2028 --dump-caps`, facts only).
# Hamlib lists: serial 4800..115200 baud, 8N1, no handshake (the guide says 4800 baud needs two stop bits and the RTS/CTS lines are used); receive 0.1 to 60 MHz in 2 ranges; transmit 1.8 to 52 MHz in 42 ranges; RIT range -9.990kHz/+9.990kHz; attenuator 12 dB; preamp 12 dB.
# The description format has no field for frequency ranges, filter tables or function lists, so they are not repeated here.
# Engine: the classic Kenwood engine (IF answer of 38 characters, MD mode digits, FA/FB 11 digits): all three agree with the guide.
# Pinned disagreement: the guide gives RG (RF gain) as 000 to 100 for the TS-480; the classic engine accepts 0 to 255 (the TS-590 and TS-2000 range), so a value of 101 to 255 would be sent to a radio that, per the guide, does not take it. PC is 005 to 100 on the SAT and 005 to 200 on the HX; the engine uses 5 to 100. Both are pinned in tests/ascii_families.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "split", "rit-xit", "levels", "identify"]

[rig]
id = "kenwood-ts-480"
name = "Kenwood TS-480"
family = "kenwood-ascii"

[kenwood]
model_id = 20

[levels]
attenuator_db = [12]
attenuator_any_up_to_db = 0
preamp_steps = 1

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

