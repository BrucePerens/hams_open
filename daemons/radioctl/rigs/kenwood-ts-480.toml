key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 2028 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-480HX/SAT TRANSCEIVER' (dated 2003/11/28, 26 pages, no document number), file ts480_pc_command.pdf, https://www.radioamatore.info/attachments/059_TS-480_pc_control_command.pdf (a public copy; Kenwood's own site refused automated downloads), sha256 371c55d4c3ce59be1c4ea19d4f367eac0e927f4064794b09c052eba247c8c972, read by us in this session: ID, PDF p. 11 (answer ID020, 020 is the TS-480)", note = "Hamlib 4.6.2 kenwood_ids table also has 20 for this model." }
verified = { state = "manual-checked", reference = "TS-480 PC control command reference, ID (p. 11)" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "rigctl -m 2028 --dump-caps (Hamlib 4.6.2): Write delay: 0ms, timeout 500ms, 3 retry", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "levels.attenuator_db"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball hamlib-4.6.2.tar.gz, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/kenwood/ts480.c, rig_caps `.attenuator` of the TS-480 (12)", note = "Read for facts only; the 12 dB figure is Hamlib's." }
verified = { state = "unverified" }

[[facts]]
key = "levels.*"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-480HX/SAT TRANSCEIVER' (dated 2003/11/28, 26 pages, no document number), file ts480_pc_command.pdf, https://www.radioamatore.info/attachments/059_TS-480_pc_control_command.pdf (a public copy; Kenwood's own site refused automated downloads), sha256 371c55d4c3ce59be1c4ea19d4f367eac0e927f4064794b09c052eba247c8c972, read by us in this session: AG, PDF p. 4; MG p. 14; KS p. 12; PC p. 16; RA p. 17; PA p. 16", note = "One preamp step; the attenuator is on or off in the guide (its 12 dB is Hamlib's figure, see levels.attenuator_db)." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: --freq 14074000, --mode USB", note = "Only the starting state of a virtual rig; the frequency is moved inside this model's receive range where needed." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-480HX/SAT TRANSCEIVER' (dated 2003/11/28, 26 pages, no document number), file ts480_pc_command.pdf, https://www.radioamatore.info/attachments/059_TS-480_pc_control_command.pdf (a public copy; Kenwood's own site refused automated downloads), sha256 371c55d4c3ce59be1c4ea19d4f367eac0e927f4064794b09c052eba247c8c972, read by us in this session: FA and FB, PDF p. 10 (11-digit hertz); FR p. 10 and FT p. 11 (0 VFO A, 1 VFO B, 2 memory); IF p. 12 (38 characters with the semicolon; P4 RIT, P5 XIT, P12 split); RT p. 19; XT p. 25; RC p. 18; RU and RD pp. 18-19 (5-digit hertz); TX p. 22; RX p. 19; ID p. 11; AI p. 4", note = "Every command the engine sends for the declared capabilities exists in the guide with the form the engine uses. Hamlib 4.6.2 ts480.c implements the same set." }
verified = { state = "manual-checked", reference = "TS-480 PC control command reference, FA FB FR FT IF RT XT RC RU RD TX RX ID AI (pp. 4-25)" }

[[facts]]
key = "capability.set-ptt"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-480HX/SAT TRANSCEIVER' (dated 2003/11/28, 26 pages, no document number), file ts480_pc_command.pdf, https://www.radioamatore.info/attachments/059_TS-480_pc_control_command.pdf (a public copy; Kenwood's own site refused automated downloads), sha256 371c55d4c3ce59be1c4ea19d4f367eac0e927f4064794b09c052eba247c8c972, read by us in this session: TX, PDF p. 22 (P1 0 normal transmission through the microphone input; the guide says P1 is 0 if omitted) and RX, p. 19", note = "Transmit-capable; the rig actor's transmit gate applies and stays closed by default. Whether the radio keys is hardware-unverified." }
verified = { state = "manual-checked", reference = "TS-480 PC control command reference, TX and RX (pp. 19, 22)" }

[[facts]]
key = "capability.levels"
provenance = { kind = "manual", reference = "Kenwood 'PC CONTROL COMMAND REFERENCE FOR THE TS-480HX/SAT TRANSCEIVER' (dated 2003/11/28, 26 pages, no document number), file ts480_pc_command.pdf, https://www.radioamatore.info/attachments/059_TS-480_pc_control_command.pdf (a public copy; Kenwood's own site refused automated downloads), sha256 371c55d4c3ce59be1c4ea19d4f367eac0e927f4064794b09c052eba247c8c972, read by us in this session: AG, PDF p. 4 (AG0nnn, 000 to 255); MG p. 14 (000 to 100); KS p. 12 (010 to 060 wpm); PC p. 16 (005 to 100 on the SAT, 005 to 200 on the HX); RA p. 17 (RA with two digits, 00 off 01 on); PA p. 16 (one digit)", note = "Agrees with the engine for AG, MG, KS and the SAT's PC. RG disagrees: the guide gives 000 to 100 (p. 18) and the engine takes 0 to 255. Pinned open question; the engine range is the TS-590/TS-2000 one." }
verified = { state = "unverified" }

