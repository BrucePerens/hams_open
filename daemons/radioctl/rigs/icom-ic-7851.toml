[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "rigctl -m 3075 --dump-caps (Hamlib 4.6.2): \"Can set/get PTT\", \"Can set Split VFO\", \"Can set RIT\", \"Can send Morse\", \"Targetable features\", \"Get level\" lines; rigs/icom/ic785x.c rig_caps", note = "Icom's manual for this model was read for facts under Bruce Perens' decision of 2026-10-31 (see the facts marked manual-checked); this fact was not compared with it and is still Hamlib's. Facts only were read from Hamlib; no code or table was copied. A capability is claimed when Hamlib's capability list for the model includes it and the engine implements the command (CI-V 03/04/05/06, 0F, 11, 14, 15, 16, 17, 19, 1A 03, 1C 00, 21, 25); absence in Hamlib is taken as absence on the radio, which may be too cautious. `identify` (command 19 00) is claimed on every file regardless of Hamlib's list; an older radio may answer NG, which the volunteer self-test reports. Settings and CI-V menu items (address, baud rate, transceive) are set at the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.second-vfo"
provenance = { kind = "manual", reference = "Icom IC-7850/IC-7851 Instruction Manual, document A-7199H-1EX-0a, CI-V command table, PDF page 260 (commands 25 and 26 data format; printed page numbers differ), https://archive.org/download/icom_IC-7850_InstructionManual/IC-7850_InstructionManual.pdf, sha256 9e38fc9e29edd8960042591a565e16a4726b0415e2279f6dfefe491bc4eb9114", note = "Command 25 reads and writes the frequency of the main band (00) or the sub band (01), the form the engine sends for VFO B, so VFO B is the sub band on this model; command 26 does the same for mode and filter. Hamlib 4.6.2's different split flow (07 C2/D0) also appears in the table (07 B0/B1/C2/D2) but is not what radioctl sends. Icom's download endpoint is excluded by robots.txt and the direct path is 403; the copy read is the archive.org mirror; read for facts under Bruce Perens' decision of 2026-10-31, nothing copied." }
verified = { state = "manual-checked", reference = "Icom IC-7850/IC-7851 Instruction Manual, PDF page 260, commands 25 and 26 data format" }

