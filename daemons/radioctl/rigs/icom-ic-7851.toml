[[facts]]
key = "mode.data"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/icom_defs.h C_SEND_SEL_MODE 0x26; rigs/icom/icom.c icom_set_mode_x26 and icom_get_mode_x26; rigs/icom/ic785x.c priv caps `x25x26_always = 1` and `targetable_vfo` RIG_TARGETABLE_MODE", note = "Facts only, no code copied. `data` is USB (01) with DATA set, `data-r` LSB (00) with DATA set; the engine reads the mode with 26 00 and sets it with 26 00 <code> <data> <filter> on this model, as Hamlib does. AM-D and FM-D are not in radioctl's mode vocabulary." }
