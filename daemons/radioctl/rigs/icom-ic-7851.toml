verified = { state = "unverified" }

[[facts]]
key = "capability.filter"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/icom/icom.c icom_get_dsp_flt and icom_set_dsp_flt (command 1A 03 with the 0 to 40 width index, `filtericom` table); rigs/icom/ic785x.c", note = "Icom's manual for this model was read for facts under Bruce Perens' decision of 2026-10-31 (see the facts marked manual-checked); this fact was not compared with it and is still Hamlib's. Facts only were read from Hamlib; no code or table was copied. Hamlib says the 1A 03 filter command \"should work on all DSP rigs\" and was tested on the IC-746PRO only; the index table is the engine's IC-7300 table, not confirmed for this model. A radio that does not understand it answers NG and the engine reports an error." }
verified = { state = "unverified" }

