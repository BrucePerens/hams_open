# Rig description: Icom IC-7850/IC-7851 over CI-V (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Icom's manual (where a copy could be read, see the facts marked manual-checked) was read for facts only, under Bruce Perens' decision of 2026-10-31; other facts come from Hamlib 4.6.2
# (rigs/icom/ic785x.c, read for facts only, and `rigctl -m 3075 --dump-caps` output), named in each fact below.
# Hamlib lists: serial 300..19200 baud, 8N1, ctrl=NONE; receive 0.03-60 MHz; transmit 1.81 to 54 MHz in 20 ranges. The description format has no field for
# frequency ranges, filter tables or function lists, so they are not repeated here; the CI-V address, baud rate and
# "CI-V Transceive" are set in the radio's own menu and must match what radioctl is told.
# Hamlib modes with no entry in radioctl's mode vocabulary, not listed: PKTLSB PKTUSB FM-D AM-D PSK PSKR.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt", "read-signal", "read-power", "send-cw", "transceive", "split", "rit-xit", "filter", "levels", "identify", "read-meters", "scope"]

[rig]
id = "icom-ic-7851"
name = "Icom IC-7850/IC-7851"
family = "icom-civ"

[civ]
address = 0x8E
controller = 0xE0
model_id = 0x8E
echo = false

[scope]
receivers = 2
line_length = 689
samples_per_frame = 50
amplitude_max = 200
spans_hz = [5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000]

[levels]
attenuator_db = [3, 6, 9, 12, 15, 18, 21]
attenuator_any_up_to_db = 0
preamp_steps = 2

[timing]
timeout_ms = 1000
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "am"
code = 0x02

[[modes]]
mode = "cw"
code = 0x03

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "rtty"
code = 0x04

[[modes]]
mode = "fm"
code = 0x05

[[modes]]
mode = "cw-r"
code = 0x07

[[modes]]
mode = "rtty-r"
code = 0x08

# Data modes are a sideband code plus the DATA flag of command 26 (USB-D, LSB-D); see the "mode.data" fact.
[[modes]]
mode = "data"
code = 0x01

[[modes]]
mode = "data-r"
code = 0x00

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py and docs of this repository; Hamlib 4.6.2 model name", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 3075 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "civ.address"
provenance = { kind = "manual", reference = "Icom IC-7850/IC-7851 Instruction Manual, document A-7199H-1EX-0a, PDF page 249 (data-format example showing the radio's default address in the preamble; printed page numbers differ), https://archive.org/download/icom_IC-7850_InstructionManual/IC-7850_InstructionManual.pdf, sha256 9e38fc9e29edd8960042591a565e16a4726b0415e2279f6dfefe491bc4eb9114", note = "The manual's default CI-V address is 0x8E, equal to this file's. Cross-check: Hamlib 4.6.2 rigs/icom (default address). WHY: Icom's own download endpoint is excluded by robots.txt (icomjapan.com and icomamerica.com disallow /api/) and the direct file path answers 403, so the copy read is the public archive.org mirror. Read for facts under Bruce Perens' decision of 2026-10-31; nothing was copied or redistributed; the PDF is kept outside every git repository in ~/manuals/icom/ with its sha256 in SHA256SUMS." }
verified = { state = "manual-checked", reference = "Icom IC-7850/IC-7851 Instruction Manual, document A-7199H-1EX-0a, PDF page 249 (data-format example showing the radio's default address in the preamble; printed page numbers differ), https://archive.o" }

