# Rig description: Yaesu FRG-100 (legacy five-byte CAT block protocol, schema 1). See crates/radioctl-core/src/rigfile.rs.
# Written from Yaesu's FRG-100 Operating Manual, CAT chapter (PDF pages 37 to 42) and Hamlib 4.6.2 frg100.c. A receiver: no PTT.
# The manual contradicts itself on the total update length (292 and 283 bytes) and on the ID bytes; neither is used.
# No radio has been connected, so every `verified` is unverified. Engine and gaps: crates/radioctl-protocols/src/yaesu_legacy.rs.
schema = 1
capabilities = ["read-frequency", "set-frequency", "read-mode", "set-mode"]

[rig]
id = "yaesu-frg-100"
name = "Yaesu FRG-100"
family = "yaesu-legacy"

[yaesu_legacy]
stop_bits = 2

[yaesu_legacy.set_frequency]
template = [0x00, 0x00, 0x00, 0x00, 0x0a]
at = 0
form = "bcd-10hz-lsb"

[yaesu_legacy.set_mode]
template = [0x00, 0x00, 0x00, 0x00, 0x0c]
at = 3

[[yaesu_legacy.reads]]
request = [0x00, 0x00, 0x00, 0x02, 0x10]
length = 19
frequency = { offset = 2, form = "bin-10hz-lsb3" }
mode = { offset = 7, mask = 0x07 }

[[yaesu_legacy.status_modes]]
mode = "lsb"
code = 0x00

[[yaesu_legacy.status_modes]]
mode = "usb"
code = 0x01

[[yaesu_legacy.status_modes]]
mode = "cw"
code = 0x02

[[yaesu_legacy.status_modes]]
mode = "am"
code = 0x03

[[yaesu_legacy.status_modes]]
mode = "fm"
code = 0x04

[timing]
timeout_ms = 2000
retries = 0
inter_command_ms = 50

[defaults]
frequency_hz = 14074000
mode = "usb"

[[modes]]
mode = "lsb"
code = 0x00

[[modes]]
mode = "usb"
code = 0x01

[[modes]]
mode = "cw"
code = 0x02

[[modes]]
mode = "am"
code = 0x04

[[modes]]
mode = "fm"
code = 0x06

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "this repository's radioctl design (family naming) and the model name in the manual or Hamlib", note = "Identity and family are our own labelling." }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.stop_bits"
provenance = { kind = "manual", reference = "Yaesu FRG-100 Operating Manual (file frg100_manual.pdf, sha256 87ab75ea1dfc467170729e79c96b189188a1ae0a35bd9e3d8f2a43513cbf3731): CAT chapter, PDF p.37 (printed 35): TTL levels, 4800 bit/s, 8 data, no parity, 2 stop" }
verified = { state = "unverified" }

[[facts]]
key = "yaesu_legacy.block"
provenance = { kind = "manual", reference = "Yaesu FRG-100 Operating Manual (file frg100_manual.pdf, sha256 87ab75ea1dfc467170729e79c96b189188a1ae0a35bd9e3d8f2a43513cbf3731): CAT chapter, PDF p.36-41 (printed 34-39): 0A set frequency (BCD, least significant byte first, 10 Hz); 0C mode (0 LSB, 1 USB, 2 or 3 CW wide, 4 AM wide, 5 AM narrow, 6 or 7 FM); 10 with parameter 2 returns the operating record: three binary frequency bytes, LEAST significant first, in 10 Hz units, and a mode byte (0 LSB, 1 USB, 2 CW, 3 AM, 4 FM)", note = "Offsets 2 (frequency) and 7 (mode) of the 19-byte record are Hamlib's (frg100.c); the manual's record figures disagree with its own text. Hamlib has mode codes the manual lacks (RTTY, H3E). Unverified." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "manual", reference = "Yaesu FRG-100 Operating Manual (file frg100_manual.pdf, sha256 87ab75ea1dfc467170729e79c96b189188a1ae0a35bd9e3d8f2a43513cbf3731): CAT chapter, PDF p.41 (printed 39): opcode chart: no PTT", note = "S-meter read (F7) not mapped." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "manual", reference = "Yaesu FRG-100 Operating Manual (file frg100_manual.pdf, sha256 87ab75ea1dfc467170729e79c96b189188a1ae0a35bd9e3d8f2a43513cbf3731): CAT chapter, PDF p.41 (printed 39): mode codes of opcode 0C", note = "The chart prints 3 for both CW wide and narrow (a misprint); 2 is used for CW. AM narrow, FM codes and the narrow variants are not mapped beyond one code per mode." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "repo-code", reference = "crates/radioctl-protocols/src/yaesu_legacy.rs: 50 ms between commands, 2 s reply timeout", note = "Our default, inside the manuals' limit of 200 ms between bytes of a block; not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py style defaults", note = "Only a virtual rig's starting state." }
verified = { state = "unverified" }
