# Rig description: Barrett 4100 (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/barrett/4100.c and barrett.c, read for facts only, and `rigctl -m 32004 --dump-caps`); no Barrett document was read and no code or table was copied. Hamlib lists the radio under the maker name "Rhode&Schwarz" (a mistake in its table; it is a Barrett) and as a network radio; its driver is Beta and untested.
# Hamlib lists: 9600..115200 baud, 8N1, handshake XON/XOFF, receive 10 kHz to 30 MHz (CW and SSB). The description format has no field for frequency ranges, so they are not repeated here. The description asks for no flow control for the same reason as the other Barrett files (the answers carry XOFF and XON bytes).
# Dialect barrett4100 (barrett4100.rs): LF, text, CR commands; `M:REMOTE SENTER2,1` first (sent again after a reconnect through the link-restored hook), `M:FF SRF<hz> GRF` and `M:FF STF<hz> GTF` set the frequency, `M:FF GRF` reads it, `M:FF SRPTT<0|1> GRPTT` keys. Hamlib never reads the PTT state, so there is no read-ptt, and it has no mode command.
schema = 1
capabilities = ["read-frequency", "set-frequency", "set-ptt"]

[rig]
id = "barrett-4100"
name = "Barrett 4100"
family = "serial-vendor"

[vendor]
protocol = "barrett"
dialect = "barrett4100"
data_bits = 8
parity = "N"
stop_bits = 1
flow = "none"

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 14200000
mode = "usb"

[[modes]]
mode = "usb"
code = 85

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; Hamlib's maker column says Rhode&Schwarz, which is its mistake." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 32004 --dump-caps` (Hamlib 4.6.2): timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "repo-code", reference = "placeholder so that the description loads: Hamlib's 4100 driver has no mode command", note = "Not a fact about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "vendor.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/barrett/4100.c (barrett4100_open, _set_freq, _get_freq, _set_ptt) and barrett.c (barrett_transaction2)", note = "Command frames read for facts only; no code copied. The dialect name is ours." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 32004 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/barrett/4100.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; Hamlib's get_ptt never sets the state." }
verified = { state = "unverified" }
