# Rig description: ELAD FDM-DUO (schema 1). See crates/radioctl-core/src/rigfile.rs for the format.
# Everything here is UNVERIFIED until a volunteer confirms it (docs/VOLUNTEER_TESTING.md): no radio has been connected.
# Facts come from Hamlib 4.6.2 (rigs/elad/elad.c, fdm_duo.c, read for facts only, and `rigctl -m 33001 --dump-caps`); no vendor protocol document was read and no code or table was copied.
# Hamlib lists: serial 9600..115200 baud, 8N1, handshake NONE; receive 100000 to 59999999 Hz in 2 range(s). The description format has no field for frequency ranges or serial settings, so they are not repeated here.
# Hamlib's ELAD backend is a copy of its Kenwood backend with its own mode table (the same digits as the classic Kenwood one: 1 LSB, 2 USB, 3 CW, 4 FM, 5 AM, 6 RTTY, 7 CW-R, 9 RTTY-R), so the classic Kenwood engine is used; the ELAD-specific commands are not covered.
schema = 1
capabilities = ["read-frequency", "set-frequency", "second-vfo", "read-mode", "set-mode", "read-ptt", "set-ptt"]

[rig]
id = "elad-fdm-duo"
name = "ELAD FDM-DUO"
family = "kenwood-ascii"

[kenwood]
model_id = 1

[timing]
timeout_ms = 500
retries = 3
inter_command_ms = 0

[defaults]
frequency_hz = 7074000
mode = "usb"

[[modes]]
mode = "lsb"
code = "1"

[[modes]]
mode = "usb"
code = "2"

[[modes]]
mode = "cw"
code = "3"

[[modes]]
mode = "fm"
code = "4"

[[modes]]
mode = "am"
code = "5"

[[modes]]
mode = "rtty"
code = "6"

[[modes]]
mode = "cw-r"
code = "7"

[[modes]]
mode = "rtty-r"
code = "9"

[[facts]]
key = "rig.*"
provenance = { kind = "repo-code", reference = "Hamlib 4.6.2 model name and maker in `rigctl -l`; radioctl's own id", note = "Identity and family are our own labelling; the model name is as in `rigctl -m 33001 --dump-caps`." }
verified = { state = "unverified" }

[[facts]]
key = "timing.*"
provenance = { kind = "program-output", reference = "`rigctl -m 33001 --dump-caps` (Hamlib 4.6.2): Write delay, timeout and retry lines", note = "Hamlib's settings, not a measurement of the radio." }
verified = { state = "unverified" }

[[facts]]
key = "defaults.*"
provenance = { kind = "repo-code", reference = "daemons/hams_local_relay/tools/rig_simulator.py: starting frequency and mode of a virtual rig", note = "Only the starting state of a virtual rig; says nothing about the radio." }
verified = { state = "unverified" }

[[facts]]
key = "capability.*"
provenance = { kind = "program-output", reference = "`rigctl -m 33001 --dump-caps` (Hamlib 4.6.2) \"Can set/get\" lines; rigs/elad/elad.c, fdm_duo.c", note = "A capability is claimed when Hamlib's backend implements it and the engine has the command; absence in Hamlib is taken as absence on the radio, which may be too cautious." }
verified = { state = "unverified" }

[[facts]]
key = "mode.*"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/elad/elad.c, fdm_duo.c (mode character definitions)", note = "Mode characters as the backend defines them; modes with no entry in radioctl's vocabulary are not listed." }
verified = { state = "unverified" }

[[facts]]
key = "kenwood.model_id"
provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/elad/elad.c, fdm_duo.c ", note = "Hamlib's elad_id_string_list answers \"001\" for the FDM-DUO; 1 is used. Not read from a radio; unverified." }
verified = { state = "unverified" }
