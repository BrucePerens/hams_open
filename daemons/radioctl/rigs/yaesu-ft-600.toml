provenance = { kind = "hamlib-source", reference = "Hamlib 4.6.2 (released source tarball, sha256 b2ac73f44dd1161e95fdee6c95276144757647bf92d7fdb369ee2fe41ed47ae8): rigs/yaesu/ft600.c: caps: get_ptt NULL, split commands exist but no split read", note = "Split is not offered: no read, and the command is unverified." }
verified = { state = "unverified" }

