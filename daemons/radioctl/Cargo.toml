[workspace]
resolver = "2"
members = ["crates/radioctl-core", "crates/radioctl-protocols", "crates/radioctld"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.98"

[workspace.dependencies]
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
