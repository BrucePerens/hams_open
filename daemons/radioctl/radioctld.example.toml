# radioctld example configuration. Validate with: radioctld --config radioctld.example.toml --check
# Every key shown is optional unless marked required; the values are the defaults.

[server]
# Who may connect, as networks or single addresses. Default: this machine only.
allow = ["127.0.0.0/8", "::1"]
# Serving beyond loopback needs this flag AND an explicit allow list above; otherwise any
# `listen` address that is not loopback is a configuration error.
allow_non_loopback_bind = false
max_clients = 16           # per rig
idle_timeout_secs = 600    # a silent connection is closed after this
line_timeout_secs = 10     # a request line that has begun must end within this
max_line_bytes = 1024      # longest request line
request_timeout_ms = 2000  # deadline for a request that has to go to the rig
cache_max_age_ms = 1000    # reads newer than this are answered from the rig's cache
# secrets_dir = "secrets"   # one file per secret, relative to this file; needed by framing = "ts890-lan"

# One [[rig]] per radio. Each rig has its own listen address, as with one rigctld per radio.
[[rig]]
name = "kx3"                                  # required; 1-32 of A-Z a-z 0-9 _ . -
description = "rigs/elecraft-kx3.toml"        # required; relative to this file
listen = "127.0.0.1:4532"                     # default: loopback, port 4532 + the rig's index
vfo_mode = false                              # rigctld's -o: \chk_vfo answers 1, headers echo the VFO
transmit = false                              # true opens the rig's transmit gate when the daemon starts
# rx_low_hz = 30000                           # the coverage reported in \dump_state
# rx_high_hz = 60000000
# tx_power_mw = 100000
# max_transmit_s = 180                        # the actor unkeys a rig that transmits longer (1 to 3600)
# hamlib_model = 1                            # the model number reported in \dump_state

[rig.transport]
kind = "virtual"                              # an in-memory rig generated from the description

# [rig.transport]
# kind = "serial"                             # a serial or USB-serial port
# path = "/dev/ttyUSB0"                       # or: usb = { vid = 0x0403, pid = 0x6001, serial = "A12345" }
# baud = 38400                                # a fixed rate; nothing probes unless you ask (below)
# # baud = "auto"                             # optional: find the rate with a read-only frequency read at
# #                                           # 4800, 9600, 19200, 38400, 57600, 115200 in turn, first answer wins;
# # baud_probe = [19200, 115200]              # or your own list in your own order (with baud absent or "auto")
# lines = "managed"                           # "unmanaged" for a pty or other port without DTR/RTS

# [rig.transport]
# kind = "tcp"                                # a network serial server or a radio's own CAT port;
# address = "192.168.1.50:4001"               # reconnects with backoff after a loss, one attempt at start
# framing = "raw"                             # or "ts890-lan": the Kenwood TS-890S LAN session, with
# lan_account = "kenwood"                     #   the radio's LAN account name,
# lan_administrator = false                   #   whether it is the administrator account, and
# lan_password_secret = "ts890-password"      #   the name of the file under server.secrets_dir holding
#                                             #   the password (mode 0600; never the password here)
# idle_timeout_ms = 12000                     # silence that counts as a lost link (default: none for raw)

# [rig.transport]
# kind = "usb"                                # a USB SDR board or dongle (Si570 kits, FiFi-SDR, FUNcube, ...):
#                                             # the description supplies the ids and strings; needs a radioctld
#                                             # built with --features usb (libusb-1.0); reopened after an unplug
# serial = "A12345"                           # only if two identical boards are attached
# vid = 0x16C0                                # optional overrides of the description's ids
# pid = 0x05DC
# transfer_timeout_ms = 1000                  # longest wait for one USB transfer (50 to 10000)

# One [[rotator]] per rotator, served in Hamlib's rotctld text protocol on its own listener
# (rotctl -m 2 -r 127.0.0.1:4533). Tested against the virtual rotator only; unverified on a real one.
# [[rotator]]
# name = "g5500"                              # required; 1-32 of A-Z a-z 0-9 _ . -
# model = "yaesu-g-5500-gs232b"               # required; an id from data/station/rotators.toml:
#                                             # generic-rotctld, yaesu-g-5500-gs232b, yaesu-g-450-gs232a
# listen = "127.0.0.1:4533"                   # default: loopback, port 4533 + the rotator's index
#                                             # (a second rig would take 4533 too: give one a listen of its own)
# [rotator.transport]
# kind = "virtual"                            # the model's virtual rotator, served inside the daemon
# # kind = "tcp"                              # a rotctld, or a serial server in front of a GS-232 controller
# # address = "192.168.1.60:4533"             # reconnects after a loss; one attempt at start
