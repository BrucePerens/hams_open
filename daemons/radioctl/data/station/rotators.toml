# Rotator descriptions for radioctl-station. Every fact is unverified until it is checked on the
# rotator (the `verified` field says so); the limits are the manufacturer's published travel,
# narrowed here to what the protocol can carry.

[[rotators]]
id = "generic-rotctld"
name = "Any rotator behind a Hamlib rotctld (TCP port 4533)"
protocol = "rotctld"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 90.0
has_elevation = true
slew_deg_per_s = 3.0
reply_timeout_ms = 2000
verified = false

[[rotators]]
id = "yaesu-g-5500-gs232b"
name = "Yaesu G-5500 az/el (GS-232B controller protocol)"
protocol = "gs232"
az_min = 0.0
az_max = 450.0
el_min = 0.0
el_max = 180.0
has_elevation = true
slew_deg_per_s = 2.0
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1500
verified = false

[[rotators]]
id = "yaesu-g-450-gs232a"
name = "Yaesu G-450 azimuth only (GS-232A controller protocol)"
protocol = "gs232"
az_min = 0.0
az_max = 450.0
el_min = 0.0
el_max = 0.0
has_elevation = false
slew_deg_per_s = 2.0
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1500
verified = false

# Easycomm controllers (written from the Easycomm specification, no controller on the bench).
# The travel is a generic az/el rotator's; set the real one with a copy of the entry.

[[rotators]]
id = "easycomm1-azel"
name = "Generic az/el controller, Easycomm I (set-only)"
protocol = "easycomm1"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 90.0
has_elevation = true
slew_deg_per_s = 3.0
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1000
verified = false

[[rotators]]
id = "easycomm2-azel"
name = "Generic az/el controller, Easycomm II"
protocol = "easycomm2"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 90.0
has_elevation = true
slew_deg_per_s = 3.0
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1500
verified = false

[[rotators]]
id = "easycomm3-satnogs"
name = "SatNOGS-style az/el controller, Easycomm III"
protocol = "easycomm3"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 180.0
has_elevation = true
slew_deg_per_s = 3.0
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1500
verified = false

# SPID Rot2Prog / MD-01/02 in ROT2 mode (SPID's protocol sheet, public; no controller on the bench).

[[rotators]]
id = "spid-rot2prog"
name = "SPID Rot2Prog / MD-01 / MD-02 az/el (ROT2 protocol)"
protocol = "rot2prog"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 180.0
has_elevation = true
slew_deg_per_s = 3.0
pulses_per_degree = 10
park = { az = 0.0, el = 0.0 }
reply_timeout_ms = 1500
verified = false

# Hy-Gain DCU controllers (Hy-Gain's DCU-3 manual; azimuth only, no position read; the stop command
# is Hamlib's, not in that manual).

[[rotators]]
id = "hygain-dcu3"
name = "Hy-Gain DCU-3 / HAM-IV / T2X azimuth (DCU protocol, 4800 8N1)"
protocol = "dcu"
az_min = 0.0
az_max = 360.0
el_min = 0.0
el_max = 0.0
has_elevation = false
slew_deg_per_s = 1.5
reply_timeout_ms = 1500
verified = false
