[package]
name = "radioctl-core"
description = "radioctl core: typed rig values, capability model, errors, rig actor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Convenience constructor that builds and owns a small tokio runtime. For radioctld and the C ABI
# only; never on by default, the library otherwise runs on a runtime the caller supplies.
owned-runtime = ["tokio/rt-multi-thread"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
futures-core = "0.3"
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util", "macros", "net"] }
# No libudev: USB serial ports are found by reading sysfs on Linux (see usb.rs), so a build needs
# no libudev development package and a release binary needs no libudev at run time.
serialport = { version = "4.10", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "macros", "test-util"] }
radioctl-protocols = { path = "../radioctl-protocols" }
futures = { version = "0.3", default-features = false, features = ["executor"] }
