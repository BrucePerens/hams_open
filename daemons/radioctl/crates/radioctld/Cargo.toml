[package]
name = "radioctld"
description = "radioctld: rigctld-protocol server on top of radioctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "radioctld"
path = "src/lib.rs"

[[bin]]
name = "radioctld"
path = "src/main.rs"

[features]
# Differential tests against Hamlib's own `rigctl` client (tests/rigctl_oracle.rs). Needs the
# `rigctl` binary (or RIGCTL=/path) and fails loudly without it; off by default so a machine
# without Hamlib can still run the rest. Run: cargo test -p radioctld --features hamlib-oracle
hamlib-oracle = []

[dependencies]
radioctl-core = { path = "../radioctl-core" }
radioctl-protocols = { path = "../radioctl-protocols" }
radioctl-splitter = { path = "../radioctl-splitter", default-features = false }
serde = { workspace = true }
toml = { workspace = true }
# The binary owns the one runtime (multi-thread); the library only takes a Handle.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "net", "macros", "signal"] }

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "net", "macros", "signal", "test-util"] }
