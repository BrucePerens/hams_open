[package]
name = "radioctl-station"
description = "radioctl station control: external switches, power sequencing, interlocks, powered-off radio records, Modbus coil relay and HTTP relay drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
radioctl-core = { path = "../radioctl-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util", "net", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "net", "macros", "test-util"] }
radioctl-protocols = { path = "../radioctl-protocols" }
serialport = { version = "4.10", default-features = false }
