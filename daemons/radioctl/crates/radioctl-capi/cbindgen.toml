language = "C"
include_guard = "RADIOCTL_H"
header = "/* SPDX-License-Identifier: AGPL-3.0-or-later */\n/* radioctl C ABI. Generated by cbindgen from src/ffi.rs; do not edit. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true

[export.rename]
"RctlRuntime" = "rctl_runtime"
"RctlRig" = "rctl_rig"

[parse]
parse_deps = false
