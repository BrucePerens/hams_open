# ADDED BY: bench_mcp, the bench-instrument MCP server of hams_open, on 2026-10-29 (the VNA
#           support in daemons/vnwa_open and the sound tools in daemons/bench_mcp).
#           Repository root: https://github.com/BrucePerens/hams_open
#           (bench_mcp is at daemons/bench_mcp, the VNA driver at daemons/vnwa_open).
#
# WHAT: hide the two PCM2900C USB sound codecs inside the DG8SAQ VNWA 3E vector network analyzer
#       (USB id 08bb:29c0) from PipeWire/WirePlumber.
#
# WHY:  those codecs are the VNWA's measurement receiver, not sound cards. The vendor-independent
#       VNA driver (hams_open: daemons/vnwa_open) opens them directly through ALSA to read the
#       analyzer's IF samples. If the desktop sound server manages them it can
#         - make one of them the default output or input, so system sounds, calls and speech
#           synthesis are played into the analyzer's codec (this happened once, on 2026-10-29);
#         - hold the card open or change its state while a sweep is running, which corrupts
#           measurements or makes the driver fail with "device busy".
#       The cards stay visible to ALSA (see /proc/asound/cards); only the sound server ignores them.
#
# SCOPE: system-wide, for every user's WirePlumber instance. Companion file for PulseAudio systems:
#        /etc/udev/rules.d/60-vnwa-codecs.rules. Both ship with hams_open
#        (daemons/vnwa_open/packaging/) and are installed by `vnwa_open install-system-config`.
#
# CAVEAT: 08bb:29c0 is the generic Texas Instruments PCM2900C id, used by many cheap USB sound
#         dongles, not only by the VNWA. This rule hides ANY such dongle from the sound server.
#         If you use one for ordinary audio, narrow the rule (see the hams_open documentation) or
#         use the card directly through ALSA.
#
# TO REMOVE: delete this file and run `systemctl --user restart wireplumber` (each user session).
#            Nothing else depends on it, but then protect the codecs in some other way.
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x08bb", device.product.id = "0x29c0" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
