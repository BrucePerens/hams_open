# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny policy (same licence policy as daemons/relay_broker/deny.toml): crates.io only,
# permissive or copyleft-compatible licences only. Run `cargo deny --locked check` here.
[graph]
targets = []

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "NCSA", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "AGPL-3.0-or-later", "LGPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "warn"  # the path dependency on ham_digital_modes has no version requirement
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
