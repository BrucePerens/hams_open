# Real, confirmed cross-compile linker failure (2026-09-14, armv7-unknown-linux-gnueabihf,
# Raspberry Pi 400/500 hardware qualification -- building on a faster Pi for a 32-bit-userland Pi
# target board): this crate is
# `crate-type = ["cdylib", "staticlib"]` (the drop-in libcodec2.so/.a), so unlike a plain rlib
# crate it actually invokes a linker to produce a shared object. Without this override, cargo
# used the host's native `cc` (aarch64) as the link driver for the armv7 target and failed with
# "file in wrong format" / "collect2: error: ld returned 1 exit status" -- the exact same class
# of bug hams_local_relay's own daemons/hams_local_relay/.cargo/config.toml already documents
# and fixes for its own armv7 cross-compile. `arm-linux-gnueabihf-gcc` (from the `gcc-arm-linux-
# gnueabihf` package) is a real, working linker driver for this target; cargo doesn't default to
# it without being told.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
