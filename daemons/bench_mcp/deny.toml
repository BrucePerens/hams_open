# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny policy for bench_mcp. Run `cargo deny check` here.
[graph]
targets = []

[advisories]
ignore = [
    # chrono 0.4.45 is unmaintained (RUSTSEC-2026-0543, no fixed release; a maintenance notice, not a vulnerability). It comes in
    # through rmcp 3.9.0 and its schemars; no rmcp release drops it. REVIEW BY 2027-02-15: remove this entry if rmcp no longer
    # depends on chrono.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib", "MPL-2.0", "AGPL-3.0-or-later"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
