[package]
name = "ham_digital_modes"
version = "0.1.0"
edition = "2021"
description = "Amateur radio digital mode encode/decode: PSK31, WSPR, FT8"
license = "LGPL-3.0-or-later"

[dependencies]
# For erf() in ft8.rs's GFSK transmit waveform synthesis (see
# docs/references/FT8_FT4_GFSK_WAVEFORM_SPEC.md) -- Rust's std never
# stabilized erf, and this needs to be accurate (it directly shapes a
# real transmitted signal's spectrum), not a hand-rolled approximation.
# libm is a pure-Rust, MIT/Apache-2.0 port of the actual C math library
# algorithms, not a crude approximation of its own.
libm = { version = "0.2", optional = true }
# wspr_decode.rs's sync search: FT8's own decode takes the vendored-C
# route (ft8.rs, vendor/ft8_lib, MIT-licensed) instead of a from-scratch
# DSP reimplementation, but no equivalent permissively-licensed C WSPR
# decoder exists to vendor the same way -- the real reference decoder
# (`wsprd`, part of WSJT-X) is GPL, and the MIT-licensed reference this
# session actually used (`weakmon`'s `wspr.py`) is pure Python, not a C
# library that could be FFI'd in. rustfft is MIT/Apache-2.0, so it's
# used directly for the STFT the sync search needs, rather than
# hand-rolling a DFT.
rustfft = { version = "6", optional = true }
# codec2_3200/codec2_1600's own FLOAT structs (Decoder/Encoder/
# SynthesisState/SpectralBridgeState -- distinct from the *Fixed
# variants, which already use fixed_fft.rs's own no_std-compatible
# integer FFT and never touched rustfft) used rustfft too, which
# pulled in `std` via num-traits and blocked a no_std build of this
# crate even though the fixed-point decode/encode path itself never
# needs it. microfft is a real, no_std, no-alloc FFT crate (MIT-
# licensed) supporting fixed power-of-2 sizes via Cargo features --
# this codebase only ever needs 512/1024 (FFT_ENC/FFT_ENC_SB). Its
# forward convention matches rustfft's plan_fft_forward exactly
# (verified directly, not assumed -- max diff ~6e-5 across a real
# 512-point comparison, pure float rounding noise); its inverse
# module is normalized (divides by N), unlike rustfft's own
# unnormalized plan_fft_inverse, so every inverse call site
# multiplies the result by N explicitly to preserve this codebase's
# existing unnormalized-IFFT convention (the same one fixed_fft.rs's
# own integer FFT already uses). wspr_sync.rs's own rustfft usage
# (f64, a different digital mode) is untouched -- microfft doesn't
# support f64, and that usage was never part of the no_std-buildability
# problem this dependency solves.
microfft = { version = "0.6", features = ["size-512", "size-1024"], optional = true }

[build-dependencies]
cc = "1.0"

[features]
# Default-on: everything in the crate (FT8, WSPR, PSK31, RTTY, D-STAR, the whole AMBE tree,
# Codec2 1600, the floating-point Codec2 3200 reference and adapters). Turning it off
# (`--no-default-features`) builds ONLY the fixed-point Codec2 3200 path as `no_std`, using `core`
# only (no heap, no floating-point unit needed). See docs/CODEC2_NO_STD.md.
default = ["std"]
std = ["dep:libm", "dep:rustfft", "dep:microfft", "codec2_16k_bridge"]
# The 16 kHz output spectral bridge (about 19 KB extra decoder state). Off unless asked for; the
# `std` build turns it on so the default build keeps every existing API.
codec2_16k_bridge = []
# Instruction-count hooks for the bare-metal bench (tools/codec2_riscv32_bench): the crate calls an
# extern `codec2_profile_mark(id)` the harness provides. Off by default; adds no code when off.
codec2_profile = []
# AMBE+2 (DMR / Yaesu System Fusion / P25 Phase 2 half-rate, TIA-102.BABA-1's 2009 addendum) is
# covered by 12 specific named patents -- off by default, on only for internal chip-compatibility
# testing. See src/ambe_plus_2/mod.rs's own doc comment and src/ambe/AMBE_PLUS_2_NOTES.md for the
# authorization history. `cargo build`/`cargo test` (no flags) must never compile any of this --
# verified directly, not just assumed from the #[cfg] attribute's placement.
ambe_plus_2 = []

