[package]
name = "ham_digital_modes"
version = "0.1.0"
edition = "2021"
description = "Amateur radio digital mode encode/decode: PSK31, WSPR, FT8"
license = "LGPL-3.0-or-later"

[dependencies]
# For erf() in ft8.rs's GFSK transmit waveform synthesis (see
# docs/references/FT8_FT4_GFSK_WAVEFORM_SPEC.md) -- Rust's std never
# stabilized erf, and this needs to be accurate (it directly shapes a
# real transmitted signal's spectrum), not a hand-rolled approximation.
# libm is a pure-Rust, MIT/Apache-2.0 port of the actual C math library
# algorithms, not a crude approximation of its own.
libm = "0.2"
# wspr_decode.rs's sync search: FT8's own decode takes the vendored-C
# route (ft8.rs, vendor/ft8_lib, MIT-licensed) instead of a from-scratch
# DSP reimplementation, but no equivalent permissively-licensed C WSPR
# decoder exists to vendor the same way -- the real reference decoder
# (`wsprd`, part of WSJT-X) is GPL, and the MIT-licensed reference this
# session actually used (`weakmon`'s `wspr.py`) is pure Python, not a C
# library that could be FFI'd in. rustfft is MIT/Apache-2.0, so it's
# used directly for the STFT the sync search needs, rather than
# hand-rolling a DFT.
rustfft = "6"

[build-dependencies]
cc = "1.0"
