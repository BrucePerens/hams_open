# Standalone measurement harness (not part of the crate build): see README section in prep.sh.
[workspace]

[package]
name = "codec2_riscv32_bench"
version = "0.1.0"
edition = "2021"
[dependencies]
# The real crate, no_std: no copying of sources any more.
ham_digital_modes = { path = "../..", default-features = false }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
[profile.dev]
panic = "abort"
[features]
# Per-stage instruction marks inside the crate (its `codec2_profile` feature). Turn off with
# `--no-default-features` for the plain whole-frame counts with zero hook overhead.
default = ["profile"]
profile = ["ham_digital_modes/codec2_profile"]
small = []
# Also build the 16 kHz spectral bridge (about 19 KB more decoder state) to measure its cost.
bridge = ["ham_digital_modes/codec2_16k_bridge"]
